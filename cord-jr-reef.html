<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CORD jr</title>
<style>
  @font-face{font-family:"Galmuri11";src:url("assets/fonts/Galmuri11.woff2") format("woff2");font-weight:400}
  @font-face{font-family:"Galmuri11";src:url("assets/fonts/Galmuri11-Bold.woff2") format("woff2");font-weight:700}
  html,body{height:100%;margin:0;overflow:hidden;background:#A0D6D5;color:#3b3b40;font-family:"Galmuri11",monospace;
    -webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0;background:#A0D6D5}   /* 모든 reef 기본 배경색 */
  /* 뒤에 깔리는 물속 움짤 (반투명) */
  .bgfx{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5;pointer-events:none}
  canvas{position:relative;z-index:1;display:block;width:100%;height:100%;touch-action:none}
  #name{position:absolute;left:10px;top:8px;font-size:11px;color:#3b3b40;z-index:5}
</style>
</head>
<body data-reef="cord-jr">
<div id="stage"><img class="bgfx" src="assets/reef/water-cord.webp" alt=""><div id="name">CORD jr</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="reef-kit.js"></script>
<script>
(function(){
"use strict";
/* CORD jr 거북이 장면
   reef-data.json의 cord-jr 설정(거북이, 할 말)을 읽어서 카메라 없이 보여줌
   All Reefs에서 고치면 30초 안에 여기도 바뀜 (원본은 cord-jr.html) */
var kit = ReefKit(THREE);
var REEF_ID = document.body.getAttribute('data-reef') || 'cord-jr';

var stage = document.getElementById('stage');
var renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
stage.insertBefore(renderer.domElement, stage.firstChild);
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 600);
kit.lights(scene);
var group = new THREE.Group(); scene.add(group);
var turtles = [], talk = null;

// 데이터 → 거북이 만들기 (다시 불러도 됨)
function build(d){
  var r = kit.reef(d, REEF_ID), cfg = r ? r.config : {};
  kit.applyStyle(d.style);
  turtles.forEach(kit.dispose); turtles = [];
  (cfg.lanes || []).forEach(function(lane, i){
    var m = kit.find(d, lane.species);
    if (!m) return;
    var variant = (typeof lane.variant === 'number') ? m.variants[lane.variant] : lane.variant;
    var effects = (lane.effects || []).concat(m.effects || []).map(function(id){ return kit.effect(d, id); }).filter(Boolean);
    var f = kit.build(m, {variant:variant, effects:effects, phase:(+lane.ph || 0) + i * 0.37, scale:+lane.scale || 1});
    f.userData.lane = lane;
    group.add(f); turtles.push(f);
  });
  document.getElementById('name').textContent = cfg.title || (r && r.name) || 'CORD jr';
  if (!talk) talk = kit.Talk(stage, camera, d.style); else { talk.setStyle(d.style); talk.clear(); }
  cam.radius = +cfg.radius || 44;
  turtles.forEach(function(f){ kit.steer(f, f.userData.lane, t); });
}

// 손가락으로 돌려보기
var cam = {theta:0.7, phi:1.2, radius:44};
function applyCam(){
  cam.phi = Math.max(0.2, Math.min(Math.PI - 0.2, cam.phi));
  cam.radius = Math.max(15, Math.min(120, cam.radius));
  var sp = Math.sin(cam.phi);
  camera.position.set(cam.radius*sp*Math.sin(cam.theta), cam.radius*Math.cos(cam.phi), cam.radius*sp*Math.cos(cam.theta));
  camera.lookAt(0, 0, 0);
}
var el = renderer.domElement, last = null, down = null;
el.addEventListener('pointerdown', function(e){ last = down = {x:e.clientX, y:e.clientY, t:performance.now()}; try{ el.setPointerCapture(e.pointerId); }catch(er){} });
el.addEventListener('pointermove', function(e){
  if (!last) return;
  cam.theta -= (e.clientX - last.x) * 0.006; cam.phi -= (e.clientY - last.y) * 0.006;
  last = {x:e.clientX, y:e.clientY}; applyCam();
});
el.addEventListener('pointerup', function(e){
  // 거의 안 움직이고 뗐으면 거북이를 누른 것 → 한마디
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 7 && performance.now() - down.t < 450){
    var r = el.getBoundingClientRect();
    var f = kit.pick(camera, (e.clientX - r.left)/r.width*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1, turtles);
    if (f && talk) talk.say(f, kit.nextLine(f));
  }
  last = down = null;
});
el.addEventListener('wheel', function(e){ e.preventDefault(); cam.radius *= Math.exp(e.deltaY * 0.0013); applyCam(); }, {passive:false});

function resize(){
  var w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

// 움직이기 + 가끔 아무나 한마디
var clock = new THREE.Clock(), t = 0, talkT = 0;
function frame(){
  requestAnimationFrame(frame);
  var dt = Math.min(clock.getDelta(), 0.05); t += dt;
  cam.theta += dt * 0.08; applyCam();
  kit.tick(t);
  for (var i = 0; i < turtles.length; i++){ kit.steer(turtles[i], turtles[i].userData.lane, t); kit.animate(turtles[i], t); }
  talkT += dt;
  if (talkT > 4 && talk && turtles.length){ talkT = 0; var p = turtles[Math.floor(Math.random()*turtles.length)]; talk.say(p, kit.nextLine(p)); }
  if (talk) talk.update();
  renderer.render(scene, camera);
}

resize(); applyCam();
var gotLive = false;
kit.loadData().then(function(d){
  if (!gotLive) build(d);
  frame();
  kit.watchData(d.updated, build);
}).catch(function(){ document.getElementById('name').textContent = 'reef-data.json을 읽지 못했어요'; });
// All Reefs 미리보기 창에서는 고치는 중인 데이터를 바로 받음
kit.onLiveData(function(d, m){ gotLive = true; if (m && m.reef) REEF_ID = m.reef; build(d); });
})();
</script>
</body>
</html>
