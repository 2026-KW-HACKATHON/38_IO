<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reef QR</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/xp-font.css">
</head>
<body>
<div class="page">
  <header>
    <h1>모바일 접속 QR</h1>
    <a class="pill" href="index.html">AR 화면</a>
  </header>
  <div class="card center">
    <div id="qrbox"></div>
    <code id="url"></code>
    <p class="muted">폰 카메라로 찍으면 바로 접속합니다. 카카오톡 안에서 열리면 카메라가 막힐 수 있으니 Chrome이나 Safari로 열어 주십시오.</p>
    <button class="pill" id="copy" type="button">주소 복사</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  // 이 페이지가 열린 주소의 첫 화면을 QR로 만듦
  var url = location.origin + location.pathname.replace(/[^\/]*$/, '');
  document.getElementById('url').textContent = url;
  new QRCode(document.getElementById('qrbox'), { text: url, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.M });
  document.getElementById('copy').addEventListener('click', function () {
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { document.getElementById('copy').textContent = '복사됨'; });
  });
})();
</script>
</body>
</html>
