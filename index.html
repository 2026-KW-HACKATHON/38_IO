<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>월계 아쿠아</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/vista.css">
<link rel="stylesheet" href="assets/fonts/dossaemmul.css">
</head>
<body data-reef="first">
<div id="stage">
  <video id="cam" playsinline muted autoplay class="hidden"></video>
  <canvas id="gl"></canvas>

  <!-- 위쪽: 이름, 권한 상태, 로그인 -->
  <div id="top">
    <!-- 처음 화면으로 돌아가기 -->
    <button id="bBack" class="hidden" type="button" title="뒤로" aria-label="처음 화면으로">
      <svg viewBox="0 0 32 32" aria-hidden="true"><defs>
        <linearGradient id="bkA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc3f5"/><stop offset=".5" stop-color="#1f6fc4"/><stop offset=".52" stop-color="#0d58ad"/><stop offset="1" stop-color="#3fb2ee"/></linearGradient>
        <linearGradient id="bkB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity=".1"/></linearGradient></defs>
        <circle cx="16" cy="16" r="15" fill="#0b2f8a"/><circle cx="16" cy="16" r="13.6" fill="url(#bkA)"/>
        <ellipse cx="16" cy="10" rx="10.5" ry="6.5" fill="url(#bkB)"/>
        <path d="M23.5 16H10M15.5 10.2 9.6 16l5.9 5.8" fill="none" stroke="#2a4a6a" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M23.5 16H10M15.5 10.2 9.6 16l5.9 5.8" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div id="brand">
      <b>월계 아쿠아</b>
      <div id="chips" class="hidden">
        <span class="chip" id="cCam">CAM —</span>
        <span class="chip" id="cGyro">GYRO —</span>
        <span class="chip" id="cLoc">LOC —</span>
      </div>
    </div>
    <div id="auth"></div>
  </div>

  <!-- 아래쪽: reef 전환 버튼 -->
  <div id="bottom" class="hidden">
    <button class="pill" id="bRecenter" type="button">위치 다시 잡기</button>
    <!-- [임시-촬영저장 시작] 이 구간과 js/capture-temp.js를 지우면 촬영 기능이 빠짐 -->
    <button class="pill" id="bShot" type="button">촬영</button>
    <!-- [임시-촬영저장 끝] -->
  </div>

  <!-- 처음 화면: 비스타 유리 창 'About QRium', 로그인 없이 바로 시작 가능 -->
  <div id="gate">
    <div class="about" role="dialog" aria-labelledby="aboutTitle">
      <div class="abar"><span class="attl" id="aboutTitle">About QRium</span><button class="acls" id="gateClose" type="button" title="닫기" aria-label="닫기"></button></div>
      <div class="abanner">
        <img src="assets/start/banner.webp" alt="">
        <div class="alogo"><span class="l1">월계 아쿠아</span><span class="l2">QRium</span></div>
      </div>
      <div class="abody">
        <p><span class="lead">월계 아쿠아 (QRium)</span><br>Version 0.1 (Beta)<br>Copyright © 2026 38_IO</p>
        <p>휴대폰 카메라 화면 위에 물고기가 헤엄칩니다.<br>로그인 없이 바로 볼 수 있습니다.</p>
        <p class="fine">카메라 · 위치 · 움직임 센서 권한을 요청합니다.
          <!-- [임시-촬영저장 시작] -->
          촬영한 사진은 사용자의 기기에 저장됩니다.
          <!-- [임시-촬영저장 끝] -->
          로그인하면 접속 기록과 대략적인 위치가 관리자에게 표시됩니다.</p>
        <!-- 나의 공간: 로그인하면 보임 -->
        <p class="modes hidden" id="mySpace"><a href="xp_web.html">나의 공간으로 이동합니다.</a></p>
        <hr>
        <div class="abtns">
          <button class="xbtn" id="goOrbit" type="button">카메라 없이 둘러보기</button>
          <button class="xbtn def" id="go" type="button">AR 시작</button>
        </div>
      </div>
    </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="reef-kit.js"></script>
<script src="reef-model.js"></script>
<script src="js/ar.js"></script>
<!-- [임시-촬영저장 시작] -->
<script src="js/capture-temp.js"></script>
<!-- [임시-촬영저장 끝] -->
</body>
</html>
