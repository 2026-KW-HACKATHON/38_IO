<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>디저트카페 후아나 · 월계 아쿠아</title>
<link rel="stylesheet" href="assets/fonts/dossaemmul.css">
<link rel="stylesheet" href="css/wall.css">
</head>
<body>
<div id="app">
  <!-- 위쪽: 제목과 작은 링크 -->
  <header id="head">
    <div class="ttl"><b>디저트카페 후아나</b><span>한 줄 남기면 물고기가 어항에 풀려나요</span></div>
    <nav class="links">
      <button id="bLogin" type="button">카카오 로그인</button>
      <a href="xp_web.html">월계 공간</a>
    </nav>
  </header>

  <!-- 어항: 남긴 리뷰마다 물고기 한 마리, 2분 안에 같이 남기면 한 무리 -->
  <main id="tank">
    <img class="bgfx" src="assets/reef/water-tank.webp" alt="">
    <canvas id="gl"></canvas>
    <p id="empty" class="hidden">아직 물고기가 없어요. 첫 리뷰를 남겨 보세요!</p>
  </main>

  <!-- 아래쪽: 남기기 / 보기 -->
  <section id="sheet">
    <div class="tabs">
      <button id="tWrite" class="on" type="button">남기기</button>
      <button id="tList" type="button">리뷰 보기 <b id="cnt"></b></button>
    </div>

    <div id="pWrite">
      <!-- 위치 확인 상태와 안내 -->
      <div id="gstat"></div>
      <div id="form" class="hidden">
        <div class="lbl">물고기 고르기</div>
        <div id="picks" class="picks"></div>
        <label class="fld"><span>닉네임 (선택)</span><input id="nick" type="text" maxlength="12" autocomplete="off" placeholder="비워도 돼요"></label>
        <label class="fld"><span>한 줄 평</span><input id="body" type="text" maxlength="60" autocomplete="off" placeholder="단어나 이모지도 좋아요 😊"></label>
        <button id="send" class="big" type="button">물고기 풀어주기</button>
      </div>
    </div>

    <div id="pList" class="hidden"><div id="list"></div></div>
  </section>
</div>
<input id="rcpt" type="file" accept="image/*" hidden>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/spots.js"></script>
<script src="js/receipt.js"></script>
<script src="reef-kit.js"></script>
<script src="reef-model.js"></script>
<script src="js/wall.js"></script>
</body>
</html>
