<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reef AR</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body data-reef="voxel">
<div id="stage">
  <video id="cam" playsinline muted autoplay class="hidden"></video>
  <canvas id="gl"></canvas>

  <!-- 위쪽: 이름, 권한 상태, 로그인 -->
  <div id="top">
    <div id="brand">
      <b>Reef AR</b>
      <div id="chips" class="hidden">
        <span class="chip" id="cCam">CAM —</span>
        <span class="chip" id="cGyro">GYRO —</span>
        <span class="chip" id="cLoc">LOC —</span>
      </div>
    </div>
    <div id="auth"></div>
  </div>

  <!-- 아래쪽: reef 전환 버튼 -->
  <div id="bottom" class="hidden">
    <button class="pill" id="bAquarium" type="button" aria-pressed="true">어항</button>
    <button class="pill gold" id="bFishing" type="button" aria-pressed="false">낚시</button>
    <button class="pill" id="bRecenter" type="button">위치 다시 잡기</button>
    <!-- [임시-촬영저장 시작] 이 구간과 js/capture-temp.js 파일을 지우면 촬영 기능이 통째로 빠집니다 -->
    <button class="pill" id="bShot" type="button">촬영</button>
    <!-- [임시-촬영저장 끝] -->
  </div>

  <!-- 처음 화면: 로그인 없이 바로 시작 가능 -->
  <div id="gate">
    <h1>Reef AR</h1>
    <p>폰 카메라 화면 위에 물고기가 헤엄쳐요. 로그인 없이 바로 볼 수 있어요.</p>
    <button class="primary" id="go" type="button">AR 시작</button>
    <button class="ghost" id="goOrbit" type="button">카메라 없이 둘러보기</button>
    <p class="fine">카메라 · 위치 · 움직임 센서 권한을 물어봐요
      <!-- [임시-촬영저장 시작] -->
      · 촬영한 사진은 내 기기에 저장돼요
      <!-- [임시-촬영저장 끝] -->
      <br>로그인하면 접속 기록과 대략적인 위치가 관리자에게 보여요</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="reef-kit.js"></script>
<script src="js/ar.js"></script>
<!-- [임시-촬영저장 시작] -->
<script src="js/capture-temp.js"></script>
<!-- [임시-촬영저장 끝] -->
</body>
</html>
