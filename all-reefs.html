<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>All Reefs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root{
    color-scheme:light;
    --ground:#F1ECF7; --raised:#FFFFFF; --sunk:#E9E3F3; --sunk-2:#DFD7EC;
    --edge:rgba(92,74,120,.15); --edge-strong:rgba(92,74,120,.32);
    --ink:#2F2842; --ink-soft:#625879; --ink-faint:#938BA8;
    --coral:#D9733A; --coral-ink:#241305; --coral-wash:rgba(217,115,58,.13);
    --volt:#5A56E0; --volt-wash:rgba(90,86,224,.12);
    --mint:#2F8F6A; --warn:#C24B31; --warn-wash:rgba(194,75,49,.1);
    --shadow:0 12px 30px -22px rgba(47,40,66,.7);
    --check-a:#EFEAF6; --check-b:#E4DDEF; --gridline:rgba(47,40,66,.12);
    --r:12px;
    --ui:"IBM Plex Sans KR","Quicksand",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --ground:#151229; --raised:#1F1937; --sunk:#110E22; --sunk-2:#191430;
      --edge:rgba(196,183,228,.14); --edge-strong:rgba(196,183,228,.3);
      --ink:#EDE7FA; --ink-soft:#B4AAD2; --ink-faint:#7C7398;
      --coral:#F09A5E; --coral-ink:#241305; --coral-wash:rgba(240,154,94,.15);
      --volt:#9A96FF; --volt-wash:rgba(154,150,255,.14);
      --mint:#6FCFA6; --warn:#FF9878; --warn-wash:rgba(255,152,120,.12);
      --shadow:0 12px 34px -22px rgba(0,0,0,.9);
      --check-a:#1A1531; --check-b:#221C3C; --gridline:rgba(237,231,250,.1);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --ground:#151229; --raised:#1F1937; --sunk:#110E22; --sunk-2:#191430;
    --edge:rgba(196,183,228,.14); --edge-strong:rgba(196,183,228,.3);
    --ink:#EDE7FA; --ink-soft:#B4AAD2; --ink-faint:#7C7398;
    --coral:#F09A5E; --coral-ink:#241305; --coral-wash:rgba(240,154,94,.15);
    --volt:#9A96FF; --volt-wash:rgba(154,150,255,.14);
    --mint:#6FCFA6; --warn:#FF9878; --warn-wash:rgba(255,152,120,.12);
    --shadow:0 12px 34px -22px rgba(0,0,0,.9);
    --check-a:#1A1531; --check-b:#221C3C; --gridline:rgba(237,231,250,.1);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0}
  body{background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:13.5px;line-height:1.5}
  button,input,select,textarea{font:inherit;color:inherit}
  .mono{font-family:var(--mono)}

  /* ── 틀 ── */
  #app{min-height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:168px minmax(0,1fr);
    grid-template-areas:"bar bar" "nav main"}
  #bar{grid-area:bar;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));
    border-bottom:1px solid var(--edge);background:var(--raised);position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:10px;margin-right:auto}
  .brand canvas{width:34px;height:20px;image-rendering:pixelated}
  .brand h1{margin:0;font-family:"Quicksand",var(--ui);font-weight:700;font-size:18px;letter-spacing:.01em}
  .brand small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.07em;color:var(--ink-faint);text-transform:uppercase}
  .chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--ink-soft);
    border:1px solid var(--edge);border-radius:999px;padding:3px 10px;white-space:nowrap}
  .chip.ok{color:var(--mint);border-color:color-mix(in srgb, var(--mint) 45%, transparent)}
  .chip.busy{color:var(--coral);border-color:color-mix(in srgb, var(--coral) 45%, transparent)}
  #nav{grid-area:nav;border-right:1px solid var(--edge);padding:14px 10px;display:flex;flex-direction:column;gap:3px;
    position:sticky;top:61px;align-self:start;height:calc(100vh - 61px)}
  #nav button{appearance:none;border:0;background:transparent;text-align:left;padding:8px 11px;border-radius:9px;
    cursor:pointer;color:var(--ink-soft);font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:6px}
  #nav button:hover{background:var(--sunk);color:var(--ink)}
  #nav button[aria-current="true"]{background:var(--coral-wash);color:var(--ink);font-weight:600}
  #nav button .n{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint)}
  #nav .sep{height:1px;background:var(--edge);margin:8px 6px}
  main{grid-area:main;padding:16px;min-width:0}
  @media (max-width:820px){
    #app{grid-template-columns:1fr;grid-template-areas:"bar" "nav" "main"}
    #bar{position:static}
    #nav{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--edge);padding:8px 16px}
    #nav button{white-space:nowrap}
    #nav .sep{display:none}
  }

  /* ── 공통 부품 ── */
  .card{background:var(--raised);border:1px solid var(--edge);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;min-width:0}
  .card h2{margin:0 0 3px;font-size:14px;font-weight:700}
  .card h3{margin:14px 0 8px;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase;font-family:var(--mono)}
  .card .sub{margin:0 0 12px;font-size:12.5px;color:var(--ink-soft)}
  .stack{display:grid;gap:14px;align-content:start;min-width:0}
  .btn{appearance:none;border:1px solid var(--edge-strong);background:var(--raised);border-radius:9px;padding:6px 12px;
    font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:var(--coral)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--coral);border-color:var(--coral);color:var(--coral-ink)}
  .btn.volt{background:var(--volt);border-color:var(--volt);color:#fff}
  .btn.ghost{background:transparent;border-style:dashed;color:var(--ink-soft)}
  .btn.small{padding:3px 8px;font-size:11.5px;border-radius:7px}
  .btn.danger:hover{border-color:var(--warn);color:var(--warn)}
  .btn[aria-pressed="true"]{background:var(--volt-wash);border-color:var(--volt);color:var(--ink)}
  :focus-visible{outline:2px solid var(--coral);outline-offset:2px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grow{flex:1;min-width:0}
  label.f{display:grid;gap:3px;min-width:0}
  label.f > span{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-faint)}
  input[type=text],input[type=number],input[type=password],select,textarea{width:100%;min-width:0;background:var(--sunk);
    border:1px solid var(--edge);border-radius:8px;padding:6px 8px;font-size:12.5px}
  input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
  textarea{font-family:var(--mono);font-size:11.5px;line-height:1.45;resize:vertical}
  input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--edge);border-radius:7px;background:none;cursor:pointer}
  input[type=range]{width:100%;accent-color:var(--coral)}
  input[type=checkbox]{accent-color:var(--coral)}
  .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .hint{font-size:12px;color:var(--ink-faint);margin:6px 0 0}
  .hint b{color:var(--ink-soft);font-weight:600}
  .note{padding:9px 12px;border-radius:9px;font-size:12.5px;line-height:1.5;background:var(--sunk);color:var(--ink-soft)}
  .note.warn{background:var(--warn-wash);color:var(--warn)}
  .note.ok{background:color-mix(in srgb, var(--mint) 12%, transparent);color:var(--mint)}
  .slider{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;margin-bottom:6px}
  .slider span{font-size:12px;color:var(--ink-soft)}
  .slider output{font-family:var(--mono);font-size:11px;text-align:right;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .pill{display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid var(--edge);color:var(--ink-soft)}
  .chips{display:flex;gap:5px;flex-wrap:wrap}
  .chips .btn{padding:3px 9px;font-size:11.5px;font-weight:500}
  .empty{padding:18px;text-align:center;color:var(--ink-faint);font-size:12.5px}

  /* ── 물고기 편집 ── */
  .editor{display:grid;grid-template-columns:200px minmax(0,1fr) minmax(300px,380px);gap:14px;align-items:start}
  @media (max-width:1260px){ .editor{grid-template-columns:180px minmax(0,1fr)} .editor .side3{grid-column:1 / -1} }
  @media (max-width:760px){ .editor{grid-template-columns:1fr} }
  .mlist{display:grid;gap:4px;max-height:70vh;overflow:auto;padding-right:2px}
  .mitem{appearance:none;border:1px solid transparent;background:transparent;border-radius:10px;padding:7px 8px;cursor:pointer;
    display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;text-align:left}
  .mitem:hover{background:var(--sunk)}
  .mitem[aria-current="true"]{background:var(--coral-wash);border-color:color-mix(in srgb, var(--coral) 40%, transparent)}
  .mitem img{width:44px;height:30px;object-fit:contain;image-rendering:pixelated}
  .mitem b{display:block;font-size:12.5px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mitem i{display:block;font-style:normal;font-family:var(--mono);font-size:10px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (max-width:760px){ .mlist{grid-auto-flow:column;grid-auto-columns:150px;max-height:none;overflow-x:auto} }

  .toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .toolbar .sep{width:1px;align-self:stretch;background:var(--edge);margin:0 3px}
  .seg{display:inline-flex;border:1px solid var(--edge);border-radius:9px;padding:2px;background:var(--sunk);gap:2px}
  .seg button{appearance:none;border:0;background:transparent;border-radius:7px;padding:4px 9px;font-size:12px;cursor:pointer;color:var(--ink-soft)}
  .seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
  .palette{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .sw{appearance:none;width:30px;height:30px;border-radius:7px;border:2px solid transparent;cursor:pointer;position:relative;padding:0;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
  .sw span{position:absolute;right:1px;bottom:0;font-family:var(--mono);font-size:9px;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000}
  .sw[aria-pressed="true"]{border-color:var(--ink);outline:2px solid var(--raised);outline-offset:-4px}
  .pxwrap{overflow:auto;border-radius:10px;border:1px solid var(--edge);background:var(--sunk);max-width:100%}
  #px{display:block;touch-action:none;cursor:crosshair;image-rendering:pixelated}
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .legend span{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-soft)}
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

  .preview3d{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:10px;overflow:hidden;
    background:radial-gradient(120% 90% at 50% 0%, var(--raised) 0%, var(--sunk) 70%);border:1px solid var(--edge)}
  .preview3d canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  .preview3d .over{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:5px;flex-wrap:wrap;z-index:5}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--edge);margin:12px -16px 12px;padding:0 12px;overflow-x:auto}
  .tabs button{appearance:none;border:0;background:transparent;padding:8px 10px;font-size:12.5px;font-weight:600;color:var(--ink-faint);
    border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
  .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--coral)}
  .plist{display:grid;gap:3px;margin-bottom:10px;max-height:220px;overflow:auto}
  .pitem{appearance:none;border:1px solid transparent;background:var(--sunk);border-radius:8px;padding:5px 8px;cursor:pointer;
    display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;text-align:left;font-size:12.5px}
  .pitem[aria-current="true"]{border-color:var(--coral);background:var(--coral-wash)}
  .pitem i{width:10px;height:10px;border-radius:3px}
  .pitem small{font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
  .lines{display:grid;gap:5px}
  .lines .row{flex-wrap:nowrap}

  /* ── reef 설정 ── */
  .reefs{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;align-items:start}
  @media (max-width:900px){ .reefs{grid-template-columns:1fr} }
  .frame{position:relative;width:100%;aspect-ratio:16/10;border-radius:10px;overflow:hidden;border:1px solid var(--edge);background:var(--sunk)}
  .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .lanes{display:grid;gap:8px}
  .lane{border:1px solid var(--edge);border-radius:10px;padding:10px;background:var(--sunk)}
  .lane summary{cursor:pointer;display:flex;gap:8px;align-items:center;list-style:none}
  .lane summary::-webkit-details-marker{display:none}
  .lane summary img{width:34px;height:22px;object-fit:contain;image-rendering:pixelated}
  .lane summary b{font-size:12.5px}
  .lane summary small{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-left:auto}
  .lane .body{margin-top:10px;display:grid;gap:8px}

  /* ── 말풍선 미리보기 ── */
  .bubblestage{position:relative;height:220px;border-radius:10px;border:1px solid var(--edge);overflow:hidden;
    background:radial-gradient(120% 90% at 50% 0%, #F9F2F3 0%, #EFEAF6 62%)}
  .bubblestage img{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);width:150px;image-rendering:pixelated}
  .bubblestage .reef-say{left:calc(50% - 20px);top:auto;bottom:calc(38% + 30px)}

  /* ── 창(모달) ── */
  .modal{position:fixed;inset:0;background:rgba(20,16,36,.46);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
  .modal[hidden]{display:none!important}
  .modal .card{width:min(980px,100%);max-height:calc(100vh - 32px);overflow:auto}
  .codebox{width:100%;min-height:52vh;font-size:12px;white-space:pre;tab-size:2}
  .photo{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
  @media (max-width:760px){ .photo{grid-template-columns:1fr} }
  #phCanvas{max-width:100%;display:block;border-radius:8px;background:var(--sunk);touch-action:none;cursor:crosshair}
  .drop{border:2px dashed var(--edge-strong);border-radius:10px;padding:22px;text-align:center;color:var(--ink-soft);cursor:pointer}
  .drop.on{border-color:var(--coral);background:var(--coral-wash)}
  .out{white-space:pre-wrap;font-family:var(--mono);font-size:11px;max-height:160px;overflow:auto;background:var(--sunk);border-radius:8px;padding:8px;color:var(--ink-soft)}
  .log{font-family:var(--mono);font-size:11px;background:var(--sunk);border-radius:8px;padding:8px 10px;max-height:220px;overflow:auto;white-space:pre-wrap;color:var(--ink-soft)}
  .files{display:grid;gap:4px;max-height:320px;overflow:auto}
  .files .row{background:var(--sunk);border-radius:8px;padding:5px 8px}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--ground);
    padding:9px 16px;border-radius:999px;font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;transition:.22s;z-index:90;max-width:calc(100% - 32px)}
  #toast.on{opacity:1;transform:translateX(-50%)}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
<link rel="stylesheet" href="css/xp-font.css">
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="brand">
      <canvas id="logo" width="17" height="10" aria-hidden="true"></canvas>
      <div><h1>All Reefs</h1><small>fish · items · reefs — one source</small></div>
    </div>
    <span class="chip" id="where">—</span>
    <span class="chip" id="saved">저장됨</span>
    <button class="btn" id="undo" type="button" title="되돌리기 (Ctrl+Z)">되돌리기</button>
    <button class="btn" id="zipBtn" type="button">전체 파일 받기</button>
    <span class="chip" id="pending" title="이 브라우저에 저장만 되고 아직 깃허브에 안 올린 것" hidden></span>
    <button class="btn primary" id="pushBtn" type="button">깃허브에 올리기</button>
  </header>
  <nav id="nav" aria-label="메뉴">
    <button type="button" data-tab="species">물고기 <span class="n" id="nSpecies"></span></button>
    <button type="button" data-tab="items">아이템 <span class="n" id="nItems"></span></button>
    <button type="button" data-tab="effects">이펙트 <span class="n" id="nEffects"></span></button>
    <button type="button" data-tab="style">말풍선·글꼴</button>
    <div class="sep"></div>
    <button type="button" data-tab="reefs">하위 reef <span class="n" id="nReefs"></span></button>
    <button type="button" data-tab="guide">설계 지침</button>
    <button type="button" data-tab="github">깃허브</button>
  </nav>
  <main id="main"></main>
</div>

<!-- 사진으로 만들기 -->
<div class="modal" id="photoModal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="phTitle">
    <div class="row"><h2 id="phTitle" class="grow">사진으로 물고기 만들기</h2><button class="btn small" type="button" data-close>닫기</button></div>
    <p class="sub">물고기가 옆으로 보이는 사진이 제일 잘 됩니다. 사진 위를 끌어서 물고기 부분만 네모로 골라 주십시오.</p>
    <div class="photo">
      <div>
        <label class="drop" id="phDrop" for="phFile">여기에 사진을 끌어놓거나 눌러서 고르기<input type="file" id="phFile" accept="image/*" hidden></label>
        <canvas id="phCanvas" hidden></canvas>
      </div>
      <div class="stack" style="gap:10px">
        <div class="g2">
          <label class="f"><span>이름</span><input type="text" id="phName" placeholder="예: 옐로우 탱"></label>
          <label class="f"><span>가로 칸 수</span><input type="number" id="phW" min="10" max="32" value="20"></label>
        </div>
        <div class="row"><span style="font-size:12px;color:var(--ink-soft)">사진 속 머리 방향</span>
          <div class="seg" id="phFace"><button type="button" data-v="right" aria-pressed="true">오른쪽</button><button type="button" data-v="left" aria-pressed="false">왼쪽</button></div>
        </div>
        <div class="row">
          <button class="btn" id="phAuto" type="button" disabled>자동 도트 변환</button>
          <button class="btn volt" id="phClaude" type="button" disabled>클로드에게 설계 맡기기</button>
          <select id="phTier" style="width:auto"><option value="quick">빠르게</option><option value="default" selected>보통</option><option value="complex">꼼꼼히</option></select>
          <button class="btn small" id="phStop" type="button" hidden>멈추기</button>
        </div>
        <p class="hint" id="phHint">사진을 고르면 버튼이 켜집니다.</p>
        <div class="out" id="phOut" hidden></div>
        <div id="phResult" hidden>
          <div class="row" style="align-items:flex-end"><img id="phThumb" alt="" style="image-rendering:pixelated;max-width:100%;background:var(--sunk);border-radius:8px;padding:6px"></div>
          <div class="row" style="margin-top:8px"><button class="btn primary" id="phAdd" type="button">새 물고기로 추가</button><span class="hint" id="phInfo"></span></div>
        </div>
      </div>

<script>
(function(){
"use strict";
/* All Reefs
   물고기·아이템·이펙트·말풍선을 한 곳(reef-data.json)에서 관리하고,
   같은 레포의 하위 reef들이 그 파일을 읽어서 똑같은 물고기를 보여줌 */

const kit = ReefKit(THREE);
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const main = $('#main');
// 클로드 안에서 열렸는지 (그러면 바깥 인터넷 요청은 막혀 있음)
const IN_CLAUDE = !!(window.claude && window.claude.use);

let D = null;            // 지금 고치고 있는 전체 데이터
let fileData = null;     // 같은 폴더의 reef-data.json (처음 받은 그대로)
let repoBase = '';       // 지금 작업이 바탕으로 삼은 레포 reef-data.json의 updated 값
let baseData = null;     // 그 레포 데이터 (올리지 않은 변경을 셀 때 씀)
function setBase(d){ baseData = d ? JSON.parse(JSON.stringify(d)) : null; repoBase = d ? String(d.updated || '') : ''; showPending(); }
// 레포와 달라진 물고기·reef 이름들
function pendingList(){
  if (!baseData || !D) return [];
  const out = [], same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  [['species', '물고기'], ['items', '아이템'], ['effects', '이펙트'], ['reefs', 'reef']].forEach(([k]) => {
    const a = {}, b = {};
    (baseData[k] || []).forEach(x => { a[x.id] = x; });
    (D[k] || []).forEach(x => { b[x.id] = x; });
    Object.keys(b).forEach(id => { if (!a[id]) out.push('+' + (b[id].name || id)); else if (!same(a[id], b[id])) out.push(b[id].name || id); });
    Object.keys(a).forEach(id => { if (!b[id]) out.push('-' + (a[id].name || id)); });
  });
  if (!same(baseData.style, D.style)) out.push('말풍선·글꼴');
  if (!same(baseData.guide, D.guide)) out.push('설계 지침');
  return out;
}
function showPending(){
  const el = document.getElementById('pending'); if (!el) return;
  const list = pendingList();
  el.hidden = !list.length;
  el.textContent = '안 올린 변경 ' + list.length + '개';
  el.title = '이 브라우저에 저장됨 · 아직 깃허브에 안 올림\n' + list.join(', ');
  const pb = document.getElementById('pushBtn');
  if (pb) pb.textContent = list.length ? '깃허브에 올리기 (' + list.length + ')' : '깃허브에 올리기';
}
const ui = {
  tab: 'species',
  sel: { species: 0, items: 0, effects: 0, reefs: 0 },
  pane: 'parts',                 // 오른쪽 칸: parts / motion / info / claude / json
  px: { target: 'side', mode: 'paint', tool: 'pen', ch: null, overlay: true },
  part: 0,                       // 고른 부위 번호
  pv: { swim: false, fx: [], variant: -1 }
};
let db = null, downloads = null, sample = null, sampleImages = false, sampleTools = false;

/* ───────── 작은 도구 ───────── */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, ms){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), ms || 2200);
}
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function numv(v, d){ v = parseFloat(v); return isFinite(v) ? v : d; }
function uid(prefix, list){
  let i = 1; const ids = new Set(list.map(x => x.id));
  while (ids.has(prefix + '-' + i)) i++;
  return prefix + '-' + i;
}
// 두 번 눌러야 실행되는 버튼 (브라우저 확인창을 못 쓰는 곳이라서)
function twoStep(btn, label, fn){
  let armed = false, h = null;
  const orig = btn.textContent;
  btn.addEventListener('click', () => {
    if (!armed){ armed = true; btn.textContent = label; btn.classList.add('danger'); h = setTimeout(() => { armed = false; btn.textContent = orig; }, 2600); return; }
    clearTimeout(h); armed = false; btn.textContent = orig; fn();
  });
}

/* ───────── 되돌리기 ───────── */
const hist = [];
let lastSnap = 0;
function snapshot(force){
  const now = performance.now();
  if (!force && now - lastSnap < 1200) return;
  lastSnap = now;
  hist.push(JSON.stringify(D));
  if (hist.length > 60) hist.shift();
}
function undo(){
  if (!hist.length) return toast('되돌릴 게 없습니다');
  D = kit.normalize(JSON.parse(hist.pop()));
  lastSnap = 0;
  changed(true); render();
  toast('한 단계 되돌렸습니다');
}
// 데이터를 바꿀 때는 이걸로: 되돌리기 저장 → 바꾸기 → 저장 예약/미리보기 갱신
function edit(fn, force){ snapshot(force); fn(); changed(); }

/* ───────── 저장 ───────── */
let saveTimer = null;
function setSaved(state){
  const el = $('#saved');
  el.className = 'chip' + (state === 'ok' ? ' ok' : state === 'busy' ? ' busy' : '');
  el.textContent = state === 'ok' ? (db ? '저장됨 · 클로드' : '저장됨 · 이 브라우저') : state === 'busy' ? '저장 중…' : '이 브라우저에만 저장';
}
function changed(noStamp){
  if (!noStamp) D.updated = new Date().toISOString();
  setSaved('busy');
  clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 700);
  clearTimeout(changed.t); changed.t = setTimeout(showPending, 300);
  schedulePreview();
  broadcast();
  counts();
}
// 창을 닫거나 새로고침할 때 아직 안 쓴 작업본을 바로 저장
window.addEventListener('pagehide', () => { if (saveTimer){ clearTimeout(saveTimer); saveTimer = null; if (D) saveNow(); } });
function saveNow(){
  const raw = JSON.stringify(D);
  // 브라우저 작업본은 어느 레포 버전 위에서 고친 건지 같이 저장 (레포가 바뀌면 버림)
  try { localStorage.setItem('allreefs.draft', JSON.stringify({ base: repoBase, data: D })); localStorage.removeItem('allreefs.data'); } catch(e){}
  if (db) db.doc('reef/data').set({ json: raw, updated: D.updated }).then(() => setSaved('ok')).catch(() => setSaved('local'));
  else setSaved('ok');
}

/* ───────── 하위 reef 미리보기 창에 지금 데이터 보내기 ───────── */
let bcTimer = null;
function broadcast(){
  clearTimeout(bcTimer);
  bcTimer = setTimeout(() => $$('iframe[data-reef]').forEach(sendTo), 250);
}
function sendTo(fr){
  try { fr.contentWindow.postMessage({ type: 'reef-data', data: D, reef: fr.dataset.reef, reset: fr.dataset.kind === 'console' }, '*'); } catch(e){}
}
window.addEventListener('message', e => {
  const m = e.data;
  if (m && m.type === 'reef-ready') $$('iframe[data-reef]').forEach(fr => { if (fr.contentWindow === e.source) sendTo(fr); });
});

/* ───────── 3D 미리보기 (하나 만들어서 여기저기 옮겨 씀) ───────── */
const PV = (function(){
  let renderer = null, scene, camera, root, obj = null, host = null, talk = null, ok = true;
  const cam = { theta: 0.55, phi: 1.2, r: 30, target: new THREE.Vector3() };
  let model = null, opts = {}, t = 0, pathT = 0, clock = new THREE.Clock();
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(35, 1, 0.1, 800);
    kit.lights(scene);
    root = new THREE.Group(); scene.add(root);
  } catch(e){ ok = false; }

  function applyCam(){
    cam.phi = clamp(cam.phi, 0.15, Math.PI - 0.15);
    cam.r = clamp(cam.r, 2, 400);
    const s = Math.sin(cam.phi);
    camera.position.set(cam.target.x + cam.r * s * Math.sin(cam.theta), cam.target.y + cam.r * Math.cos(cam.phi), cam.target.z + cam.r * s * Math.cos(cam.theta));
    camera.lookAt(cam.target);
  }
  // 끌어서 돌리기, 휠로 확대
  if (ok){
    const el = renderer.domElement;
    let last = null;
    el.addEventListener('pointerdown', e => { last = [e.clientX, e.clientY]; try { el.setPointerCapture(e.pointerId); } catch(er){} });
    el.addEventListener('pointermove', e => {
      if (!last) return;
      cam.theta -= (e.clientX - last[0]) * 0.008; cam.phi -= (e.clientY - last[1]) * 0.008;
      last = [e.clientX, e.clientY]; applyCam();
    });
    ['pointerup', 'pointercancel'].forEach(ev => el.addEventListener(ev, () => { last = null; }));
    el.addEventListener('wheel', e => { e.preventDefault(); cam.r *= Math.exp(e.deltaY * 0.0014); applyCam(); }, { passive: false });
  }

  function attach(container){
    if (!ok){ container.innerHTML = '<p class="empty">이 브라우저에서는 3D 미리보기를 못 켭니다.</p>'; return; }
    host = container;
    container.prepend(renderer.domElement);
    if (talk) talk.layer.remove();
    talk = kit.Talk(container, camera, D.style);
    resize();
  }
  function resize(){
    if (!host) return;
    const w = host.clientWidth || 300, h = host.clientHeight || w;
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  // 모델 보여주기. opts.effects: 이펙트 목록, opts.variant, opts.keepCam: 카메라 그대로
  function show(m, o){
    if (!ok) return;
    model = m; opts = o || {};
    if (obj){ kit.dispose(obj); obj = null; }
    if (!m) return;
    try {
      obj = kit.build(m, { effects: opts.effects || [], variant: opts.variant || null, phase: 0.3 });
    } catch(e){ console.error(e); toast('모양을 만들다 문제가 생겼습니다: ' + e.message); return; }
    root.add(obj);
    const S = new kit.Sampler(m), L = Math.max(S.W, S.H) * m.scale;
    obj.userData.lane = { path: 'loop', cx: 0, cy: 0, cz: 0, rx: L * 1.1, ry: L * 0.15, rz: L * 0.8, sp: 0.5, ph: 0 };
    if (!opts.keepCam){ cam.r = L * (ui.pv.swim ? 3.4 : 2.1); cam.target.set(0, 0, 0); }
    applyCam();
    if (talk) talk.setStyle(D.style);
  }
  function say(){
    if (!obj || !talk) return;
    const line = kit.nextLine(obj);
    talk.say(obj, line || '(할 말이 없습니다. 정보 칸에서 넣어 주십시오)');
  }
  function frame(){
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.05);
    if (!ok || !host || !host.isConnected) return;
    t += dt; pathT += dt;
    kit.tick(t);
    if (obj){
      if (ui.pv.swim && model.motion !== 'still' && model.motion !== 'spin' && model.motion !== 'float') kit.steer(obj, obj.userData.lane, pathT);
      else { obj.position.set(0, 0, 0); obj.rotation.set(0, 0, 0); }
      kit.animate(obj, t);
    }
    if (talk) talk.update();
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
  return { attach, show, say, resize, get obj(){ return obj; }, ok };
})();

// 바뀐 뒤 잠깐 기다렸다가 미리보기 다시 만들기

/* ───────── 파일 받기 ───────── */
function saveFile(filename, data, mime){
  if (downloads) return downloads.save({ filename, data });
  const blob = (data instanceof Blob) ? data : new Blob([data], { type: mime || 'text/plain' });
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  return Promise.resolve({ status: 'saved' });
}
function saved(p, what){
  return p.then(r => { if (r && r.status === 'delivered') return; toast(what + ' 받았습니다'); })

}

/* ───────── 도트 격자 다루기 ───────── */
// 지금 칠하는 곳의 격자: {rows, W, H, get, set}
function pxGrid(){
  const m = curModel(), t = ui.px.target;
  let host, key;
  if (faceOf(t)){
    const p = curPart(), f = faceOf(t);
    // 고른 부위에 이 면 도트가 없으면 옆모습으로 돌아감
    if (p && p.kind === 'box' && p.faces && p.faces[f]){ fitFace(p, f); host = p.faces; key = f; }
    else { ui.px.target = 'side'; host = m; key = 'side'; syncTarget(); }
  }
  else if (t === 'top'){ host = m; key = 'top'; if (!m.top) m.top = makeTop(m); }
  else if (t === 'part'){ const p = curPart(); if (!p || !p.paint){ ui.px.target = 'side'; host = m; key = 'side'; } else { host = p; key = 'paint'; } }
  else { host = m; key = 'side'; }
  const rows = host[key];
  return {
    get W(){ return host[key][0].length; }, get H(){ return host[key].length; },
    get: (c, r) => { const row = host[key][r]; if (!row || c < 0 || c >= row.length) return null; const ch = row.charAt(c); return ch === '.' ? null : ch; },
    set: (c, r, ch) => { const row = host[key][r]; if (!row || c < 0 || c >= row.length) return; host[key][r] = row.slice(0, c) + (ch || '.') + row.slice(c + 1); },
    rows
  };
}
// 박스 면: 앞·뒤는 세로=높이, 가로=두께 / 위·밑은 세로=두께, 가로=길이
const FACE_KEYS = ['face-front', 'face-back', 'face-top', 'face-bottom'];
const FACE_KO = { front: '앞면 (머리 쪽)', back: '뒷면 (꼬리 쪽)', top: '윗면', bottom: '밑면' };
const faceOf = t => FACE_KEYS.indexOf(t) >= 0 ? t.slice(5) : null;
function faceSize(p, f){ return (f === 'front' || f === 'back') ? { W: p.d, H: p.h } : { W: p.w, H: p.d }; }
// 지금 보이는 색 그대로 면 도트를 만듦 (부위 도트 > 옆모습)
function makeFace(m, p, f){
  const S = new kit.Sampler(m), sz = faceSize(p, f);
  const cell = (i, j) => {
    const r = p.paint && p.paint[j], c = r ? r.charAt(i) : '.';
    const ch = (c && c !== '.' && c !== 'X') ? c : (c === 'X' ? p.color : S.side(p.x + i, p.y + j));
    return ch && (ch in m.palette) ? ch : '.';
  };
  const out = [];
  for (let j = 0; j < sz.H; j++){
    let row = '';
    for (let i = 0; i < sz.W; i++){
      if (f === 'front') row += cell(p.w - 1, j);
      else if (f === 'back') row += cell(0, j);
      else if (f === 'top') row += cell(i, 0);
      else row += cell(i, p.h - 1);
    }
    out.push(row);
  }
  return out;
}
// 부위 크기가 바뀌었으면 면 도트 크기도 맞춤
function fitFace(p, f){
  const sz = faceSize(p, f), g = p.faces[f];
  for (let j = 0; j < sz.H; j++){ const r = String(g[j] || ''); g[j] = (r + '.'.repeat(sz.W)).slice(0, sz.W); }
  g.length = sz.H;
}
function syncTarget(){
  const t = ui.px.target, isFace = !!faceOf(t);
  $$('#pxTarget button').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === t));
  $$('#pxFace button').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === t));
  const p = curPart(), row = $('#faceRow');
  if ($('#pxFace')) $('#pxFace').style.opacity = p && p.kind === 'box' ? '' : '.45';
  if (row){ row.style.display = isFace ? '' : 'none'; if (isFace && p) $('#faceInfo').textContent = (p.id || '') + ' · ' + FACE_KO[faceOf(t)] + ' — 옆모습과 따로 칠함'; }
}
function makeTop(m){
  let D0 = 6;
  m.parts.forEach(p => { if (p.kind === 'box') D0 = Math.max(D0, p.d); });
  return Array.from({ length: D0 }, () => '.'.repeat(m.side[0].length));
}
function paintFromSide(m, p){
  const S = new kit.Sampler(m), out = [];
  for (let j = 0; j < p.h; j++){
    let s = '';
    for (let i = 0; i < p.w; i++) s += S.side(p.x + i, p.y + j) || '.';
    out.push(s);
  }
  if (!out.join('').replace(/\./g, '')) out[0] = (Object.keys(m.palette)[0] || 'a') + out[0].slice(1);
  return out;
}
function shiftParts(m, dx, dy){
  m.parts.forEach(p => {
    if (p.kind === 'free'){ p.pos[0] += dx; p.pos[1] += dy; }
    else { p.x += dx; p.y += dy; }
  });
}
function resizeGrid(m, side, delta){
  const W = m.side[0].length, H = m.side.length;
  const addCol = (rows, front) => rows.map(r => front ? '.' + r : r + '.');
  const cutCol = (rows, front) => rows.map(r => front ? r.slice(1) : r.slice(0, -1));
  if (side === 'L' || side === 'R'){
    if (delta < 0 && W <= 2) return;
    const front = side === 'L';
    m.side = delta > 0 ? addCol(m.side, front) : cutCol(m.side, front);
    if (m.top) m.top = delta > 0 ? addCol(m.top, front) : cutCol(m.top, front);
    if (front) shiftParts(m, delta, 0);
  } else {
    if (delta < 0 && H <= 2) return;
    const blank = '.'.repeat(W);
    if (side === 'T'){ if (delta > 0) m.side.unshift(blank); else m.side.shift(); shiftParts(m, 0, delta); }
    else { if (delta > 0) m.side.push(blank); else m.side.pop(); }
  }
}
function flipModel(m){
  const W = m.side[0].length, rev = r => r.split('').reverse().join('');
  m.side = m.side.map(rev);
  if (m.top) m.top = m.top.map(rev);
  m.parts.forEach(p => {
    if (p.kind === 'free'){ p.pos[0] = W - 1 - p.pos[0]; p.rot[1] = -p.rot[1]; p.rot[2] = -p.rot[2]; }
    else if (p.kind === 'plane' && p.axis === 'x') p.x = W - 1 - p.x;
    else p.x = W - p.x - p.w;
    if (p.paint) p.paint = p.paint.map(rev);
  });
}

function drawPalette(){

  }
  keys.forEach(k => {
    const b = document.createElement('button');

    b.setAttribute('aria-pressed', ui.px.ch === k);

    box.appendChild(b);

  const sep = document.createElement('span'); sep.style.width = '6px'; box.appendChild(sep);
  if (ui.px.ch && ui.px.ch !== 'X'){
    const ci = document.createElement('input'); ci.type = 'color'; ci.value = m.palette[ui.px.ch] || '#888888';
    ci.title = '고른 색 바꾸기';
    ci.addEventListener('input', () => { edit(() => { m.palette[ui.px.ch] = ci.value; }); drawPx(); updateThumbs(); $$('#palette .sw[aria-pressed="true"]').forEach(s => s.style.background = ci.value); });
    box.appendChild(ci);
    const hex = document.createElement('input'); hex.type = 'text'; hex.value = m.palette[ui.px.ch]; hex.style.width = '86px'; hex.className = 'mono';
    hex.addEventListener('change', () => { if (/^#[0-9a-f]{6}$/i.test(hex.value.trim())){ edit(() => { m.palette[ui.px.ch] = hex.value.trim(); }, true); drawPalette(); drawPx(); updateThumbs(); } else toast('#RRGGBB 모양으로 써 주십시오'); });
    box.appendChild(hex);
  }
  const add = document.createElement('button'); add.type = 'button'; add.className = 'btn small'; add.textContent = '+ 색';
  add.addEventListener('click', () => {
    const k = CHARS.split('').find(c => !(c in m.palette));
    if (!k) return toast('색이 너무 많습니다');
    edit(() => { m.palette[k] = '#8FB8E8'; }, true); ui.px.ch = k; drawPalette();
  });
  box.appendChild(add);
  if (ui.px.ch && ui.px.ch !== 'X'){
    const del = document.createElement('button'); del.type = 'button'; del.className = 'btn small'; del.textContent = '이 색 지우기';
    twoStep(del, '정말 지우시겠습니까?', () => {
      const k = ui.px.ch;
      edit(() => {
        const wipe = r => r.split(k).join('.');
        delete m.palette[k];
        m.side = m.side.map(wipe); if (m.top) m.top = m.top.map(wipe);
        m.parts.forEach(p => {
          if (p.paint){
            const S = new kit.Sampler(m);
            p.paint = p.paint.map((r, j) => r.split('').map((c, i) => c !== k ? c : (p.kind === 'plane' ? (S.side(p.x + i, p.y + j) || '.') : '.')).join(''));
            if (!p.paint.join('').replace(/[.X]/g, '')) delete p.paint;
          }
          if (p.faces) Object.keys(p.faces).forEach(f => { p.faces[f] = p.faces[f].map(wipe); });
          if (p.color === k) p.color = Object.keys(m.palette)[0];
        });
      }, true);
      ui.px.ch = null; drawPalette(); drawPx(); updateThumbs();
    });
    box.appendChild(del);

let PX = null;
function setupPx(){
  const cv = $('#px'); if (!cv) return;
  PX = { cv, ctx: cv.getContext('2d'), cell: 20, drag: null };
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('pointerdown', pxDown);
  cv.addEventListener('pointermove', pxMove);
  ['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, pxUp));
  new ResizeObserver(() => drawPx()).observe($('#pxwrap'));
}
function roleColor(p){ return (ROLE[p.role] || ROLE.body).c; }
function drawPx(){
  if (!PX || !PX.cv.isConnected) return;
  const m = curModel(), g = pxGrid(), W = g.W, H = g.H;
  const avail = Math.max(160, ($('#pxwrap').clientWidth || 500) - 2);
  const cell = Math.max(8, Math.min(30, Math.floor(avail / W)));
  PX.cell = cell;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  PX.cv.width = W * cell * dpr; PX.cv.height = H * cell * dpr;

// 부위가 격자에서 차지하는 네모 (지금 보고 있는 면 기준)
function partRect(m, p){

    if (p.kind !== 'box' && !(p.kind === 'plane' && p.axis === 'y')) return null;
    const Dp = m.top ? m.top.length : 0;
    const depth = p.kind === 'box' ? p.d : p.h;
    return { x: p.x, y: Math.floor(p.z - depth / 2 + Dp / 2), w: p.w, h: depth };
  }
  if (p.kind === 'free') return { x: p.pos[0] - p.size[0] / 2 + 0.5, y: p.pos[1] - p.size[1] / 2 + 0.5, w: Math.max(0.4, p.size[0]), h: Math.max(0.4, p.size[1]) };
  if (p.kind === 'plane' && p.axis === 'y') return { x: p.x, y: p.y, w: p.w, h: 1 };
  if (p.kind === 'plane' && p.axis === 'x') return { x: p.x, y: p.y, w: 1, h: p.h };

    m.parts.forEach((pp, i) => {

      if (at.fx >= rr.x && at.fx < rr.x + rr.w && at.fy >= rr.y && at.fy < rr.y + rr.h && rr.w * rr.h < area){ best = i; area = rr.w * rr.h; }

  }

}
function pxMove(e){
  if (!PX.drag) return;
  const at = pxCell(e), d = PX.drag, m = curModel();
  if (d.kind === 'paint'){
    const g = pxGrid();
    // 빨리 그어도 끊기지 않게 사이 칸도 칠함
    let x0 = d.last.c, y0 = d.last.r; const x1 = at.c, y1 = at.r;
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy, guard = 0;
    while (guard++ < 200){
      g.set(x0, y0, d.tool === 'erase' ? null : ui.px.ch);

      const e2 = 2 * err;

function floodFill(g, c, r, ch){
  const from = g.get(c, r); ch = ch || null;
  if (from === ch) return;
  const W = g.W, H = g.H, seen = new Set(), q = [[c, r]];
  while (q.length){
    const [x, y] = q.pop(); const k = x + ',' + y;
    if (x < 0 || y < 0 || x >= W || y >= H || seen.has(k) || g.get(x, y) !== from) continue;
    seen.add(k); g.set(x, y, ch);

  }

// 부위 종류 바꾸기 (박스↔평면↔자유 도형)
function convertKind(m, p, to){
  if (p.kind === to) return;
  const S = new kit.Sampler(m);
  if (to === 'free'){
    const cx = p.x + p.w / 2 - 0.5, cy = p.y + p.h / 2 - 0.5;
    Object.assign(p, { shape: 'box', size: [p.w, p.h, p.kind === 'box' ? p.d : 0.2], pos: [cx, cy, p.z || 0], rot: [0, 0, 0] });
    if (!p.color) p.color = Object.keys(m.palette)[0] || '#888888';
    ['x', 'y', 'w', 'h', 'd', 'axis', 'paint', 'useTop'].forEach(k => delete p[k]);
  } else if (p.kind === 'free'){
    Object.assign(p, { x: Math.round(p.pos[0] - p.size[0] / 2 + 0.5), y: Math.round(p.pos[1] - p.size[1] / 2 + 0.5), w: Math.max(1, Math.round(p.size[0])), h: Math.max(1, Math.round(p.size[1])), d: Math.max(1, Math.round(p.size[2])), z: p.pos[2] });
    ['shape', 'size', 'pos', 'rot', 'mesh'].forEach(k => delete p[k]);
  }
  p.kind = to;
  if (to === 'box' && !p.d) p.d = 3;
  if (to === 'plane' && !p.axis) p.axis = 'z';
  kit.normPart(p);
  void S;
}

  const opts = Object.keys(MOTION_KO).map(k => `<option value="${k}" ${k === m.motion ? 'selected' : ''}>${MOTION_KO[k]}</option>`).join('');
  const sl = (label, key, min, max, step, val, unit) => `<div class="slider"><span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}" data-m="${key}" value="${val}"><output>${(+val).toFixed(2)}${unit || ''}</output></div>`;
  box.innerHTML = `
    <label class="f"><span>움직임 종류</span><select data-m="motion">${opts}</select></label>
    <h3>헤엄</h3>
    ${sl('유영 속도', 'speed', 0, 3, 0.05, s.speed, '×')}
    ${sl('꼬리 박자', 'beat', 0, 2, 0.02, s.beat, '/초')}
    ${sl('꼬리 흔들기', 'wag', 0, 1.2, 0.01, s.wag)}
    ${sl('몸 휘기', 'bend', 0, 1, 0.01, s.bend)}
    ${sl('가슴지느러미', 'pect', 0, 2.5, 0.05, s.pect)}
    ${sl('위아래 출렁', 'bob', 0, 1.5, 0.01, s.bob)}
    ${sl('돌 때 기울기', 'roll', 0, 2, 0.05, s.roll)}
    <h3>크기와 색</h3>
    ${sl('3D 크기', 'scale', 0.05, 2, 0.01, m.scale)}
    ${sl('등·배 음영', 'shade', 0, 0.25, 0.01, m.shade == null ? 0.06 : m.shade)}
    <p class="hint">몸 휘기 0은 머리부터 꼬리자루까지 곧게 두고 꼬리만 흔듭니다. 올릴수록 몸통까지 같이 휩니다. 유영 속도는 모든 reef에서 이 종이 움직이는 빠르기에 곱해집니다.</p>`;
  $$('[data-m]', box).forEach(el => el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
    const k = el.dataset.m;
    edit(() => {
      if (k === 'motion') m.motion = el.value;
      else if (k === 'scale') m.scale = +el.value;
      else if (k === 'shade') m.shade = +el.value;
      else m.swim[k] = +el.value;
    });
    const o = el.parentNode.querySelector('output');
    if (o) o.textContent = (+el.value).toFixed(2) + ({ speed: '×', beat: '/초' }[k] || '');
    if (k === 'motion') updateThumbs();
  }));
}

function linesEditor(host, arr, onChange, placeholder){
  host.innerHTML = '';
  arr.forEach((line, i) => {
    const row = document.createElement('div'); row.className = 'row';
    const inp = document.createElement('input'); inp.type = 'text'; inp.value = line; inp.placeholder = placeholder || '';
    inp.addEventListener('input', () => onChange(a => { a[i] = inp.value; }));
    const rm = document.createElement('button'); rm.type = 'button'; rm.className = 'btn small'; rm.textContent = '×'; rm.title = '지우기';
    rm.addEventListener('click', () => { onChange(a => { a.splice(i, 1); }, true); linesEditor(host, arr, onChange, placeholder); });
    row.appendChild(inp); row.appendChild(rm); host.appendChild(row);
  });
  const add = document.createElement('button'); add.type = 'button'; add.className = 'btn small ghost'; add.textContent = '+ 한 줄';
  add.addEventListener('click', () => { onChange(a => { a.push(''); }, true); linesEditor(host, arr, onChange, placeholder); const ins = $$('input', host); if (ins.length) ins[ins.length - 1].focus(); });
  host.appendChild(add);
}

// 다른 곳에서 이 id를 쓰는지
function findRefs(id){
  const out = [];
  D.reefs.forEach(r => {
    const c = r.config || {};
    const n = (c.lanes || []).filter(l => l.species === id).length + (c.props || []).filter(p => p.item === id).length +
      (c.swimmers || []).filter(s => s.species === id).length + ((c.mix || []).indexOf(id) >= 0 ? 1 : 0);
    if (n) out.push(r.name);
  });
  return out;
}
function renameRefs(from, to){
  D.reefs.forEach(r => {
    const c = r.config || {};
    (c.lanes || []).forEach(l => { if (l.species === from) l.species = to; });
    (c.props || []).forEach(p => { if (p.item === from) p.item = to; });
    (c.swimmers || []).forEach(s => { if (s.species === from) s.species = to; });
    if (c.mix) c.mix = c.mix.map(x => x === from ? to : x);
  });
}
// 이 물고기를 하위 reef 모양에 맞게 넣기
function sendToReef(r, m){
  const c = r.config || (r.config = {});
  const isItem = D.items.indexOf(m) >= 0;
  const rnd = kit.seeded(kit.hash(m.id + Date.now()));
  if (r.kind === 'showcase'){
    if (isItem){ (c.props || (c.props = [])).push({ item: m.id, pos: [Math.round((rnd() - 0.5) * 20), Math.round((rnd() - 0.5) * 10), Math.round((rnd() - 0.5) * 20)], scale: 1, rot: 0 }); return; }
    (c.lanes || (c.lanes = [])).push({ species: m.id, path: 'loop', cx: Math.round((rnd() - 0.5) * 16), cy: Math.round((rnd() - 0.5) * 12), cz: Math.round((rnd() - 0.5) * 16),
      rx: 6 + Math.round(rnd() * 6), ry: 1.5 + Math.round(rnd() * 10) / 10, rz: 5 + Math.round(rnd() * 5), sp: 0.2 + Math.round(rnd() * 20) / 100, ph: Math.round(rnd() * 62) / 10,
      scale: 1, variant: 0, effects: [], says: [] });
  } else if (r.kind === 'marker'){
    if (isItem) return toast('마커 reef에는 물고기만 넣을 수 있습니다');
    c.mix = c.mix || []; if (c.mix.indexOf(m.id) < 0) c.mix.push(m.id);
  } else if (r.kind === 'console'){
    if (isItem) return toast('콘솔에는 물고기만 넣을 수 있습니다');
    (c.swimmers || (c.swimmers = [])).push({ species: m.id, cx: 0, cz: 0, rx: 9, rz: 8, h: 12, sp: 0.12, ph: Math.round(rnd() * 62) / 10, sc: 1, say: m.says.slice() });
  }
}
// GLB(3D 파일)로 내보내기: 멈춘 모습 한 장
function loadScript(src){
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('스크립트를 못 불러왔습니다')); document.head.appendChild(s); });
}
function exportGlb(m){
  const go = () => {
    const obj = kit.build(m, {});
    // 실제 크기(미터)로 맞춤: 몸 길이 = sizeCm
    obj.scale.setScalar(((m.sizeCm || 10) / 100) / new kit.Sampler(m).W);
    new THREE.GLTFExporter().parse(obj, res => {
      saved(saveFile(m.id + '.glb', new Blob([res], { type: 'model/gltf-binary' }), 'model/gltf-binary'), 'GLB');
    }, { binary: true });
  };
  if (THREE.GLTFExporter) return go();
  loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js').then(go).catch(e => toast(e.message));
}

async function askClaude(prompt, opts){
  if (!sample) throw { code: 'unavailable', message: '클로드 기능은 claude.ai 안에서 열었을 때만 됩니다' };
  return sample.json(prompt, opts);
}
function claudeErr(e){
  const c = e && e.code;
  if (c === 'not_granted' || c === 'sampling_disabled') return '클로드 사용이 허락되지 않았습니다.';
  if (c === 'rate_limited') return '잠깐 너무 많이 불렀습니다. 조금 뒤에 다시 해 주십시오.';
  if (c === 'invalid_json') return '답이 JSON 모양이 아니었습니다. 부탁을 조금 더 짧게 해서 다시 해 보십시오.';
  if (c === 'cancelled') return '멈췄습니다.';
  if (c === 'images_unavailable') return '여기서는 사진을 보낼 수 없습니다.';
  if (c === 'unavailable') return e.message;
  return '문제가 생겼습니다: ' + ((e && e.message) || c || e);
}

// 사진 → 도트 자동 변환 (클로드 없이)
function autoFish(src, W, faceLeft, name){
  W = clamp(Math.round(W), 10, 32);
  const H = clamp(Math.round(W * src.height / src.width), 6, 24);
  const big = document.createElement('canvas'); big.width = W * 4; big.height = H * 4;
  const bc = big.getContext('2d'); bc.drawImage(src, 0, 0, big.width, big.height);
  const px = bc.getImageData(0, 0, big.width, big.height).data;
  // 4x4 칸마다 평균 색
  const cells = [];
  for (let r = 0; r < H; r++){ cells.push([]); for (let c = 0; c < W; c++){
    let R = 0, G = 0, B = 0;
    for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++){ const o = ((r * 4 + j) * big.width + c * 4 + i) * 4; R += px[o]; G += px[o + 1]; B += px[o + 2]; }
    cells[r].push([R / 16, G / 16, B / 16]);
  } }
  // 배경색 = 가장자리 칸들의 가운데 값
  const border = [];
  for (let c = 0; c < W; c++){ border.push(cells[0][c], cells[H - 1][c]); }
  for (let r = 0; r < H; r++){ border.push(cells[r][0], cells[r][W - 1]); }
  const med = k => border.map(x => x[k]).sort((a, b) => a - b)[Math.floor(border.length / 2)];
  const bg = [med(0), med(1), med(2)];
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
  const ds = []; cells.forEach(row => row.forEach(x => ds.push(dist(x, bg))));
  // 배경과 물고기를 가르는 기준값 (두 무리로 나눴을 때 차이가 제일 큰 곳)
  const sorted = ds.slice().sort((a, b) => a - b);
  let thr = 40, best = -1;
  for (let t = 10; t < 200; t += 3){
    const a = sorted.filter(v => v < t), b = sorted.filter(v => v >= t);
    if (!a.length || !b.length) continue;
    const ma = a.reduce((s, v) => s + v, 0) / a.length, mb = b.reduce((s, v) => s + v, 0) / b.length;
    const score = a.length * b.length * (mb - ma) * (mb - ma);
    if (score > best){ best = score; thr = t; }
  }
  let mask = cells.map(row => row.map(x => dist(x, bg) >= thr));
  // 제일 큰 덩어리만 남기기
  const lab = mask.map(row => row.map(() => 0)); let bestN = 0, bestL = 0, L = 0;
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++){
    if (!mask[r][c] || lab[r][c]) continue;
    L++; let n = 0; const q = [[c, r]]; lab[r][c] = L;
    while (q.length){ const [x, y] = q.pop(); n++; [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx, dy]) => { const a = x + dx, b = y + dy; if (a >= 0 && b >= 0 && a < W && b < H && mask[b][a] && !lab[b][a]){ lab[b][a] = L; q.push([a, b]); } }); }
    if (n > bestN){ bestN = n; bestL = L; }
  }
  mask = lab.map(row => row.map(v => v === bestL && bestL > 0));
  // 속 빈 곳 메우기: 가장자리에서 닿지 않는 빈칸은 물고기
  const out = mask.map(row => row.map(() => false)); const q2 = [];
  for (let c = 0; c < W; c++){ q2.push([c, 0], [c, H - 1]); } for (let r = 0; r < H; r++){ q2.push([0, r], [W - 1, r]); }
  while (q2.length){ const [x, y] = q2.pop(); if (x < 0 || y < 0 || x >= W || y >= H || out[y][x] || mask[y][x]) continue; out[y][x] = true; q2.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]); }
  mask = mask.map((row, y) => row.map((v, x) => v || !out[y][x]));
  // 색 줄이기 (비슷한 색끼리 묶기)
  const pts = []; cells.forEach((row, y) => row.forEach((x, c) => { if (mask[y][c]) pts.push(x); }));
  const K = Math.min(6, Math.max(1, pts.length));
  const lum = p => p[0] * 0.3 + p[1] * 0.59 + p[2] * 0.11;
  const byL = pts.slice().sort((a, b) => lum(a) - lum(b));
  let cent = Array.from({ length: K }, (_, i) => byL[Math.floor((i + 0.5) / K * byL.length)] || [128, 128, 128]);
  for (let it = 0; it < 8; it++){
    const sum = cent.map(() => [0, 0, 0, 0]);
    pts.forEach(p => { let bi = 0, bd = 1e9; cent.forEach((cc, i) => { const d = dist(p, cc); if (d < bd){ bd = d; bi = i; } }); sum[bi][0] += p[0]; sum[bi][1] += p[1]; sum[bi][2] += p[2]; sum[bi][3]++; });
    cent = cent.map((cc, i) => sum[i][3] ? [sum[i][0] / sum[i][3], sum[i][1] / sum[i][3], sum[i][2] / sum[i][3]] : cc);
  }
  const keys = 'abcdfghi';   // e는 눈 색으로 비워둠
  const palette = {};
  cent.forEach((cc, i) => {
    // 카메라 화면 위에서 잘 보이게 채도를 조금 올림
    const avg = (cc[0] + cc[1] + cc[2]) / 3, boost = cc.map(v => clamp(avg + (v - avg) * 1.15, 0, 255));
    palette[keys[i]] = kit.rgbHex(boost);
  });
  let side = [];
  for (let r = 0; r < H; r++){
    let s = '';
    for (let c = 0; c < W; c++){
      if (!mask[r][c]){ s += '.'; continue; }
      let bi = 0, bd = 1e9; cent.forEach((cc, i) => { const d = dist(cells[r][c], cc); if (d < bd){ bd = d; bi = i; } });
      s += keys[bi];
    }
    side.push(s);
  }
  if (faceLeft) side = side.map(r => r.split('').reverse().join(''));
  const m = kit.normModel({ id: 'fish-auto', name: name || '사진 물고기', motion: 'fish', scale: 0.5, sizeCm: 12, palette, side, parts: [], says: ['…'] });
  autoParts(m);
  return m;
}
// 옆모습 모양을 보고 머리/몸통/꼬리자루/꼬리/지느러미 부위를 대충 나눠 주기
function autoParts(m){
  const S = new kit.Sampler(m), W = S.W, H = S.H;
  const top = [], bot = [], cnt = [];
  for (let c = 0; c < W; c++){ let t = -1, b = -1, n = 0; for (let r = 0; r < H; r++) if (S.side(c, r)){ if (t < 0) t = r; b = r; n++; } top.push(t); bot.push(b); cnt.push(n); }
  let first = cnt.findIndex(n => n > 0), last = W - 1 - cnt.slice().reverse().findIndex(n => n > 0);
  if (first < 0){ first = 0; last = W - 1; }
  const len = last - first + 1;
  let waist = first + Math.max(2, Math.round(len * 0.25)), wn = 1e9;
  for (let c = first + Math.max(2, Math.round(len * 0.12)); c <= first + Math.round(len * 0.45); c++) if (cnt[c] > 0 && cnt[c] <= wn){ wn = cnt[c]; waist = c; }
  const stockEnd = Math.min(last - 3, waist + Math.max(1, Math.round(len * 0.12)) - 1);
  const headStart = Math.max(stockEnd + 2, last - Math.round(len * 0.28) + 1);
  const core = (c0, c1) => {
    const rows = [];
    for (let r = 0; r < H; r++){ let n = 0; for (let c = c0; c <= c1; c++) if (S.side(c, r)) n++; if (n >= (c1 - c0 + 1) * 0.6) rows.push(r); }
    if (!rows.length){ let t = H, b = 0; for (let c = c0; c <= c1; c++) if (top[c] >= 0){ t = Math.min(t, top[c]); b = Math.max(b, bot[c]); } return [t, Math.max(t, b)]; }
    return [rows[0], rows[rows.length - 1]];
  };
  const [by0, by1] = core(stockEnd + 1, headStart - 1), bh = by1 - by0 + 1, bd = clamp(Math.round(bh * 0.55), 2, 7);
  const [hy0, hy1] = core(headStart, last), [sy0, sy1] = core(waist, stockEnd);
  let ty0 = H, ty1 = 0; for (let c = first; c < waist; c++) if (top[c] >= 0){ ty0 = Math.min(ty0, top[c]); ty1 = Math.max(ty1, bot[c]); }
  const parts = [
    { id: '머리', kind: 'box', role: 'head', x: headStart, y: hy0, w: last - headStart + 1, h: hy1 - hy0 + 1, d: Math.max(2, bd - 1) },
    { id: '몸통', kind: 'box', role: 'body', x: stockEnd + 1, y: by0, w: headStart - stockEnd - 1, h: bh, d: bd },
    { id: '꼬리자루', kind: 'box', role: 'stock', x: waist, y: sy0, w: stockEnd - waist + 1, h: sy1 - sy0 + 1, d: Math.max(1, bd - 2) }
  ];
  if (waist > first) parts.push({ id: '꼬리', kind: 'plane', role: 'caudal', x: first, y: Math.min(ty0, H - 1), w: waist - first, h: Math.max(1, ty1 - ty0 + 1) });
  // 몸통 위·아래로 튀어나온 칸 = 지느러미
  const fin = (fromRow, toRow) => {
    let x0 = 1e9, x1 = -1, y0 = 1e9, y1 = -1;
    for (let c = stockEnd + 1; c <= last; c++) for (let r = fromRow; r <= toRow; r++) if (S.side(c, r)){ x0 = Math.min(x0, c); x1 = Math.max(x1, c); y0 = Math.min(y0, r); y1 = Math.max(y1, r); }
    return x1 >= 0 ? { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 } : null;
  };
  const dorsal = fin(0, by0 - 1), anal = fin(by1 + 1, H - 1);
  if (dorsal) parts.push(Object.assign({ id: '등지느러미', kind: 'plane', role: 'body' }, dorsal));
  if (anal) parts.push(Object.assign({ id: '뒷지느러미', kind: 'plane', role: 'body' }, anal));
  const tailCh = S.side(first + Math.floor((waist - first) / 2), Math.floor((ty0 + ty1) / 2)) || Object.keys(m.palette)[0];
  parts.push({ id: '가슴지느러미', kind: 'plane', role: 'pect', x: Math.max(0, headStart - 2), y: by0 + Math.floor(bh / 2), w: 3, h: 2, z: bd / 2 + 0.4, paint: ['XXX', '.XX'], color: tailCh });
  // 눈: 머리 앞쪽 위
  const ec = Math.max(headStart, last - Math.max(1, Math.round(len * 0.1)));
  if (top[ec] >= 0){
    const er = top[ec] + Math.max(1, Math.round((bot[ec] - top[ec]) * 0.32));
    m.palette.e = '#221E33';
    m.side[er] = m.side[er].slice(0, ec) + 'e' + m.side[er].slice(ec + 1);
  }
  m.parts = parts.map(kit.normPart);
}

const KIND_INFO = {

const BUNDLED = ['first-reef.html'];
// 자기만의 모양이 있는 페이지: 틀로 다시 만들지 않음 (덮어쓰면 모양이 사라짐)
const OWN_LOOK = ['first-reef.html'];
const fileExists = {};
function reefSrc(r){
  const tpl = KIND_INFO[r.kind] ? KIND_INFO[r.kind].tpl : 'first-reef.html';
  const f = (BUNDLED.indexOf(r.file) >= 0 || fileExists[r.file]) ? r.file : tpl;
  return f + (r.kind === 'marker' ? '#preview' : '');
}
async function reefFileText(r){
  const tpl = await fetchText(KIND_INFO[r.kind].tpl);
  return tpl.replace(/data-reef="[^"]*"/, 'data-reef="' + r.id + '"')
    .replace(/<title>[^<]*<\/title>/, '<title>' + esc(r.name) + '</title>')
    .replace(/<h1 id="title">[^<]*<\/h1>/, '<h1 id="title">' + esc(r.name) + '</h1>');
}
// 한 파일로: reef-kit.js와 데이터를 페이지 안에 넣어서 혼자서도 열리게
async function singleFile(r){
  const html = await reefFileText(r), k = await fetchText('reef-kit.js');
  const dataJs = 'window.REEF_DATA = ' + JSON.stringify(D).replace(/</g, '\\u003c') + ';';
  return html.replace('<script src="reef-kit.js"><\/script>', () => '<script>\n' + k + '\n<\/script>\n<script>' + dataJs + '<\/script>');
}

function speciesOptions(cur, withItems){
  const src = withItems ? D.items : D.species;
  let h = src.map(m => `<option value="${esc(m.id)}" ${m.id === cur ? 'selected' : ''}>${esc(m.name)}</option>`).join('');

  return h;
}
function numField(label, obj, key, step){
  return `<label class="f"><span>${label}</span><input type="number" step="${step || 0.1}" data-k="${key}" value="${obj[key] == null ? '' : obj[key]}"></label>`;
}
function wireNums(box, obj, after){
  $$('input[data-k]', box).forEach(el => el.addEventListener('input', () => { edit(() => { obj[el.dataset.k] = numv(el.value, 0); }); if (after) after(); }));
}

  $('#qGo').addEventListener('click', async () => {
    const req = $('#qReq').value.trim(); if (!req) return;
    $('#qGo').disabled = true; $('#qState').textContent = '생각하는 중…';
    const prompt = `아래는 수족관 페이지 "${r.name}"(종류: ${r.kind})의 설정 JSON이야. 요청대로 고친 설정 JSON 객체 하나만 답해. 모양(키 이름)은 그대로 유지해.

[지금 설정]
${JSON.stringify(r.config)}
[요청]
${req}`;
    try {
      const o = await askClaude(prompt, { modelTier: 'default', cache: false });
      if (!o || typeof o !== 'object' || Array.isArray(o)) throw { code: 'invalid_json' };
      edit(() => { r.config = o; }, true);
      $('#qState').textContent = '적용했습니다. 마음에 안 들면 되돌리기';
      renderReefs();

  });

      <p class="sub">여기 버튼이 안 되는 곳(깃허브 페이지)에서는 사진을 이 대화창에 올리고 "All Reefs 지침대로 물고기 JSON 만들어줘"라고 하면 됩니다. 받은 JSON은 물고기 → JSON 칸에 붙여넣으면 들어갑니다.</p>
    </div></div>`;
  $('#gText').value = D.guide;
  $('#gText').addEventListener('input', e => edit(() => { D.guide = e.target.value; }));
  $('#gEx').addEventListener('change', e => edit(() => { D.guideExample = e.target.value; }, true));
}

/* ═══════════════════ 깃허브 ═══════════════════ */
const GH = {
  cfg(){ let c = {}; try { c = JSON.parse(localStorage.getItem('allreefs.gh') || '{}') || {}; } catch(e){} return Object.assign({ repo: '', branch: 'main', dir: '', token: '' }, c); },
  save(c){ try { localStorage.setItem('allreefs.gh', JSON.stringify(c)); } catch(e){} },
  ready(){ const c = this.cfg(); return !!(c.repo && c.repo.indexOf('/') > 0 && c.token); },
  path(f){ const d = (this.cfg().dir || '').replace(/^\/+|\/+$/g, ''); return (d ? d + '/' : '') + f; },
  url(f){ const c = this.cfg(); return 'https://api.github.com/repos/' + c.repo + '/contents/' + this.path(f).split('/').map(encodeURIComponent).join('/'); },
  headers(){ return { 'Authorization': 'Bearer ' + this.cfg().token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }; },
  async get(f){
    if (!this.ready()) throw { gh: 'setup' };
    const r = await fetch(this.url(f) + '?ref=' + encodeURIComponent(this.cfg().branch), { headers: this.headers(), cache: 'no-store' });
    if (r.status === 404) return null;
    if (!r.ok) throw { gh: r.status };
    const j = await r.json();
    return { sha: j.sha, text: j.content ? decodeURIComponent(escape(atob(j.content.replace(/\s/g, '')))) : '' };
  },
  async put(f, text, message){
    if (!this.ready()) throw { gh: 'setup' };
    const cur = await this.get(f);
    const body = { message: message || ('all-reefs: ' + f), content: btoa(unescape(encodeURIComponent(text))), branch: this.cfg().branch };
    if (cur) body.sha = cur.sha;
    const r = await fetch(this.url(f), { method: 'PUT', headers: this.headers(), body: JSON.stringify(body) });
    if (!r.ok){ let msg = ''; try { msg = (await r.json()).message; } catch(e){} throw { gh: r.status, msg }; }
    return r.json();
  },
  async list(){
    if (!this.ready()) throw { gh: 'setup' };
    const d = (this.cfg().dir || '').replace(/^\/+|\/+$/g, '');
    const u = 'https://api.github.com/repos/' + this.cfg().repo + '/contents/' + d.split('/').map(encodeURIComponent).join('/') + '?ref=' + encodeURIComponent(this.cfg().branch);
    const r = await fetch(u, { headers: this.headers(), cache: 'no-store' });
    if (!r.ok) throw { gh: r.status };
    return r.json();
  }
};
function ghMsg(e){
  if (e && e.gh === 'setup') return '깃허브 메뉴에서 레포와 토큰을 먼저 넣어 주십시오.';
  if (e && e.gh === 401) return '토큰이 거절되었습니다(401). 기간이 지났는지 확인해 주십시오.';
  if (e && e.gh === 403) return '권한이 없습니다(403). 토큰에 Contents: Read and write가 필요합니다.';
  if (e && e.gh === 404) return '레포나 브랜치를 못 찾았습니다(404).';
  if (e && (e.gh === 409 || e.gh === 422)) return '파일이 그 사이 바뀌었습니다. 다시 해 주십시오. ' + (e.msg || '');
  const m = String((e && (e.message || e.msg)) || e);
  if (/failed to fetch|networkerror|load failed/i.test(m)) return IN_CLAUDE ? '클로드 미리보기 안에서는 깃허브에 연결할 수 없습니다. 전체 파일 받기로 레포에 올린 뒤, 레포의 all-reefs.html에서 여십시오.' : '깃허브에 연결하지 못했습니다. 인터넷과 주소를 확인해 주십시오.';
  return m;
}
const LOG = [];
function log(line){ LOG.push(new Date().toLocaleTimeString() + '  ' + line); const el = $('#ghLog'); if (el){ el.textContent = LOG.slice(-60).join('\n'); el.scrollTop = 1e9; } }

function renderGithub(){
  const c = GH.cfg();
  main.innerHTML = `<div class="stack" style="max-width:900px">
    ${IN_CLAUDE ? `<div class="note warn">지금은 클로드 미리보기 안이라 깃허브 연결이 막혀 있습니다. <b>전체 파일 받기</b>로 zip을 받아 레포에 올리고, 깃허브 페이지 주소의 <b>all-reefs.html</b>에서 열면 여기 기능이 다 됩니다.</div>` : ''}
    <div class="card">
      <h2>레포 연결</h2>
      <p class="sub">토큰은 이 브라우저에만 저장되고 어디에도 올라가지 않습니다. github.com/settings/personal-access-tokens 에서 이 레포만, Contents: Read and write로 만들어 주십시오.</p>
      <div class="g4">
        <label class="f" style="grid-column:span 2"><span>레포 (owner/name)</span><input type="text" id="gRepo" value="${esc(c.repo)}" placeholder="you/your-repo"></label>
        <label class="f"><span>브랜치</span><input type="text" id="gBranch" value="${esc(c.branch)}"></label>
        <label class="f"><span>폴더 (없으면 비움)</span><input type="text" id="gDir" value="${esc(c.dir)}" placeholder="reef"></label>
      </div>
      <label class="f" style="margin-top:8px"><span>토큰</span><input type="password" id="gTok" value="${esc(c.token)}" placeholder="github_pat_…" autocomplete="off"></label>
      <div class="row" style="margin-top:10px"><button class="btn small" id="gTest" type="button">연결 확인</button><span class="hint" id="gState"></span></div>
    </div>
    <div class="card">
      <h2>올리기 · 불러오기</h2>
      <div class="row">
        <button class="btn primary" id="gPush" type="button">reef-data.json 올리기</button>
        <button class="btn" id="gPull" type="button">레포에서 불러오기</button>
        <button class="btn" id="gAll" type="button">전체 파일 올리기</button>
        <label class="row" style="font-size:12.5px"><input type="checkbox" id="gOver"> 이미 있는 reef 페이지도 덮어쓰기</label>
      </div>
      <p class="hint"><b>reef-data.json 올리기</b>만 하면 모든 하위 reef의 물고기가 바뀝니다 (깃허브 페이지 반영에 1분쯤). <b>전체 파일 올리기</b>는 처음 설치할 때나 reef-kit.js를 새로 받았을 때. viewer.html은 건드리지 않습니다.</p>
      <div class="log" id="ghLog" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <div class="row"><h2 class="grow">레포 파일</h2><button class="btn small" id="gList" type="button">목록 보기</button></div>
      <p class="sub">하위 reef 페이지나 reef-kit.js 코드를 여기서 바로 고쳐서 커밋할 수 있습니다.</p>
      <div class="files" id="gFiles"></div>
    </div></div>`;
  $('#ghLog').textContent = LOG.slice(-60).join('\n');
  const store = () => GH.save({ repo: $('#gRepo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/+$/, ''), branch: $('#gBranch').value.trim() || 'main', dir: $('#gDir').value.trim(), token: $('#gTok').value.trim() });
  ['#gRepo', '#gBranch', '#gDir', '#gTok'].forEach(s => $(s).addEventListener('change', store));
  $('#gTest').addEventListener('click', async () => {
    store(); $('#gState').textContent = '확인 중…';
    try { const f = await GH.get('reef-data.json'); $('#gState').textContent = f ? '연결되었습니다. 레포에 reef-data.json이 있습니다.' : '연결되었습니다. 아직 reef-data.json이 없습니다 (전체 파일 올리기로 시작).'; }
    catch(e){ $('#gState').textContent = ghMsg(e); }
  });
  $('#gPush').addEventListener('click', () => { store(); pushData(); });
  $('#gPull').addEventListener('click', async () => {
    store(); log('레포에서 reef-data.json 읽는 중…');
    try {
      const f = await GH.get('reef-data.json'); if (!f) return log('레포에 reef-data.json이 없습니다.');
      snapshot(true); D = kit.normalize(JSON.parse(f.text)); setBase(D); changed(true); kit.applyStyle(D.style); drawLogo();
      log('불러왔습니다. (되돌리기로 이전 작업본으로 돌아갈 수 있습니다)');
    } catch(e){ log(ghMsg(e)); }
  });
  $('#gAll').addEventListener('click', async () => {
    store(); log('전체 파일 모으는 중…');
    try {
      let exist = {};
      try { (await GH.list()).forEach(x => { exist[x.name] = true; }); } catch(e){ if (e.gh !== 404) throw e; }
      const files = await bundleFiles();
      for (const name of Object.keys(files)){
        const isReefPage = D.reefs.some(r => r.file === name);
        if (isReefPage && exist[name] && !$('#gOver').checked){ log('건너뜀 (이미 있음): ' + name); continue; }
        log('올리는 중: ' + name);
        await GH.put(name, files[name], 'all-reefs: ' + name);
        fileExists[name] = true;
      }
      log('끝! 깃허브 페이지에 반영되기까지 1분쯤 걸립니다.');
    } catch(e){ log(ghMsg(e)); }
  });
  $('#gList').addEventListener('click', async () => {
    store(); const box = $('#gFiles'); box.innerHTML = '<p class="hint">읽는 중…</p>';
    try {
      const list = (await GH.list()).filter(x => x.type === 'file');
      box.innerHTML = '';
      list.forEach(x => {
        fileExists[x.name] = true;
        const row = document.createElement('div'); row.className = 'row';
        row.innerHTML = `<span class="mono grow"></span><span class="hint" style="margin:0">${Math.round(x.size / 102.4) / 10} KB</span>`;
        row.querySelector('.mono').textContent = x.name;
        if (/\.(html|js|json|md|css|txt)$/i.test(x.name)){
          const b = document.createElement('button'); b.type = 'button'; b.className = 'btn small'; b.textContent = '편집';
          b.addEventListener('click', () => openCode(x.name));
          row.appendChild(b);
        }
        box.appendChild(row);
      });
    } catch(e){ box.innerHTML = '<p class="hint">' + esc(ghMsg(e)) + '</p>'; }
  });
}
async function pushData(){
  if (!GH.ready()){ ui.tab = 'github'; render(); return toast('레포와 토큰을 먼저 넣어 주십시오'); }
  log('reef-data.json 올리는 중…'); setSaved('busy');
  try {
    const cur = await GH.get('reef-data.json');
    let curUp = '';
    if (cur){ try { curUp = String(JSON.parse(cur.text).updated || ''); } catch(e){} }
    if (cur && repoBase && curUp && curUp !== repoBase){
      const msg = '레포의 reef-data.json이 그 사이 바뀌었습니다 (다른 창이나 다른 사람이 올림). 예전 물고기로 덮어쓰지 않게 멈췄습니다. 깃허브 메뉴의 "레포에서 불러오기"로 최신을 연 뒤 다시 고쳐 주십시오.';
      log(msg); toast(msg, 6000); setSaved('local'); return;
    }
    await GH.put('reef-data.json', dataText(), 'all-reefs: update fish');
    setBase(D); saveNow();
    // 새로 만든 reef 페이지가 레포에 없으면 같이 만들어 줌
    let exist = {};
    try { (await GH.list()).forEach(x => { exist[x.name] = true; }); } catch(e){}
    for (const r of D.reefs){
      if (exist[r.file] || !KIND_INFO[r.kind]) continue;
      log('새 reef 페이지 만드는 중: ' + r.file);
      await GH.put(r.file, await reefFileText(r), 'all-reefs: add ' + r.file);
      fileExists[r.file] = true;
    }
    log('올렸습니다. 1분쯤 뒤 하위 reef들이 새 물고기로 바뀝니다.');
    toast('깃허브에 올렸습니다');
  } catch(e){ log(ghMsg(e)); toast(ghMsg(e), 4500); }
  saveNow();
}
$('#pushBtn').addEventListener('click', () => pushData());

/* ───────── 코드 편집 창 ───────── */
function openCode(name, fallback){
  const md = $('#codeModal');
  $('#codeTitle').textContent = name; $('#codeText').value = '불러오는 중…'; $('#codeState').textContent = '';
  $('#codeSub').textContent = GH.ready() && !IN_CLAUDE ? '레포에 있는 최신 파일입니다. 고치고 커밋하면 바로 올라갑니다.' : '같이 들어 있는 파일입니다. 고친 뒤 파일로 받아서 레포에 올려 주십시오.';
  $('#codeCommit').disabled = !GH.ready() || IN_CLAUDE;
  openModal(md);
  (async () => {
    let text = null;
    if (GH.ready() && !IN_CLAUDE){ try { const f = await GH.get(name); if (f) text = f.text; } catch(e){ $('#codeState').textContent = ghMsg(e); } }
    if (text == null){
      try { text = name === 'reef-data.json' ? dataText() : fallback ? await fallback() : await fetchText(name); }
      catch(e){ text = ''; $('#codeState').textContent = e.message; }
    }
    $('#codeText').value = text;
  })();
  $('#codeCommit').onclick = async () => {
    $('#codeState').textContent = '커밋 중…';
    try {
      await GH.put(name, $('#codeText').value, 'all-reefs: edit ' + name);
      fileExists[name] = true;
      $('#codeState').textContent = '커밋했습니다.';
      if (name === 'reef-data.json'){ try { snapshot(true); D = kit.normalize(JSON.parse($('#codeText').value)); setBase(D); changed(true); } catch(e){} }
    } catch(e){ $('#codeState').textContent = ghMsg(e); }
  };
  $('#codeSave').onclick = () => saved(saveFile(name, $('#codeText').value, 'text/plain'), name);
}

/* ───────── 전체 파일 모으기 / zip ───────── */
async function bundleFiles(){
  const files = {}, miss = [];
  for (const n of ['all-reefs.html', 'reef-kit.js', 'reef-items.js', 'reef-model.js']){
    try { files[n] = await fetchText(n); } catch(e){ miss.push(n); }
  }
  files['reef-data.json'] = dataText();
  for (const r of D.reefs){
    if (!KIND_INFO[r.kind] || OWN_LOOK.indexOf(r.file) >= 0) continue;
    try { files[r.file] = await reefFileText(r); } catch(e){ miss.push(r.file); }
  }
  if (miss.length) throw new Error('같은 폴더에서 이 파일을 못 찾았습니다: ' + miss.join(', '));
  return files;
}
$('#zipBtn').addEventListener('click', async () => {
  const btn = $('#zipBtn'); btn.disabled = true; btn.textContent = '모으는 중…';
  try {
    if (!window.JSZip) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    const files = await bundleFiles(), zip = new JSZip();
    Object.keys(files).forEach(n => zip.file(n, files[n]));
    const blob = await zip.generateAsync({ type: 'blob' });
    await saved(saveFile('all-reefs.zip', blob, 'application/zip'), 'all-reefs.zip');
  } catch(e){ toast(e.message || String(e), 4500); }
  btn.disabled = false; btn.textContent = '전체 파일 받기';
});

/* ═══════════════════ 시작 ═══════════════════ */
async function boot(){
  $('#where').textContent = IN_CLAUDE ? '클로드 미리보기' : location.protocol === 'file:' ? '내 컴퓨터 파일' : location.host;
  let draft = null, legacy = null;
  try { draft = JSON.parse(localStorage.getItem('allreefs.draft') || 'null'); } catch(e){}
  try { legacy = JSON.parse(localStorage.getItem('allreefs.data') || 'null'); } catch(e){}
  fileData = null;
  if (GH.ready() && !IN_CLAUDE){
    try { const f = await GH.get('reef-data.json'); if (f) fileData = kit.normalize(JSON.parse(f.text)); } catch(e){ log('깃허브에서 못 읽어서 사이트 파일을 씀: ' + ghMsg(e)); }
  }
  if (!fileData){
    try { fileData = await kit.loadData(); } catch(e){ fileData = null; }
    if (fileData && kit.source !== 'file') fileData = null;
  }
  // 레포 파일이 늘 기준. 브라우저 작업본은 지금 레포 버전 위에서 고친 것만 이어서 엶
  const useDraft = !!(draft && draft.data && fileData && draft.base && draft.base === fileData.updated && draft.data.updated !== fileData.updated);
  let start;
  if (fileData){ setBase(fileData); start = useDraft ? draft.data : fileData; }
  else start = (draft && draft.data) || legacy || { species: [], items: [], effects: [], reefs: [] };
  if (fileData){ try { localStorage.removeItem('allreefs.data'); if (!useDraft) localStorage.removeItem('allreefs.draft'); } catch(e){} }
  D = kit.normalize(start);
  kit.applyStyle(D.style);
  setSaved('ok'); drawLogo(); render(); showPending();
  if (useDraft && !IN_CLAUDE){
    const n = document.createElement('div'); n.className = 'note'; n.style.marginBottom = '12px';
    n.innerHTML = '아직 올리지 않은 작업본을 이어서 열었습니다. <button class="btn small" type="button">버리고 레포 버전 열기</button>';
    $('button', n).addEventListener('click', () => { snapshot(true); D = kit.normalize(fileData); changed(true); render(); n.remove(); });
    main.prepend(n);
  }
  if (!IN_CLAUDE) return;
  claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
  claude.use('sample').then(async s => {
    sample = s;
    if (s){ const lim = await s.limits().catch(() => null); sampleImages = !!(lim && lim.images); sampleTools = !!(lim && lim.tools); }
    if (ui.tab === 'reefs' || ui.pane === 'claude') render();
  }).catch(() => {});
  claude.use('db').then(async d => {
    if (!d) return;
    db = d;
    const snap = await d.doc('reef/data').get().catch(() => null);
    const body = snap && snap.exists ? snap.data() : null;
    if (body && body.json){
      try {
        const remote = JSON.parse(body.json);
        if (!D.updated || (remote.updated && remote.updated > D.updated)){ D = kit.normalize(remote); kit.applyStyle(D.style); drawLogo(); render(); toast('클로드에 저장된 작업본을 불러왔습니다'); }
      } catch(e){}
    } else saveNow();
    setSaved('ok');
  }).catch(() => {});
}
boot();
})();
