<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Basic Reef</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
  :root{
    color-scheme:light;
    --ground:#EFEAF6; --ground-2:#F9F2F3;
    --panel:rgba(255,255,255,.72); --panel-edge:rgba(92,74,120,.16);
    --ink:#3B3350; --ink-soft:#6E6485; --ink-faint:#938BA8;
    --coral:#E88B54; --spark:#5A6FE0;
    --shadow:0 10px 30px -18px rgba(59,51,80,.55);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --ground:#1A1730; --ground-2:#241D38;
      --panel:rgba(38,32,60,.72); --panel-edge:rgba(196,183,228,.18);
      --ink:#EDE7FA; --ink-soft:#B6ACD2; --ink-faint:#7E759B;
      --coral:#F2A873; --spark:#9AA8FF;
      --shadow:0 10px 34px -18px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --ground:#1A1730; --ground-2:#241D38;
    --panel:rgba(38,32,60,.72); --panel-edge:rgba(196,183,228,.18);
    --ink:#EDE7FA; --ink-soft:#B6ACD2; --ink-faint:#7E759B;
    --coral:#F2A873; --spark:#9AA8FF;
    --shadow:0 10px 34px -18px rgba(0,0,0,.8);
  }
  html,body{height:100%;margin:0}
  body{background:var(--ground);color:var(--ink);overflow:hidden;
    font-family:"Quicksand","IBM Plex Sans KR",ui-rounded,system-ui,sans-serif}
  #stage{position:relative;height:100%;width:100%;overflow:hidden}
  /* 배경: 물속 사진 (BACKDROP 버튼으로 끄고 켬) */
  #stage.lit{background:#1d7fc4 url("assets/reef/water-basic.jpg") center/cover no-repeat}
  #stage.lit .brand h1{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45)}
  #stage.lit .brand p{color:rgba(255,255,255,.75)}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  .hud{position:absolute;pointer-events:none;z-index:5}
  .hud > *{pointer-events:auto}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

  #masthead{top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:16px;
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .brand{display:flex;flex-direction:column;gap:2px}
  .brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.01em;font-family:var(--reef-title-font, inherit)}
  .brand p{margin:0;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
  .iconbtn{appearance:none;border:1px solid var(--panel-edge);background:var(--panel);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink-soft);
    border-radius:9px;padding:7px 11px;font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:10.5px;letter-spacing:.06em;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
  .iconbtn:hover{color:var(--ink)}
  .iconbtn:focus-visible,.toggle:focus-visible{outline:2px solid var(--coral);outline-offset:2px}

  #dock{left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));
    display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .panel{background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);padding:12px 14px}
  #controls{display:grid;gap:10px;min-width:232px}
  .row{display:grid;grid-template-columns:62px 1fr 38px;align-items:center;gap:10px}
  .row label{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--ink-faint)}
  .row output{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;color:var(--ink-soft);
    text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:4px;border-radius:99px;
    background:color-mix(in srgb, var(--ink-faint) 40%, transparent);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:var(--coral);border:2px solid var(--panel);cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.25)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--coral);border:2px solid var(--panel);cursor:pointer}
  input[type=range]:focus-visible{outline:2px solid var(--coral);outline-offset:4px}
  .toggles{display:flex;gap:6px;flex-wrap:wrap}
  .toggle{appearance:none;border:1px solid var(--panel-edge);background:transparent;color:var(--ink-faint);
    border-radius:8px;padding:5px 9px;cursor:pointer;font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:10px;letter-spacing:.06em}
  .toggle[aria-pressed="true"]{color:var(--ink);border-color:var(--coral);background:color-mix(in srgb, var(--coral) 14%, transparent)}
  .toggle.volt[aria-pressed="true"]{border-color:var(--spark);background:color-mix(in srgb, var(--spark) 16%, transparent)}

  #specimens{display:grid;gap:9px;min-width:212px}
  .spec{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px}
  .spec img{width:30px;height:auto;image-rendering:pixelated;display:block}
  .spec .name{display:flex;flex-direction:column;line-height:1.25}
  .spec .name b{font-size:12px;font-weight:600}
  .spec .name i{font-family:"IBM Plex Mono",ui-monospace,monospace;font-style:normal;font-size:9.5px;color:var(--ink-faint);letter-spacing:.02em}
  .spec .count{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--ink-soft);
    font-variant-numeric:tabular-nums;text-align:right}
  .spec .count em{font-style:normal;color:var(--spark);display:block;font-size:9px;letter-spacing:.04em}
  .dockhint{grid-column:1/-1;margin:2px 0 0;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;
    letter-spacing:.05em;color:var(--ink-faint)}
  .spechead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-2px 0 2px;
    cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
  .spechead:active{cursor:grabbing}
  .spechead span{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.08em;color:var(--ink-faint)}
  .spechead button{appearance:none;border:1px solid var(--panel-edge);background:transparent;color:var(--ink-soft);
    border-radius:6px;width:22px;height:22px;line-height:18px;cursor:pointer;font-size:12px;padding:0}
  .spechead button:hover{color:var(--ink)}
  #specimens[hidden]{display:none}
  #specimens.floating{position:absolute;z-index:7;max-height:calc(100% - 24px);overflow:auto}
  .spec{cursor:pointer;border-radius:8px;padding:2px 3px;margin:0 -3px}
  .spec:hover{background:color-mix(in srgb, var(--coral) 10%, transparent)}
  .spec.on{background:color-mix(in srgb, var(--coral) 18%, transparent)}
  #soloBar{top:calc(62px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
  .solorow{display:flex;align-items:center;gap:8px}
  .itemrow{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:380px}
  .itemchip{display:flex;flex-direction:column;align-items:center;line-height:1.2}
  .itemchip i{font-style:normal;font-size:8.5px;color:var(--ink-faint);letter-spacing:.02em}
  #soloBar[hidden]{display:none}
  #soloName{font-size:13px;font-weight:600;min-width:9em;text-align:center}
  #soloName i{display:block;font-style:normal;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;color:var(--ink-faint);font-weight:400}
  #msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:34ch;text-align:center;
    font-size:13px;color:var(--ink-soft);z-index:6}


  /* ── 나의 어항(XP) 화면: 주소에 ?xp 가 붙으면 그림판 모양 (메뉴 줄 · 색 고르기 · 상태 줄) ── */
  .xp-only{display:none}
  body.xp{display:flex;flex-direction:column;background:#ece9d8;color:#000}
  body.xp .xp-only{display:flex}
  body.xp #stage{flex:1;height:auto;min-height:0;border-top:1px solid #aca899}
  body.xp #masthead, body.xp #dock{display:none!important}
  /* 메뉴 줄 */
  .xbar{flex:none;height:22px;align-items:stretch;padding:0 2px;background:#ece9d8;font-size:12px;
    -webkit-user-select:none;user-select:none}
  .xbar button{appearance:none;border:0;background:transparent;color:#000;padding:0 8px;font-size:12px;cursor:default}
  .xbar button.on{background:#316ac5;color:#fff}
  /* 펼친 메뉴 · 옆에 붙는 칸 */
  .xmenu{position:fixed;z-index:60;min-width:160px;background:#fff;border:1px solid #aca899;padding:2px;
    box-shadow:2px 2px 2px rgba(0,0,0,.3);font-size:12px;-webkit-user-select:none;user-select:none}
  .xi{display:flex;align-items:center;gap:6px;height:22px;padding:0 8px 0 2px;white-space:nowrap;cursor:default;color:#000}
  .xi .xic{width:20px;display:flex;align-items:center;justify-content:center;flex:none}
  .xi .xic img{width:20px;height:auto;image-rendering:pixelated}
  .xi .xl{flex:1}
  .xi .xa{width:0;height:0;border-left:4px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent}
  .xi.hot{background:#316ac5;color:#fff}
  .xi.off{color:#aca899}
  .xsep{height:1px;background:#aca899;margin:3px 1px}
  .xslide{padding:6px 10px;display:flex;align-items:center;gap:8px;min-width:0}
  .xslide output{font-size:11px;width:34px;text-align:right}
  .xcard{width:150px;padding:10px 12px;text-align:center;color:#000}
  .xcard img{width:96px;height:auto;image-rendering:pixelated;display:block;margin:4px auto 8px}
  .xcard b{display:block;font-size:14px}
  .xcard i{display:block;font-style:normal;font-size:11px;color:#555;margin-top:2px}
  .xcard hr{border:0;border-top:1px solid #aca899;margin:8px 0 6px}
  .xcard span{font-size:12px}
  /* XP 슬라이더: 가는 홈 위에 초록 테두리 손잡이 */
  input.xtrack{-webkit-appearance:none;appearance:none;width:140px;height:24px;background:transparent;margin:0}
  input.xtrack::-webkit-slider-runnable-track{height:4px;background:#f4f3ee;border:1px solid;border-color:#9d9c99 #fff #fff #9d9c99;border-radius:2px}
  input.xtrack::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:21px;margin-top:-10px;border-radius:3px;
    border:1px solid #3d9f46;background:linear-gradient(180deg,#fff 0%,#f4f4f0 60%,#e2e2da 100%);
    box-shadow:inset 0 2px 0 #c4f2bd,inset 0 -2px 0 #67cf62}
  input.xtrack::-moz-range-track{height:4px;background:#f4f3ee;border:1px solid;border-color:#9d9c99 #fff #fff #9d9c99;border-radius:2px}
  input.xtrack::-moz-range-thumb{width:9px;height:19px;border-radius:3px;border:1px solid #3d9f46;
    background:linear-gradient(180deg,#fff 0%,#f4f4f0 60%,#e2e2da 100%);box-shadow:inset 0 2px 0 #c4f2bd,inset 0 -2px 0 #67cf62}
  /* 아래 색 고르기 (그림판 팔레트) */
  .xpal{flex:none;align-items:center;gap:6px;padding:4px 4px 3px;border-top:1px solid #fff}
  .xcur{position:relative;width:30px;height:30px;flex:none;background:#fff;
    box-shadow:inset 1px 1px #808080,inset -1px -1px #fff,inset 2px 2px #404040,inset -2px -2px #d4d0c8}
  .xcur i{position:absolute;left:7px;top:7px;width:16px;height:16px;border:1px solid #000}
  .xswatch{display:grid;grid-template-columns:repeat(13,16px);grid-auto-rows:16px;gap:0;min-width:0;overflow:hidden}
  .xswatch button{appearance:none;border:0;padding:0;width:16px;height:16px;cursor:pointer;
    box-shadow:inset 1px 1px #808080,inset -1px -1px #fff,inset 2px 2px #404040,inset -2px -2px #d4d0c8}
  .xswatch button.on{outline:1px dotted #000;outline-offset:-4px}
  /* 아래 상태 줄 */
  .xstat{flex:none;height:20px;align-items:stretch;font-size:11px;border-top:1px solid #d6d2c2}
  .xstat span{display:flex;align-items:center;padding:0 6px;border-right:1px solid #aca899;box-shadow:1px 0 #fff;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .xstat span:first-child{flex:1;min-width:0}
  .xstat span:last-child{border-right:0;box-shadow:none;width:90px;flex:none}
  /* 혼자 보기 막대도 XP 모양 */
  body.xp .panel{background:#ece9d8;border:1px solid #aca899;border-radius:0;backdrop-filter:none;-webkit-backdrop-filter:none;
    box-shadow:2px 2px 2px rgba(0,0,0,.3)}
  body.xp #soloBar{top:8px}
  body.xp #soloName{color:#000}
  body.xp .iconbtn, body.xp .toggle{border:1px solid #003c74;border-radius:3px;color:#000;box-shadow:none;backdrop-filter:none;
    background:linear-gradient(180deg,#fff 0%,#ecebe5 86%,#d8d0c4 100%);letter-spacing:0;font-size:11px}
  body.xp .toggle[aria-pressed="true"]{background:linear-gradient(180deg,#cdcac3 0%,#e3e3db 8%,#e5e5de 94%,#f2f2f1 100%);border-color:#003c74}
  body.xp .itemchip i{color:#555}
  @media (max-width:640px){
    #dock{gap:9px}
    #controls,#specimens{min-width:0;width:100%}
    #specimens .spec .name i{display:none}
    #masthead{align-items:center}
  }
</style>
<link rel="stylesheet" href="css/xp-font.css">
</head>
<body data-reef="pptreef">
<div class="xp-only xbar" id="xpBar" role="menubar"></div>
<div id="stage" class="lit">
  <div class="hud" id="masthead">
    <div class="brand">
      <h1 id="title">Basic Reef</h1>
      <p id="sub">loading…</p>
    </div>
    <button class="iconbtn" id="reset" type="button">RESET VIEW</button>
  </div>
  <div class="hud" id="dock">
    <div class="panel" id="controls">
      <div id="sliders" style="display:grid;gap:10px"></div>
      <div class="toggles" id="toggles">
        <button class="toggle volt" id="tVolt" type="button" aria-pressed="true" hidden>CHARGED</button>
        <button class="toggle" id="tBg" type="button" aria-pressed="true">BACKDROP</button>
        <button class="toggle" id="tSpin" type="button" aria-pressed="false">AUTO-ORBIT</button>
        <button class="toggle" id="tSolo" type="button" aria-pressed="false">SOLO</button>
        <button class="toggle" id="tList" type="button" aria-pressed="true">LIST</button>
      </div>
    </div>
    <div class="panel" id="specimens"></div>
  </div>
  <div class="hud panel" id="soloBar" hidden>
    <div class="solorow">
      <button class="iconbtn" id="soloPrev" type="button" aria-label="이전 물고기">◀</button>
      <span id="soloName"></span>
      <button class="iconbtn" id="soloNext" type="button" aria-label="다음 물고기">▶</button>
    </div>
    <div class="itemrow" id="itemRow" aria-label="이 물고기에 붙일 아이템"></div>
  </div>
  <p id="msg" hidden></p>
</div>
<div class="xp-only xpal" id="xpPal"><span class="xcur"><i id="xpCur"></i></span><div class="xswatch" id="xpSw"></div></div>
<div class="xp-only xstat"><span id="xpHelp">물고기를 누르면 말을 해요 · 아래 색을 누르면 배경색이 바뀌어요</span><span id="xpCount"></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="reef-kit.js"></script>
<script src="reef-items.js"></script>

<script>
(function(){
  "use strict";
  // 이 페이지가 reef-data.json 안에서 어떤 reef인지 (body의 data-reef)
  var REEF_ID = document.body.getAttribute('data-reef');
  // 나의 어항 창에서 열렸는지 (주소 끝 ?xp)
  var XP = /[?&]xp\b/.test(location.search);
  if (XP) document.body.classList.add('xp');
  var kit = ReefKit(THREE);
  var stage = document.getElementById('stage');
  var msg = document.getElementById('msg');

  /* ── 3D 화면 준비 ── */
  var renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  stage.insertBefore(renderer.domElement, stage.firstChild);
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(38, 1, 0.1, 600);
  kit.lights(scene);
  var shoal = new THREE.Group();
  scene.add(shoal);

  var data = null, cfg = {}, fishes = [], props = [], talk = null;
  var mul = {swim:1, flap:1, charge:1};
  var spinOn = false, soloOn = false, voltOn = true;
  var cam = {theta:0.72, phi:1.32, radius:52, target:new THREE.Vector3()};
  var HOME = {theta:0.72, phi:1.32, radius:52};

  /* ── 데이터로 물고기 만들기 (다시 불러도 됨) ── */
  function build(d){
    data = d;
    var r = kit.reef(d, REEF_ID);
    cfg = r ? r.config : {};
    kit.applyStyle(d.style);
    fishes.forEach(kit.dispose); props.forEach(kit.dispose);
    fishes = []; props = [];

    var lanes = cfg.lanes || [];
    lanes.forEach(function(lane, i){
      var m = kit.find(d, lane.species);
      if (!m) return;
      var variant = (typeof lane.variant === 'number') ? m.variants[lane.variant] : lane.variant;
      var ids = (lane.effects || []).concat(m.effects || []);
      var effects = ids.map(function(id){ return kit.effect(d, id); }).filter(Boolean);
      var size = (+lane.scale || 1) * (0.92 + 0.16 * ((i * 37) % 7) / 7);
      var f = kit.build(m, {variant:variant, effects:effects, phase:(+lane.ph || 0) + i * 0.37, scale:size});
      f.userData.lane = lane;
      f.userData.vname = (variant && variant.name && lane.variant) ? variant.name : '';
      f.userData.hasFx = effects.length > 0;
      f.userData.hasCharge = effects.some(function(e){ return e.type === 'charge'; });
      shoal.add(f); fishes.push(f);
    });
    (cfg.props || []).forEach(function(p, i){
      var m = kit.find(d, p.item);
      if (!m) return;
      var o = kit.build(m, {scale:+p.scale || 1, phase:i * 1.3});
      var pos = p.pos || [0,0,0];
      o.position.set(+pos[0] || 0, +pos[1] || 0, +pos[2] || 0);
      o.rotation.y = (+p.rot || 0) * Math.PI / 180;
      shoal.add(o); props.push(o);
    });

    document.getElementById('title').textContent = cfg.title || (r && r.name) || 'Reef';
    document.title = cfg.title || (r && r.name) || 'Reef';
    document.getElementById('sub').textContent = cfg.subtitle || autoSub();
    HOME.radius = +cfg.radius || 52;
    if (!soloOn) cam.radius = HOME.radius;
    drawLegend();
    drawSliders();
    if (XP) xpBuild();
    if (!talk) talk = kit.Talk(stage, camera, d.style); else { talk.setStyle(d.style); talk.clear(); }
    applySolo(); applyVolt(); applyCamera(); applyItems();
    msg.hidden = true;
  }

  // 부제목 자동: "6 fish · 3 turtles · 2 charged"
  function autoSub(){
    var fish = 0, tur = 0, fx = 0;
    fishes.forEach(function(f){
      if (f.userData.model.motion === 'turtle') tur++; else fish++;
      if (f.userData.hasCharge) fx++;
    });
    var s = ['AR specimen preview', fish + ' fish'];
    if (tur) s.push(tur + ' turtles');
    if (fx) s.push(fx + ' charged');
    return s.join(' · ');
  }

  // 종류별 목록
  function drawLegend(){
    var box = document.getElementById('specimens');
    box.innerHTML = '';
    // 머리줄: 잡고 끌면 창이 움직이고, ✕는 창 끄기 (LIST 버튼으로 다시 켬)
    var head = document.createElement('div'); head.className = 'spechead';
    head.innerHTML = '<span>⠿ 종 목록 · 끌어서 옮기기</span><button type="button" aria-label="목록 창 끄기">✕</button>';
    head.querySelector('button').addEventListener('click', function(){ setList(false); });
    head.querySelector('button').addEventListener('pointerdown', function(e){ e.stopPropagation(); });
    head.addEventListener('pointerdown', startDrag);
    box.appendChild(head);
    var seen = {};
    fishes.forEach(function(f){
      var m = f.userData.model;
      var e = seen[m.id] || (seen[m.id] = {m:m, n:0, fx:0});
      e.n++; if (f.userData.hasFx) e.fx++;
    });
    Object.keys(seen).forEach(function(id){

  // 설정에 적힌 슬라이더만 보여주기

  /* ── 카메라: 끌어서 돌리기, 휠/두 손가락으로 확대, 쉬프트·오른쪽 버튼으로 옮기기 ── */
  function applyCamera(){
    cam.phi = Math.max(0.16, Math.min(Math.PI - 0.16, cam.phi));
    cam.radius = Math.max(8, Math.min(160, cam.radius));
    var sp = Math.sin(cam.phi);
    camera.position.set(
      cam.target.x + cam.radius * sp * Math.sin(cam.theta),
      cam.target.y + cam.radius * Math.cos(cam.phi),
      cam.target.z + cam.radius * sp * Math.cos(cam.theta));
    camera.lookAt(cam.target);
  }
  var el = renderer.domElement, pointers = new Map(), last = null, lastPinch = 0, panMode = false;

  el.addEventListener('pointerdown', function(e){

    if (pts.length >= 2){
      var dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      var mid = {x:(pts[0].x + pts[1].x)/2, y:(pts[0].y + pts[1].y)/2};
      if (lastPinch){ cam.radius *= lastPinch / dist; pan(mid.x - last.x, mid.y - last.y); }

    if (!last) return;

    last = {x:e.clientX, y:e.clientY};

  /* ── 목록 창: 끌어서 옮기기, 끄고 켜기 ── */
  var specBox = document.getElementById('specimens'), tList = document.getElementById('tList'), drag = null;
  function setList(on){ specBox.hidden = !on; sync(tList, on); }

  function startDrag(e){

    if (soloOn){
      var vis = fishes.filter(function(f){ return f.visible; });
      if (vis.length){
        tmp.set(0,0,0);
        vis.forEach(function(f){ tmp.add(f.position); });
        tmp.multiplyScalar(1 / vis.length);

      }

      var f = fishes[i];

        if (cand.length){ var pick = cand[Math.floor(Math.random() * cand.length)]; talk.say(pick, kit.nextLine(pick)); }

      var sci = document.createElement('i'); sci.textContent = e.m.sci || '';
      var hr = document.createElement('hr');
      var n = document.createElement('span'); n.textContent = (e.m.sizeCm ? '약 ' + e.m.sizeCm + 'cm · ' : '') + e.n + '마리';
      c.appendChild(big); c.appendChild(nm); c.appendChild(sci); c.appendChild(hr); c.appendChild(n);
      s.appendChild(c);
    }
    var mr = menu.getBoundingClientRect(), rr = row.getBoundingClientRect();
    putMenu(s, mr.right - 2, rr.top - 3, mr.left + 2);
  }
  // 데이터가 들어올 때마다: 물고기 목록과 마릿수
  function xpBuild(){
    var seen = {};
    xpSpecies = [];
    fishes.forEach(function(f){
      var m = f.userData.model;
      if (!seen[m.id]){
        seen[m.id] = { m: m, n: 0, icon: kit.thumb(m, 1).toDataURL(), big: kit.thumb(m, 4).toDataURL() };
        xpSpecies.push(seen[m.id]);
      }
      seen[m.id].n++;
    });
    document.getElementById('xpCount').textContent = '물고기 ' + fishes.length + '마리';
    closeMenus();
  }
  if (XP) xpSetup();

  /* ── 시작: 데이터 읽기 → 만들기 → 바뀌면 다시 만들기 ── */
  var gotLive = false;
  kit.loadData().then(function(d){
    if (!gotLive) build(d);
    for (var i = 0; i < fishes.length; i++) kit.steer(fishes[i], fishes[i].userData.lane, 0);
    frame();
    kit.watchData(d.updated, build);
  }).catch(function(e){
    msg.hidden = false;
    msg.textContent = 'reef-data.json을 읽지 못했어요. 이 파일과 같은 폴더에 reef-data.json과 reef-kit.js가 있는지 확인해 주세요. (' + (e && e.message || e) + ')';
    frame();
  });
  // All Reefs 미리보기 창에서는 어떤 reef 설정을 쓸지 같이 알려줌
  kit.onLiveData(function(d, m){ gotLive = true; if (m && m.reef) REEF_ID = m.reef; build(d); });
})();
</script>
