<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>First Reef</title>
<style>
  html,body{height:100%;margin:0;overflow:hidden;background:#1EB6F0;color:#F2EEF9;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0;background:#1EB6F0}
  /* 뒤에 깔리는 물속 움짤 (반투명) */
  .bgfx{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5;pointer-events:none}
  canvas{position:relative;z-index:1;display:block;width:100%;height:100%;touch-action:none}
  #top{position:absolute;left:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:5;display:flex;gap:8px;align-items:center}
  #top a,#top span{font-size:13px;color:#fff;background:rgba(16,12,30,.45);border-radius:999px;padding:6px 12px;text-decoration:none}
  #msg{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;font-size:14px;pointer-events:none}
  /* 물고기 이름 목록 (누르면 그 물고기를 숨기거나 보이기) */
  #legend{position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 20px)}
  #legend button{appearance:none;border:0;font:inherit;font-size:12px;color:#fff;background:rgba(16,12,30,.5);border-radius:999px;padding:5px 11px;cursor:pointer}
  #legend button[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
  /* 누른 물고기 이름표 */
  .tag{position:absolute;z-index:6;transform:translate(-50%,-130%);white-space:nowrap;pointer-events:none;
    font-size:12px;font-weight:600;color:#14324a;background:#fffdf6;border-radius:8px;padding:4px 9px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  /* 나의 어항 창 안 (?embed): 위 안내는 숨기고 이름 목록은 작게 */
  body.embed #top{display:none}
  body.embed #legend{left:6px;bottom:6px;gap:4px}
  body.embed #legend button{font-size:10px;padding:3px 8px}
</style>
</head>
<body data-reef="first">
<div id="stage">
  <img class="bgfx" src="assets/reef/water-tank.webp" alt="">
  <div id="top"><a href="index.html">← 처음으로</a><span>끌어서 돌려보기 · 물고기를 누르면 이름</span></div>
  <div id="msg">물고기 떼를 불러오는 중…</div>
  <div id="legend"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="reef-kit.js"></script>
<script src="reef-model.js"></script>
<script>
(function(){
"use strict";
/* reef-data.json의 모델 reef(First Reef)를 띄우고 헤엄 동작을 돌림 */
if (/[?&]embed\b/.test(location.search)) document.body.classList.add('embed');
var REEF_ID = document.body.getAttribute('data-reef');
var kit = ReefKit(THREE);
var stage = document.getElementById('stage'), msg = document.getElementById('msg');
var renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
stage.insertBefore(renderer.domElement, document.getElementById('top'));
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(40, 1, 0.01, 1000);
scene.add(new THREE.HemisphereLight(0xdff6ff, 0x1a3a5a, 1.1));
var sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(3, 6, 4); scene.add(sun);

var fish = null, cfg = {}, listKey = '', size = 1, hidden = {};
var cam = {theta:0.6, phi:1.25, radius:3};

// 이름 목록: 누르면 그 물고기를 숨기거나 보이기
function drawLegend(){
  var box = document.getElementById('legend'); box.innerHTML = '';
  (cfg.fish || []).forEach(function(f){
    var b = document.createElement('button'); b.type = 'button'; b.textContent = f.name || f.id;
    b.setAttribute('aria-pressed', !hidden[f.id]);
    b.addEventListener('click', function(){
      hidden[f.id] = !hidden[f.id]; b.setAttribute('aria-pressed', !hidden[f.id]);
      if (fish) fish.show(f.id, !hidden[f.id]);
    });
    box.appendChild(b);
  });
}

// 설정 → 물고기들 (목록이 바뀔 때만 새로 불러옴)
function build(d){
  var r = ReefModel.reef(d, REEF_ID) || ReefModel.reef(d);
  if (!r){ msg.style.display = ''; msg.textContent = 'reef-data.json에 모델 reef가 없어요'; return; }
  cfg = r.config || {};
  document.title = cfg.title || r.name || 'Reef';
  if (fish) fish.setSpeed(cfg.speed);
  cam.radius = size * (+cfg.zoom || 0.65);
  var key = JSON.stringify((cfg.fish || []).map(function(f){ return [f.id, f.model]; }));
  if (key === listKey){
    // 이름만 바뀌었으면 목록과 이름표 글자만 바꿈
    if (fish) fish.fish.forEach(function(p){ var f = (cfg.fish || []).filter(function(x){ return x.id === p.id; })[0]; if (f) p.name = f.name || f.id; });
    drawLegend(); return;
  }
  listKey = key;
  if (fish){ scene.remove(fish.holder); fish = null; }
  drawLegend();
  msg.style.display = ''; msg.textContent = '물고기 떼를 불러오는 중…';
  var mine = key;
  ReefModel.load(THREE, cfg.fish).then(function(m){
    if (mine !== listKey) return;
    fish = m; size = m.size; m.setSpeed(cfg.speed);
    m.fish.forEach(function(p){ m.show(p.id, !hidden[p.id]); });
    scene.add(m.holder);
    cam.radius = size * (+cfg.zoom || 0.65);
    camera.near = size / 500; camera.far = size * 20; camera.updateProjectionMatrix();
    msg.style.display = 'none';
  }).catch(function(){ msg.textContent = '물고기 모델을 불러오지 못했어요'; });
}

// 누른 물고기 머리 위에 이름표를 잠깐 띄움
var tags = [];
function showTag(hit){
  var el = document.createElement('div'); el.className = 'tag'; el.textContent = hit.fish.name;
  stage.appendChild(el);
  var t = { el: el, bone: hit.bone, left: 2.2 };
  tags.push(t);
}
var tv = new THREE.Vector3();
function updateTags(dt){
  var w = stage.clientWidth, h = stage.clientHeight;
  tags = tags.filter(function(t){
    t.left -= dt;
    if (t.left <= 0){ t.el.remove(); return false; }
    t.bone.getWorldPosition(tv).project(camera);
    t.el.style.left = ((tv.x + 1) / 2 * w) + 'px'; t.el.style.top = ((1 - tv.y) / 2 * h) + 'px';
    t.el.style.opacity = Math.min(1, t.left * 2);
    return true;
  });
}

// 손가락·마우스로 돌려보기, 휠·두 손가락으로 확대
function applyCam(){
  cam.phi = Math.max(0.15, Math.min(Math.PI - 0.15, cam.phi));
  cam.radius = Math.max(size * 0.15, Math.min(size * 4, cam.radius));
  var sp = Math.sin(cam.phi);
  camera.position.set(cam.radius*sp*Math.sin(cam.theta), cam.radius*Math.cos(cam.phi), cam.radius*sp*Math.cos(cam.theta));
  camera.lookAt(0, 0, 0);
}
var el = renderer.domElement, pts = {}, lastPinch = 0, idle = 0;
el.addEventListener('pointerdown', function(e){ pts[e.pointerId] = {x:e.clientX, y:e.clientY, x0:e.clientX, y0:e.clientY, t0:performance.now()}; idle = 0; try{ el.setPointerCapture(e.pointerId); }catch(er){} });
el.addEventListener('pointermove', function(e){
  var p = pts[e.pointerId]; if (!p) return;
  var ids = Object.keys(pts);
  if (ids.length === 1){ cam.theta -= (e.clientX - p.x) * 0.006; cam.phi -= (e.clientY - p.y) * 0.006; }
  p.x = e.clientX; p.y = e.clientY;
  if (ids.length === 2){
    var a = pts[ids[0]], b = pts[ids[1]], dd = Math.hypot(a.x - b.x, a.y - b.y);
    if (lastPinch) cam.radius *= lastPinch / dd;
    lastPinch = dd;
  }
  idle = 0;
});
function up(e){
  var p = pts[e.pointerId];
  // 거의 안 움직이고 뗐으면 물고기를 누른 것 → 이름표
  if (p && fish && Object.keys(pts).length === 1 && Math.hypot(e.clientX - p.x0, e.clientY - p.y0) < 8 && performance.now() - p.t0 < 450){
    var r = el.getBoundingClientRect();
    var hit = fish.nearest(camera, e.clientX - r.left, e.clientY - r.top, r.width, r.height, 60);
    if (hit) showTag(hit);
  }
  delete pts[e.pointerId]; lastPinch = 0;
}
el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
el.addEventListener('wheel', function(e){ e.preventDefault(); cam.radius *= Math.exp(e.deltaY * 0.0012); }, {passive:false});

function resize(){
  var w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

// 가만히 두면 천천히 돎
var clock = new THREE.Clock();
(function frame(){
  requestAnimationFrame(frame);
  var dt = Math.min(clock.getDelta(), 0.05);
  idle += dt; if (idle > 3) cam.theta += dt * 0.12;
  if (fish) fish.update(dt);
  applyCam();
  renderer.render(scene, camera);
  updateTags(dt);
})();

// 데이터 읽기 → 바뀌면 다시 (All Reefs 미리보기 창에서는 고치는 중인 값을 바로 받음)
var gotLive = false;
kit.loadData().then(function(d){
  if (!gotLive) build(d);
  kit.watchData(d.updated, build);
}).catch(function(){ msg.textContent = 'reef-data.json을 읽지 못했어요'; });
kit.onLiveData(function(d, m){ gotLive = true; if (m && m.reef) REEF_ID = m.reef; build(d); });
})();
</script>
</body>
</html>
