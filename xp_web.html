<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>나의 공간</title>
<link rel="stylesheet" href="assets/fonts/galmuri11.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&display=swap">
<style>
/* 나의 공간: 물 배경 위에 윈도우 XP(파란 테마) 창이 떠 있는 화면
   창 테두리 · 제목줄 · 단추 그림 · 색은 XP.css(MIT)의 값을 그대로 따름 */
:root{
  --surface:#ece9d8;     /* XP 창 바탕색 */
  --ui:Tahoma,"굴림",Gulim,"Galmuri11","Nanum Gothic",sans-serif;   /* 영문은 Tahoma, 한글은 굴림 (없으면 굴림처럼 도트 글씨인 갈무리11) */
  --cap:"Trebuchet MS","굴림",Gulim,"Galmuri11","Nanum Gothic",sans-serif;   /* 제목줄 글씨 */
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#3cc3cf url("assets/space/xp/bg.jpg") center/cover no-repeat;color:#000;font-family:var(--ui);font-size:12px;
  -webkit-font-smoothing:none;font-smooth:never}   /* XP처럼 글자 가장자리를 부드럽게 하지 않음 */
button{font:inherit;color:inherit;cursor:pointer}
#desk{position:fixed;inset:0;z-index:2;pointer-events:none}   /* 창들은 바탕화면 아이콘보다 앞, 빈 곳은 아이콘을 누를 수 있게 통과 */
.win{pointer-events:auto}

/* 왼쪽 위 안내 글: XP 노란 말풍선 모양 */
#hint{position:fixed;right:10px;top:10px;z-index:9000;margin:0;
  font-size:11px;color:#000;background:#ffffe1;border:1px solid #000;border-radius:3px;box-shadow:2px 2px 2px rgba(0,0,0,.25);
  pointer-events:none;padding:4px 8px;max-width:calc(100vw - 40px);box-sizing:border-box}

/* 창: 파란 테두리 3줄 + 위쪽만 둥근 모서리 */
.win{position:absolute;background:var(--surface);border-radius:8px 8px 0 0;padding:0 0 3px;
  box-shadow:inset -1px -1px #00138c,inset 1px 1px #0831d9,inset -2px -2px #001ea0,inset 2px 2px #166aee,
    inset -3px -3px #003bda,inset 3px 3px #0855dd,2px 3px 8px rgba(0,0,0,.35);
  -webkit-user-select:none;user-select:none}
.win.slide{transition:left .2s ease-out,top .2s ease-out}
.win .bar{height:21px;display:flex;align-items:center;justify-content:space-between;gap:2px;padding:3px 5px 3px 3px;
  background:linear-gradient(180deg,#0997ff 0%,#0053ee 8%,#0050ee 40%,#0066ff 88%,#0066ff 93%,#005bff 95%,#003dd7 96%,#003dd7 100%);
  border-top:1px solid #0831d9;border-left:1px solid #0831d9;border-right:1px solid #001ea0;border-radius:8px 7px 0 0;
  cursor:move;touch-action:none}
.win .tic{flex:none;width:16px;height:16px;margin-left:2px}   /* 제목 앞 작은 아이콘 */
.win .ttl{flex:1;padding-left:3px;font-family:var(--cap);font-size:13px;font-weight:700;color:#fff;text-shadow:1px 1px #0f1089;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 제목줄 단추: 최소화 · 최대화 · 닫기 (누르거나 올리면 그림이 바뀜) */
.win .btn{flex:none;width:21px;height:21px;margin-left:2px;background:center/21px 21px no-repeat;cursor:default}
.win .btn.min{background-image:url("assets/space/xp/minimize.svg")}
.win .btn.min:hover{background-image:url("assets/space/xp/minimize-hover.svg")}
.win .btn.min:active{background-image:url("assets/space/xp/minimize-active.svg")}
.win .btn.max{background-image:url("assets/space/xp/maximize.svg")}
.win .btn.max:hover{background-image:url("assets/space/xp/maximize-hover.svg")}
.win .btn.max:active{background-image:url("assets/space/xp/maximize-active.svg")}
.win .btn.rst{background-image:url("assets/space/xp/restore.svg")}
.win .btn.rst:hover{background-image:url("assets/space/xp/restore-hover.svg")}
.win .btn.rst:active{background-image:url("assets/space/xp/restore-active.svg")}
.win .btn.max,.win .btn.rst,.win .btn.cls{cursor:pointer}
.win .btn.cls{background-image:url("assets/space/xp/close.svg")}
.win .btn.cls:hover{background-image:url("assets/space/xp/close-hover.svg")}
.win .btn.cls:active{background-image:url("assets/space/xp/close-active.svg")}
/* 맨 앞이 아닌 창: XP처럼 제목줄과 테두리를 옅은 파랑으로 */
.win:not(.front){box-shadow:inset -1px -1px #6582d0,inset 1px 1px #7d9be3,inset -2px -2px #7a96df,inset 2px 2px #a6bdf1,
    inset -3px -3px #7a96df,inset 3px 3px #9db9eb,2px 3px 8px rgba(0,0,0,.25)}
.win:not(.front) .bar{background:linear-gradient(180deg,#a6bdf1 0%,#7a96df 8%,#7a96df 40%,#9db9eb 88%,#9db9eb 93%,#8faaea 95%,#7a96df 96%,#7a96df 100%);
  border-color:#7d9be3 #6582d0 #6582d0 #7d9be3}
.win:not(.front) .ttl{color:#d8e4f8;text-shadow:none}
.win:not(.front) .btn{opacity:.6}
.win.shut{display:none}   /* 닫힌 창 */

/* 나의 계정: XP 속성 창 (위 탭 + 흰 판 + 아래 확인 단추) */
.win.w-account .body{width:min(400px,calc(100vw - 40px));height:min(460px,calc(100vh - 110px));background:var(--surface);
  display:flex;flex-direction:column;padding:8px;box-sizing:border-box}
.ptabs{display:flex;align-items:flex-end;padding-left:3px;position:relative;z-index:1;flex:none}
.ptab{appearance:none;font:inherit;font-size:12px;color:#000;margin:0 1px -1px 0;padding:2px 12px 3px;cursor:pointer;
  border:1px solid #91a7b4;border-bottom:0;border-radius:3px 3px 0 0;background:linear-gradient(180deg,#fff 0%,#fafaf9 26%,#f0f0ea 95%,#ecebe5 100%)}
.ptab:hover{border-top-color:#e68b2c;box-shadow:inset 0 2px #ffc73c}
.ptab[aria-selected="true"]{background:#fcfcfe;border-color:#919b9c;border-top-color:#e68b2c;box-shadow:inset 0 2px #ffc73c;
  padding-bottom:5px;margin-bottom:-1px;position:relative;z-index:2}
.ppanel{flex:1;min-height:0;overflow:auto;background:#fcfcfe;border:1px solid #919b9c;box-shadow:1px 2px 2px rgba(208,206,191,.75);
  padding:10px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
.pfoot{flex:none;display:flex;justify-content:flex-end;gap:6px;padding-top:8px}
fieldset.grp{border:1px solid #d0d0bf;border-radius:4px;padding:4px 10px 10px;margin:0;min-width:0}
.grp legend{color:#0046d5;padding:0 3px}
.grp.danger{margin-top:auto}
.empty{color:#6f6f6f;margin:4px 0}
.note{color:#555;font-size:11px;margin:4px 0 0;line-height:1.5}
.prow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.prow .xbtn,.role .xbtn{min-width:64px}
.kakao-who{display:flex;gap:12px;align-items:flex-start}
.kpic{width:48px;height:48px;object-fit:cover;border:1px solid #7f9db9;background:#fff;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0}
.kv dt{color:#555}.kv dd{margin:0;word-break:break-all;min-height:15px}
.xbtn.mini{min-width:0;height:18px;padding:0 6px;font-size:11px;margin-left:6px;vertical-align:middle}
.role{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0}
.role + .role{border-top:1px solid #ecebe5}
.rtxt{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.badge{font-weight:700;color:#fff;background:#316ac5;padding:1px 6px;border-radius:2px;font-size:11px}
.badge.admin{background:#c0392b}.badge.owner{background:#2e8b3e}.badge.tester{background:#7b4bb7}
.rsub{flex-basis:100%;color:#444;padding-left:2px}
/* 아바타 */
.avbox{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:start}
.avprev{height:110px;background:#fff;border:1px solid #7f9db9;display:flex;align-items:center;justify-content:center;overflow:hidden}
.avprev canvas.av3d{width:110px;height:108px;display:block}
.avcap{text-align:center;margin-top:4px;font-size:11px}
.avform{display:flex;flex-direction:column;gap:3px;min-width:0}
.flab{color:#000;margin-top:5px}
.nrow{display:flex;gap:6px}.nrow .xbtn{min-width:52px;padding:0 8px}
.xlist{height:104px;overflow-y:auto;background:#fff;border:1px solid #7f9db9}
.xlist .opt{display:flex;align-items:center;gap:6px;padding:1px 4px;cursor:default;white-space:nowrap}
.xlist .opt .spr{width:28px;height:14px;flex:none;image-rendering:pixelated}   /* 모든 물고기 그림을 같은 칸 크기로 */
.xlist .opt.on{background:#316ac5;color:#fff}
.xsel{height:21px;border:1px solid #7f9db9;font:inherit;font-size:12px;background:#fff;border-radius:0;width:100%}
@media (max-width:420px){ .avbox{grid-template-columns:1fr} }

/* 리뷰 관리: 영수증 인증 칸 + 내 인증 기록 */
.win.receipt .body{width:min(380px,calc(100vw - 40px));height:min(470px,calc(100vh - 110px));background:var(--surface);
  display:flex;flex-direction:column;padding:8px;box-sizing:border-box}
.rout{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.chk.ok{color:#2e8b3e}.chk.no{color:#c0392b}
.rdone{font-weight:700;color:#2e8b3e;margin:2px 0}
.rtext summary{cursor:pointer;color:#0046d5;font-size:11px}
.rtext pre{margin:4px 0 0;max-height:120px;overflow:auto;background:#fff;border:1px solid #7f9db9;padding:4px;font:11px/1.4 var(--ui);
  white-space:pre-wrap;-webkit-user-select:text;user-select:text}
/* XP 진행 막대: 초록 칸이 차오름 */
.xprog{height:14px;border:1px solid #686868;border-radius:3px;background:#fff;padding:1px;box-sizing:border-box;overflow:hidden}
.xprog i{display:block;height:100%;width:0;transition:width .2s;background:repeating-linear-gradient(90deg,#2ed330 0 8px,transparent 8px 10px)}

/* 라이선스 창: 열 제목 줄 + XP 스크롤 막대가 붙은 목록 + 아래 상태 줄 */
body.locked #lic{display:none}   /* 권한이 없으면 라이선스 창도 숨김 */
body.locked .dk:not(.free) .ic{opacity:.45;filter:grayscale(.6)}   /* 막힌 창 아이콘은 흐리게 */
#lic{position:fixed;right:10px;bottom:10px;z-index:8000;width:300px;pointer-events:auto;display:flex;flex-direction:column}
#lic .bar{cursor:default}
#lic .btn.max,#lic .btn.rst,#lic .btn.min{cursor:pointer}
/* 열 제목: XP 목록 보기 머리줄, 누르면 그 열로 정렬 */
#lic .lhead{display:grid;margin:0 3px;padding-right:17px;background:linear-gradient(180deg,#fff 0%,#f6f5f0 70%,#ebeadb 100%);border-bottom:1px solid #d6d2c2;font-size:11px}
#lic .lhead button{appearance:none;border:0;border-right:1px solid #d6d2c2;box-shadow:1px 0 #fff;background:transparent;font:inherit;font-size:11px;
  text-align:left;padding:3px 6px;cursor:pointer;color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lic .lhead button:hover{box-shadow:inset 0 -3px #f9b13c}
/* 정렬 방향 작은 세모 */
#lic .lhead button.on::after{content:"";display:inline-block;margin-left:5px;vertical-align:middle;
  border-left:4px solid transparent;border-right:4px solid transparent;border-top:4px solid #8d8d8d}
#lic .lhead button.on.up::after{border-top:0;border-bottom:4px solid #8d8d8d}
#lic .lwrap{position:relative;display:flex;margin:0 3px;border-bottom:1px solid #7f9db9;background:#fff}
#lic .lbody{flex:1;min-width:0;height:118px;overflow-y:scroll;font-size:11px;scrollbar-width:none}
#lic .lbody::-webkit-scrollbar{display:none}
#lic .lrow{display:grid;cursor:default}
#lic .lrow > span{padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lic .lrow.on{background:#316ac5;color:#fff}
#lic .lrow.on a{color:#fff}
#lic .lrow a{color:#00c}
#lic .lempty{padding:8px;color:#6f6f6f}
/* 좁을 때는 소유자 · 사용 위치만 */
#lic .lhead,#lic .lrow{grid-template-columns:38% 1fr 16% 18%}
#lic.narrow .lhead,#lic.narrow .lrow{grid-template-columns:44% 1fr}
#lic.narrow .c-kind,#lic.narrow .c-url{display:none}
/* XP 스크롤 막대 (그림은 XP.css) */
.xscroll{width:17px;flex:none;display:flex;flex-direction:column;background:url("assets/space/xp/scroll-background.svg")}
.xscroll .xs-up,.xscroll .xs-dn{height:17px;flex:none;cursor:pointer;background:center/17px 17px no-repeat}
.xscroll .xs-up{background-image:url("assets/space/xp/scroll-arrow-up.svg")}
.xscroll .xs-dn{background-image:url("assets/space/xp/scroll-arrow-down.svg")}
.xscroll .xs-track{flex:1;position:relative}
.xscroll .xs-thumb{position:absolute;left:0;right:0;top:0;min-height:12px;box-sizing:border-box;cursor:pointer;
  background:#c8d6fb url("assets/space/xp/scroll-thumb.svg") center/7px no-repeat;border:1px solid #fff;border-radius:2px;
  box-shadow:inset -3px 0 #bad1fc,inset 1px 1px #b7caf5;touch-action:none}
.xscroll.off .xs-thumb{display:none}
#lic .lstat{display:flex;height:20px;margin:0 3px;font-size:11px;background:#ece9d8;border-top:1px solid #fff}
#lic .lstat span{display:flex;align-items:center;padding:0 4px;border-right:1px solid #aca899;box-shadow:1px 0 #fff;min-width:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lic .lstat #licSel{flex:1;min-width:0;display:block;line-height:20px}
#lic .lstat span:last-child{border-right:0;box-shadow:none}
#lic .lstat img{width:14px;height:14px}
#lic.folded .lhead,#lic.folded .lwrap,#lic.folded .lstat{display:none}
#lic.folded{padding-bottom:0}
/* 최대화: 화면을 꽉 채움 (모바일은 아래 작업 표시줄만큼 비움) */
#lic.maxed{left:0;top:0;right:0;bottom:var(--gap,0px);width:auto;border-radius:0}
#lic.maxed .bar{border-radius:0}
#lic.maxed .lwrap{flex:1;min-height:0}
#lic.maxed .lbody{height:auto}
#lic.maxed ~ #hint{display:none}   /* 최대화하면 안내 글이 가리지 않게 */
@media (max-width:700px){
  #lic{bottom:calc(var(--gap,0px) + 6px);right:6px;width:240px}
  #lic .lbody{height:84px}
}
/* 매장 정보 창: 이름표 + 값, 매장 별 리뷰 글자 단추 */
.sinfo{grid-template-columns:auto 1fr;margin:0 0 4px;white-space:normal;text-align:left}
.xlink{appearance:none;border:0;background:none;padding:0;font:inherit;color:#0000ee;text-decoration:underline;cursor:pointer}
.xlink:hover{color:#e66a00}
.spotadd{position:absolute;left:6px;top:34px;z-index:1;min-width:0}
/* 매장 정보 고치기 창 */
.win.msg.wide .body{width:min(360px,calc(100vw - 30px))}
.sform{display:grid;grid-template-columns:auto 1fr;gap:5px 8px;align-items:center;text-align:left;white-space:normal}
.sform label{color:#000}
.sform textarea.gin{height:48px;resize:vertical}
.sform .xsel{height:23px}
.sform .spos{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sform .spos .xbtn{min-width:0;padding:0 8px}
.win.msg.picking{display:none}   /* 지도에서 자리를 고르는 동안 숨김 */
/* 리뷰 관리 창 위의 매장 QR */
.qrrow{display:flex;gap:10px;align-items:flex-start}
.qrimg{flex:none;width:132px;height:132px;padding:4px;background:#fff;border:1px solid #7f9db9}
.qrimg img,.qrimg canvas{display:block;width:132px!important;height:132px!important}
.qrurl{font-size:11px;word-break:break-all;color:#444;-webkit-user-select:text;user-select:text}
/* 선물 도착 알림: 오른쪽 위에 쌓이는 작은 XP 창, 닫기 단추만 */
#notes{position:fixed;right:10px;top:10px;z-index:9500;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.win.note{position:relative;width:210px;pointer-events:auto;animation:pop .2s ease-out}
.win.note .bar{cursor:default}
.win.note .body{background:var(--surface);display:flex;gap:8px;align-items:center;padding:8px 10px;box-sizing:border-box}
.win.note .body img{width:32px;height:32px;flex:none}
.win.note .body b{display:block;font-size:12px}
.win.note .body span{font-size:11px;color:#444}
@media (max-width:700px){ #notes{top:calc(10px + env(safe-area-inset-top,0px))} }
/* QR 위치 확인 알림 창 */
.win.msg .body{width:min(300px,calc(100vw - 40px));background:var(--surface);padding:14px 14px 12px;box-sizing:border-box}
.win.msg .mtx{margin:0 0 12px;line-height:1.6;white-space:pre-line}
.win.msg .mbt{display:flex;justify-content:center;gap:8px}
.win.msg.ok .mtx{font-weight:700}
body.has-open #hint{display:none}   /* 창이 하나라도 열리면 안내 글은 숨김 */
.win.gift.maxed .body{justify-content:flex-start;gap:10px}
/* 최대화한 창: 화면을 꽉 채움 (모바일은 아래 작업 표시줄만큼 비움) */
.win.maxed{left:0!important;top:0!important;width:100%;height:calc(100% - var(--gap,0px));box-sizing:border-box;
  display:flex;flex-direction:column;border-radius:0}
.win.maxed .bar{flex:none;border-radius:0;cursor:default}
.win.maxed .body{flex:1;min-height:0;width:auto!important;height:auto!important;aspect-ratio:auto!important}
/* 창 안쪽: 테두리 3줄 안에 딱 붙임 */
.win .body{position:relative;margin:0 3px;overflow:hidden;background:#fff}
.win iframe{display:block;width:100%;height:100%;border:0;background:#A0D6D5}
.win .shield{position:absolute;inset:0;z-index:2}   /* 맨 앞이 아닌 창의 내용을 덮어서 두 번 눌러 앞으로 보내게 함 */
.win.front .shield{display:none}

.win.fish .body{width:min(340px,calc(100vw - 40px));height:250px}
.win.w-fish .body{width:min(520px,calc(100vw - 40px));height:min(430px,calc(100vh - 120px))}   /* 나의 어항: 그림판처럼 크게 */
.win.w-ftank .body{width:min(520px,calc(100vw - 40px));height:min(430px,calc(100vh - 120px))}   /* 친구 어항: 나의 어항과 같은 크기 */
/* 친구 관리: 나의 계정처럼 XP 속성 창 */
.win.friends .body{width:min(400px,calc(100vw - 40px));height:min(460px,calc(100vh - 110px));background:var(--surface);
  display:flex;flex-direction:column;padding:8px;box-sizing:border-box}
.flist{height:170px;overflow-y:auto;background:#fff;border:1px solid #7f9db9}
.frow{display:flex;align-items:center;gap:8px;padding:3px 5px;cursor:default}
.frow.on{background:#316ac5;color:#fff}
.frow.on .fsub{color:#dfe8f7}
.fpic{width:32px;height:32px;object-fit:cover;border:1px solid #7f9db9;background:#fff;flex:none}
.fpic.big{width:48px;height:48px}
.fname{display:flex;flex-direction:column;min-width:0}
.fname b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsub{font-size:11px;color:#6f6f6f}
.fcode{font:700 18px/1.4 "Lucida Console",monospace;letter-spacing:.12em;padding:4px 6px;background:#fff;border:1px solid #7f9db9;
  display:inline-block;-webkit-user-select:all;user-select:all}
/* 나의 계정 프로필 사진 */
.phrow{display:flex;gap:10px;align-items:center}
.phpic{width:64px;height:64px;object-fit:cover;border:1px solid #7f9db9;background:#fff;flex:none}
.win.gift .body{width:min(300px,calc(100vw - 40px));height:104px;background:var(--surface);box-sizing:border-box;padding:10px 12px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px}
.glabel{align-self:flex-start;font-size:12px}
/* 글 입력 칸: XP의 얇은 파란 회색 테두리 */
.gin{width:100%;height:23px;box-sizing:border-box;border:1px solid #7f9db9;background:#fff;color:#000;font:inherit;padding:3px 4px;
  border-radius:0;outline:none;-webkit-appearance:none;appearance:none;-webkit-user-select:text;user-select:text}
/* XP 단추: 둥근 모서리, 위가 밝은 그러데이션, 올리면 주황 테두리, 누르면 들어감 */
.xbtn{min-width:75px;height:23px;padding:0 12px;font-size:12px;color:#000;box-sizing:border-box;border:1px solid #003c74;border-radius:3px;
  background:linear-gradient(180deg,#fff 0%,#ecebe5 86%,#d8d0c4 100%)}
.xbtn:hover{box-shadow:inset -1px 1px #fff0cf,inset 1px 2px #fdd889,inset -2px 2px #fbc761,inset 2px -2px #e5a01a}
.xbtn:focus-visible{outline:1px dotted #000;outline-offset:-4px;
  box-shadow:inset -1px 1px #cee7ff,inset 1px 2px #98b8ea,inset -2px 2px #bcd4f6,inset 1px -1px #89ade4,inset 2px -2px #89ade4}
.xbtn:active{box-shadow:none;background:linear-gradient(180deg,#cdcac3 0%,#e3e3db 8%,#e5e5de 94%,#f2f2f1 100%)}
.win.picture.cover .body{width:min(400px,calc(100vw - 40px));height:auto;aspect-ratio:1726/950;background:#6b6b6b}
.pic.cover{inset:0;width:100%;height:100%;object-fit:cover;image-rendering:auto;animation:none}
.win.picture .body{width:min(300px,calc(100vw - 40px));height:250px;background:#EAF6FB}
.pic{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain;image-rendering:pixelated;
  animation:bob 2.4s steps(4) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.win.map .body{width:min(440px,calc(100vw - 40px));aspect-ratio:1111/862}   /* 지도 그림 비율 그대로 */
.win.map.live .body{width:min(480px,calc(100vw - 40px));height:min(360px,calc(100vh - 160px));aspect-ratio:auto}
.kmap{position:absolute;inset:0;z-index:0}   /* 카카오 지도가 들어가는 칸 */

/* 잠깐 뜨는 안내 글: XP 노란 말풍선 모양 */
#toast{position:fixed;left:50%;top:calc(44px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9999;opacity:0;
  background:#ffffe1;border:1px solid #000;border-radius:3px;box-shadow:2px 2px 2px rgba(0,0,0,.25);
  padding:5px 9px;font-size:12px;max-width:88vw;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

/* 지도와 내 위치 별 */
.mapimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.me{position:relative;width:0;height:0}   /* 별과 말풍선을 내 위치 한 점에 붙이는 틀 */
.me .pbubble{left:-17px;bottom:24px}
/* 장소 아이콘: 두근거리듯 살짝 커졌다 작아짐 */
.heart{position:absolute;width:26px;height:32px;transform:translate(-50%,-50%);cursor:pointer;z-index:1;
  filter:drop-shadow(1px 2px 1px rgba(0,0,0,.35));animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:translate(-50%,-50%) scale(1)}12%{transform:translate(-50%,-50%) scale(1.15)}24%{transform:translate(-50%,-50%) scale(1)}}
.mebtn{position:absolute;left:6px;top:6px;z-index:1;min-width:0}   /* 내 위치로 가는 단추 */
/* 별: 위아래로 살짝 흔들리고 주변에 노란 빛 */
.star{position:absolute;width:30px;height:30px;transform:translate(-50%,-50%);cursor:pointer;z-index:1;
  filter:drop-shadow(1px 2px 2px rgba(0,0,0,.35)) drop-shadow(0 0 5px rgba(255,214,64,.7));
  animation:starBob 1.4s steps(1) infinite}
@keyframes starBob{0%{transform:translate(-50%,-50%)}25%{transform:translate(-50%,calc(-50% - 2px))}
  50%{transform:translate(-50%,calc(-50% - 4px))}75%{transform:translate(-50%,calc(-50% - 2px))}}

/* 말풍선: XP 노란 풍선 도움말 모양 (아래에 꼬리) */
.pbubble{position:absolute;z-index:3;background:#ffffe1;color:#000;font-size:12px;white-space:nowrap;
  padding:5px 9px;border:1px solid #000;border-radius:6px;box-shadow:2px 2px 2px rgba(0,0,0,.25);
  animation:pop .15s ease-out;pointer-events:none}
.pbubble::after{content:"";position:absolute;left:var(--tail,12px);bottom:-8px;width:10px;height:8px;background:#000;
  clip-path:polygon(0 0,100% 0,0 100%)}
.pbubble::before{content:"";position:absolute;left:calc(var(--tail,12px) + 1px);bottom:-6px;width:8px;height:7px;background:#ffffe1;
  clip-path:polygon(0 0,100% 0,0 100%);z-index:1}
@keyframes pop{from{opacity:0}to{opacity:1}}

/* 아이콘 줄: 컴퓨터는 왼쪽 위부터 아래로 늘어선 바탕화면 아이콘 (창보다 뒤), 모바일은 아래쪽 XP 작업 표시줄 */
#dock{position:fixed;z-index:1;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:10px;
  left:6px;top:calc(8px + env(safe-area-inset-top,0px));max-height:calc(100vh - 16px)}
.dk{appearance:none;background:transparent;border:0;padding:4px;width:84px;display:flex;flex-direction:column;align-items:center;gap:4px}
.dk .ic{height:48px;display:flex;align-items:center;justify-content:center}
.dk .ic img{width:48px;height:48px;display:block;image-rendering:pixelated}   /* 48픽셀 아이콘을 도트 그대로 */
/* 바탕화면 아이콘 이름: 흰 글씨 + 그림자, 고르면 파란 칸 */
.dk .nm{font-size:11px;line-height:1.3;color:#fff;text-align:center;padding:0 2px;text-shadow:1px 1px 1px #000}
.dk:hover .nm,.dk:focus-visible .nm{background:#316ac5}
.dk:active .ic{filter:brightness(.8) sepia(1) hue-rotate(180deg) saturate(3)}
@media (max-width:700px){
  #hint{right:auto;bottom:auto;left:10px;top:calc(10px + env(safe-area-inset-top,0px))}
  #dock{z-index:9000;flex-direction:row;flex-wrap:nowrap;top:auto;max-height:none;left:0;right:0;bottom:0;gap:0;justify-content:space-around;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(180deg,#1f2f86 0,#3165c4 3%,#3682e5 6%,#4490e6 10%,#3883e5 12%,#2b71e0 15%,#2663da 18%,#235bd6 20%,
      #2258d5 23%,#2157d6 38%,#245ddb 54%,#2562df 86%,#245fdc 89%,#2158d4 92%,#1d4ec0 95%,#1941a5 98%)}
  .dk{width:auto;flex:1;min-width:0;padding:2px;border-radius:3px}
  .dk .ic{height:32px}.dk .ic img{width:32px;height:32px;image-rendering:auto}
  .dk .nm{font-size:10.5px}
  .dk:hover .nm,.dk:focus-visible .nm{background:transparent}
  .dk:active{background:#1e52b7;box-shadow:inset 1px 1px 1px rgba(0,0,0,.4)}
}
</style>
</head>
<body>
<div id="desk"></div>
<!-- 라이선스: 화면 구석에 항상 떠 있는 작은 XP 창 (최소화하면 제목줄만 남음) -->
<div id="lic" class="win front" role="complementary" aria-label="라이선스">
  <div class="bar"><img class="tic" src="assets/space/xp/icon-info.png" alt=""><span class="ttl">라이선스</span>
    <span class="btn min" id="licMin" title="접기"></span><span class="btn max" id="licMax" title="최대화"></span></div>
  <div class="lhead" id="licHead" role="row"></div>
  <div class="lwrap"><div class="lbody" id="licList" role="table"></div><div class="xscroll" id="licBar" aria-hidden="true">
    <span class="xs-up"></span><span class="xs-track"><span class="xs-thumb"></span></span><span class="xs-dn"></span></div></div>
  <div class="lstat"><span><img src="assets/space/xp/icon-info.png" alt=""></span><span id="licSel"></span><span id="licCount"></span></div>
</div>
<p id="hint">아이콘을 누르면 창이 열립니다 · 제목줄을 끌면 움직입니다</p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/spots.js"></script>
<script src="js/licenses.js?v=8"></script>
<script src="js/receipt.js"></script>
<script src="js/friends.js"></script>
<script>
/* 나의 공간: 끌어서 옮기는 가짜 창들, 두 번 누르면 맨 앞으로, 지도의 별 */
(function () {
  "use strict";
  var desk = document.getElementById('desk');
  var KEY = 'reef-space-xp-v1';
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} }

  /* ── 만들 창 목록 (위에서부터 순서대로 쌓임, 마지막이 맨 앞) ── */
  var WINDOWS = [
    { id: 'account', title: '나의 계정',   kind: 'account', icon: "assets/space/xp/icon-account.png", at: [0.30, 0.08] },
    { id: 'fish',    title: '나의 어항',   kind: 'reef',    page: 'first-reef.html?paint', icon: "assets/space/xp/icon-fish.png",   at: [0.03, 0.37] },
    { id: 'map',     title: '월계 지도', kind: 'map',     icon: "assets/space/xp/icon-map.png",    at: [0.29, 0.06] },
    { id: 'friends', title: '친구 관리',   kind: 'friends', icon: "assets/space/xp/icon-friends.png", at: [0.72, 0.10] },
    { id: 'stock',   title: '재고 관리',   kind: 'picture', img: "assets/space/stock.webp", cover: true, icon: "assets/space/xp/icon-stock.png", at: [0.07, 0.62] },
    { id: 'review',  title: '리뷰 관리',   kind: 'receipt', icon: "assets/space/xp/icon-review.png", at: [0.36, 0.60] },
    { id: 'gift',    title: '선물 코드',   kind: 'gift',    icon: "assets/space/xp/icon-gift.png",    at: [0.72, 0.52] }
  ];

  var wins = [];       // 화면에 있는 창들
  var zTop = 10;

  /* ── 두 번 누르기 감지: 마우스와 터치 모두 (조금이라도 끌었으면 세지 않음) ── */
  function onDouble(el, fn) {
    var last = 0, lx = 0, ly = 0, dx = 0, dy = 0;
    el.addEventListener('pointerdown', function (e) { dx = e.clientX; dy = e.clientY; });
    el.addEventListener('pointerup', function (e) {
      if (e.button > 0 || Math.hypot(e.clientX - dx, e.clientY - dy) > 6) { last = 0; return; }
      var now = performance.now();
      if (now - last < 350 && Math.hypot(e.clientX - lx, e.clientY - ly) < 24) { last = 0; fn(e); }
      else { last = now; lx = e.clientX; ly = e.clientY; }
    });
  }

  /* ── 창 하나 만들기 ── */
  function makeWindow(def) {
    var w = document.createElement('div');
    w.className = 'win ' + (def.kind === 'reef' ? 'fish' : def.kind) + (def.cover ? ' cover' : '') + ' w-' + def.id;
    var bar = document.createElement('div'); bar.className = 'bar';
    // 제목 앞 작은 아이콘
    var tic = document.createElement('img'); tic.className = 'tic'; tic.src = def.icon; tic.alt = ''; tic.draggable = false;
    var ttl = document.createElement('span'); ttl.className = 'ttl'; ttl.textContent = def.title;
    bar.appendChild(tic); bar.appendChild(ttl);
    var btn = {};
    [['min', '최소화'], ['max', '최대화'], ['cls', '닫기']].forEach(function (g) {
      var b = document.createElement('span'); b.className = 'btn ' + g[0]; b.title = g[1]; bar.appendChild(b); btn[g[0]] = b;
    });
    var body = document.createElement('div'); body.className = 'body';
    w.appendChild(bar); w.appendChild(body);
    w.classList.add('shut');
    desk.appendChild(w);
    var entry = { def: def, el: w, bar: bar, body: body, maxBtn: btn.max, built: false };
    wins.push(entry);
    dragSetup(entry);
    onDouble(w, function () { bringFront(entry); });
    onDouble(bar, function (e) { if (!e.target.classList.contains('btn')) toggleMax(entry); });   // 제목줄 두 번 누르면 최대화 / 복원
    btn.max.addEventListener('click', function () { toggleMax(entry); });
    btn.cls.addEventListener('click', function () { closeWin(entry); });
    return entry;
  }

  /* ── 창 내용 채우기 (처음 열 때 한 번) ── */
  function buildBody(entry) {
    var def = entry.def, body = entry.body;

    if (def.kind === 'reef') {
      var fr = document.createElement('iframe');
      fr.title = def.title; entry.frame = fr;   // 주소는 열 때 넣고 닫을 때 비움 (카메라 등이 계속 켜져 있지 않게)
      var sh = document.createElement('div'); sh.className = 'shield';
      body.appendChild(fr); body.appendChild(sh);
    } else if (def.kind === 'picture') {
      // 그림 한 장 띄우기 (cover면 창을 꽉 채움)
      var pic = document.createElement('img'); pic.className = 'pic' + (def.cover ? ' cover' : ''); pic.src = def.img; pic.alt = def.title; pic.draggable = false;
      body.appendChild(pic);
    } else if (def.kind === 'gift') {
      // 코드 입력 창: 맞는 코드면 소속(신분 · 활동)이 바뀜
      body.innerHTML = '<label class="glabel" for="gift-code">코드 입력</label>' +
        '<input id="gift-code" class="gin" type="text" maxlength="24" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="선물 코드를 입력하십시오">' +
        '<button class="xbtn" type="button">확인</button>';
      var gin = body.querySelector('.gin');
      body.querySelector('.xbtn').addEventListener('click', function () { redeem(gin); });
      gin.addEventListener('keydown', function (e) { if (e.key === 'Enter') redeem(gin); });
    } else if (def.kind === 'account') {
      buildAccount(entry);
    } else if (def.kind === 'receipt') {
      buildReceipt(entry);
    } else if (def.kind === 'friends') {
      entry.close = function () { closeWin(entry); };
      entry.isOpen = function () { return isOpen(entry); };
      XPFriends.build(entry, XPUI);
    } else if (def.kind === 'map') {
      buildMap(body);
    }
    entry.built = true;
  }

  /* ── 열기 · 닫기 · 최대화 ── */
  function isOpen(entry) { return !entry.el.classList.contains('shut'); }
  function saveOpen() {
    saved.open = wins.filter(isOpen).map(function (o) { return o.def.id; });
    document.body.classList.toggle('has-open', saved.open.length > 0);
    save();
  }
  // 권한(관리자 · 점주 · 베타테스터)이 하나도 없으면 선물 코드 창만 열 수 있음
  var FREE = ['gift'];
  function allowed() { return !!(window.Core && Core.state.loaded && Core.perms().length); }
  function openWin(entry) {
    if (FREE.indexOf(entry.def.id) < 0 && !allowed()) { lockedMsg(); return; }
    if (isOpen(entry)) { bringCenter(entry); return; }
    entry.el.classList.remove('shut');
    if (!entry.built) buildBody(entry);
    if (entry.frame) entry.frame.src = entry.def.page;
    var pos = saved[entry.def.id] || defaultPos(entry);
    place(entry, pos[0], pos[1]);
    bringFront(entry);
    refitMaps();
    saveOpen();
  }
  // keep이 참이면 '열어 둔 창' 기록은 그대로 둠 (권한이 잠깐 없을 때 닫는 경우)
  function closeWin(entry, keep) {
    if (entry.el.classList.contains('maxed')) toggleMax(entry);
    entry.el.classList.add('shut');
    entry.el.classList.remove('front');
    if (entry.frame) entry.frame.src = 'about:blank';
    // 남은 창 중 가장 위에 있는 창을 맨 앞으로
    var rest = wins.filter(isOpen).sort(function (a, b) { return (+b.el.style.zIndex || 0) - (+a.el.style.zIndex || 0); });
    if (rest[0]) bringFront(rest[0]);
    if (keep !== true) saveOpen();
  }
  function lockedMsg() {
    var box = msgBox('권한 필요', 'icon-info.png');
    var st = window.Core ? Core.state : {};
    var btns = [['선물 코드 열기', function () { box.el.remove(); openWin(wins.filter(function (o) { return o.def.id === 'gift'; })[0]); }],
                ['확인', function () { box.el.remove(); }]];
    if (window.Core && Core.ready && !st.user) btns.unshift(['카카오 로그인', function () { Core.login(); }]);
    box.say('이 창은 권한이 있는 사람만 열 수 있습니다.\n받은 선물 코드를 넣어 권한을 등록한 뒤 다시 시도해 주십시오.', btns);
  }
  function toggleMax(entry) {
    var on = !entry.el.classList.contains('maxed');
    entry.el.classList.toggle('maxed', on);
    entry.maxBtn.className = 'btn ' + (on ? 'rst' : 'max');
    entry.maxBtn.title = on ? '이전 크기로' : '최대화';
    if (on) bringFront(entry);
    refitMaps();
  }
  // 지도 칸 크기가 바뀌면 가운데를 그대로 두고 다시 맞춤
  function refitMaps() {
    setTimeout(function () {
      maps.forEach(function (m) { var c = m.getCenter(); m.relayout(); m.setCenter(c); });
    }, 0);
  }

  /* ── 지도: 카카오 지도를 광운대학교 둘레로 띄우고 장소들을 하트로 표시 (키가 없거나 못 불러오면 그림 지도) ── */
  var CENTER = [37.6195, 127.0598];   // 광운대학교 근처
  var maps = [];
  function buildMap(body) {
    var key = (window.APP_CONFIG || {}).KAKAO_MAP_KEY;
    if (!key) { buildPictureMap(body); return; }
    var win = body.parentNode; win.classList.add('live');
    var box = document.createElement('div'); box.className = 'kmap'; body.appendChild(box);
    var sh = document.createElement('div'); sh.className = 'shield'; body.appendChild(sh);
    // 못 불러오면 그림 지도로 바꾸고 이유를 잠깐 보여 줌
    function fail(why) {
      win.classList.remove('live'); box.remove(); sh.remove(); buildPictureMap(body);
      if (window.Core) Core.toast('카카오 지도를 못 불러왔습니다: ' + why);
      console.warn('카카오 지도 실패:', why, location.origin);
    }
    var sc = document.createElement('script');
    sc.src = 'https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&libraries=services&appkey=' + encodeURIComponent(key);
    sc.onerror = function () { fail('지도 파일을 받지 못함 (키 또는 등록한 사이트 주소 확인)'); };
    sc.onload = function () {
      if (!window.kakao || !kakao.maps) { fail('지도 기능이 없음'); return; }
      kakao.maps.load(function () {
        var map = new kakao.maps.Map(box, { center: new kakao.maps.LatLng(CENTER[0], CENTER[1]), level: 4 });
        map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);   // 확대 · 축소 버튼
        maps.push(map);
        watchMe(map, body);
        spotsReady.then(function () { showSpots(map, true); });
        // 관리자만: 매장 추가 단추
        var add = button('매장 추가', function () { editSpot(null); }); add.classList.add('spotadd'); body.appendChild(add);
        function showAdd() { add.hidden = !(window.Core && Core.isAdmin()); }
        if (window.Core) Core.onChange(showAdd); showAdd();
      });
    };
    document.head.appendChild(sc);
  }

  /* ── 매장 목록: 서버(spots 표)에서 읽음, 못 읽으면 js/spots.js 목록 ── */
  var spotsReady = window.loadSpots ? window.loadSpots(window.Core && Core.sb) : Promise.resolve();
  var spotLayers = [];   // 지도마다 그려 둔 매장 아이콘 · 범위 (다시 그릴 때 지움)
  function redrawSpots() {
    return window.loadSpots(window.Core && Core.sb).then(function () { spotLayers.forEach(function (l) { showSpots(l.map, false); }); });
  }

  /* ── 장소 아이콘: 범위가 있으면 한가운데, 없으면 주소로 찾아서 놓고, fit이면 모두 보이게 화면을 맞춤 ── */
  function showSpots(map, fit) {
    var layer = spotLayers.filter(function (l) { return l.map === map; })[0];
    if (!layer) { layer = { map: map, items: [] }; spotLayers.push(layer); }
    layer.items.forEach(function (o) { o.setMap(null); }); layer.items = [];
    var list = window.SPOTS || [], geo = new kakao.maps.services.Geocoder();
    var bounds = new kakao.maps.LatLngBounds(), found = 0, done = 0;
    function put(spot, lat, lng) {
      spot.lat = lat; spot.lng = lng;   // 찾은 좌표는 QR 위치 확인에도 씀
      var pos = new kakao.maps.LatLng(lat, lng);
      var wrap = document.createElement('div'); wrap.className = 'me';
      var h = document.createElement('img'); h.className = 'heart'; h.src = spot.icon || "assets/space/xp/heart.png"; h.alt = spot.name;
      h.draggable = false; wrap.appendChild(h);
      // 아이콘을 누르면 매장 정보 창
      h.addEventListener('click', function () { spotInfo(spot); });
      layer.items.push(new kakao.maps.CustomOverlay({ map: map, content: wrap, position: pos, xAnchor: 0, yAnchor: 0, zIndex: 2 }));
      bounds.extend(pos); found++;
    }
    function step() { if (++done === list.length && fit && found > 1) map.setBounds(bounds, 40, 40, 40, 40); }
    list.forEach(function (spot) {
      if (spot.box) {
        var b = spot.box;
        // 장소 범위를 옅은 네모로 같이 그림
        layer.items.push(new kakao.maps.Rectangle({ map: map, bounds: new kakao.maps.LatLngBounds(new kakao.maps.LatLng(b.s, b.w), new kakao.maps.LatLng(b.n, b.e)),
          strokeWeight: 1, strokeColor: '#e0461c', strokeOpacity: 0.8, fillColor: '#ff7a59', fillOpacity: 0.15 }));
        put(spot, (b.n + b.s) / 2, (b.w + b.e) / 2); step(); return;
      }
      if (spot.lat && spot.lng) { put(spot, spot.lat, spot.lng); step(); return; }
      geo.addressSearch(spot.addr, function (res, st) {
        if (st === kakao.maps.services.Status.OK) put(spot, +res[0].y, +res[0].x);
        else console.warn('주소로 장소를 못 찾음:', spot.name, spot.addr);
        step();
      });
    });
  }

  /* ── 매장 정보 창: 주소 · 전화 · 영업시간 · 소개, 매장 별 리뷰, 관리자는 수정 · 삭제 ── */
  function spotInfo(spot) {
    var box = msgBox(spot.name, 'heart.png'), close = function () { box.el.remove(); };
    var dl = el('dl', 'kv sinfo');
    [['주소', spot.addr], ['전화', spot.phone], ['영업시간', spot.hours], ['소개', spot.about]].forEach(function (r) {
      if (!r[1]) return;
      dl.appendChild(el('dt', '', r[0])); dl.appendChild(el('dd', '', r[1]));
    });
    dl.appendChild(el('dt', '', '리뷰'));
    var dd = el('dd'), go = el('button', 'xlink', '매장 별 리뷰'); go.type = 'button';
    go.addEventListener('click', function () { close(); reviewQR(spot); });
    dd.appendChild(go); dl.appendChild(dd);
    var btns = [['닫기', close]];

    box.say('', btns); box.put(dl);
  }
  function dropSpot(spot) {
    var box = msgBox('매장 삭제', 'icon-info.png'), close = function () { box.el.remove(); };
    box.say('‘' + spot.name + '’ 매장을 지도에서 지우시겠습니까?', [['삭제', function () {
      Core.sb.from('spots').delete().eq('id', spot.id).then(function (r) {

        Core.toast('매장을 지웠습니다.'); redrawSpots();

    }], ['취소', close]]);
  }
  // 매장 추가 · 수정 (관리자): 위치는 주소로 찾거나 지도에서 누름
  var PINS = [['assets/space/xp/heart.png', '하트'], ['assets/space/xp/pin-bima.png', '비마관'],
              ['assets/space/xp/pin-cord.png', 'CORD Jr.'], ['assets/space/xp/pin-juana.png', '후아나']];
  function editSpot(spot) {
    var cur = spot || {}, box = msgBox(spot ? '매장 정보 수정' : '매장 추가', 'icon-map.png');
    box.el.classList.add('wide');

    var f = el('div', 'sform'), ins = {};

    var lab = el('label', '', '아이콘'); f.appendChild(lab);
    var icon = el('select', 'xsel');
    PINS.concat(cur.icon && !PINS.some(function (p) { return p[0] === cur.icon; }) ? [[cur.icon, '지금 아이콘']] : []).forEach(function (p) {

    // 위치: 범위 가운데 좌표를 보여 주고, 주소로 찾기 · 지도에서 고르기
    var box0 = cur.box ? Object.assign({}, cur.box) : null;

    function showWhere() {
      where.textContent = box0 ? ((box0.n + box0.s) / 2).toFixed(5) + ', ' + ((box0.w + box0.e) / 2).toFixed(5) : '정하지 않음 (주소로 자동)';

    function moveTo(lat, lng) {

    pos.appendChild(button('주소로 찾기', function () {

      new kakao.maps.services.Geocoder().addressSearch(ins.addr.value.trim(), function (res, st) {
        if (st === kakao.maps.services.Status.OK) moveTo(+res[0].y, +res[0].x); else Core.toast('주소를 찾지 못했습니다.');
      });
    }));
    pos.appendChild(button('지도에서 고르기', function () {
      var mapWin = wins.filter(function (o) { return o.def.id === 'map'; })[0], map = maps[0];
      if (!map) { Core.toast('지도를 먼저 열어 주십시오.'); return; }
      openWin(mapWin); bringFront(mapWin);
      box.el.classList.add('picking'); Core.toast('지도에서 매장 자리를 누르십시오.');
      function pick(e) {
        kakao.maps.event.removeListener(map, 'click', pick);
        moveTo(e.latLng.getLat(), e.latLng.getLng());
        box.el.classList.remove('picking');
      }
      kakao.maps.event.addListener(map, 'click', pick);
    }));
    f.appendChild(pos);
    showWhere();
    box.say('', [['저장', save], ['취소', close]]); box.put(f);
    ins.name.focus();

    function save() {
      var name = ins.name.value.trim();
      if (!name) { Core.toast('이름을 넣어 주십시오.'); return; }
      var row = {
        id: cur.id || ('s' + Date.now().toString(36)),
        name: name, addr: ins.addr.value.trim(), phone: ins.phone.value.trim(), hours: ins.hours.value.trim(), about: ins.about.value.trim(),
        alias: ins.alias.value.split(',').map(function (x) { return x.trim(); }).filter(Boolean), biz: ins.biz.value.replace(/\D/g, ''),
        icon: icon.value, box: box0,
        sort: cur.sort || (window.SPOTS || []).reduce(function (m, o) { return Math.max(m, o.sort || 0); }, 0) + 1,
        updated_at: new Date().toISOString()
      };
      Core.sb.from('spots').upsert(row).then(function (r) {
        if (r.error) { Core.toast(errText(r.error)); return; }

  // 매장 별 리뷰: 리뷰 관리 창을 열고 맨 위에 그 매장 QR

    r.appendChild(button('주소 복사', function () { copyText(url).then(function (ok) { Core.toast(ok ? '주소를 복사했습니다.' : '복사하지 못했습니다.'); }); }));

  /* ── 그림 지도 ── */

  /* ── 내 위치: 위치 권한을 물어보고, 지금 있는 곳에 별을 붙여 따라다니게 함 ── */
  function watchMe(map, body) {
    var wrap = document.createElement('div'); wrap.className = 'me';
    var star = document.createElement('img'); star.className = 'star'; star.src = "assets/space/xp/star.png"; star.alt = '내 위치';
    star.draggable = false; wrap.appendChild(star);
    var over = new kakao.maps.CustomOverlay({ content: wrap, xAnchor: 0, yAnchor: 0, zIndex: 3 });
    var here = null, timer = null;
    // 별을 누르면 '내 위치' 말풍선
    star.addEventListener('click', function () {
      var old = wrap.querySelector('.pbubble'); if (old) old.remove();
      clearTimeout(timer);
      var bubble = document.createElement('div'); bubble.className = 'pbubble'; bubble.textContent = '내 위치';
      wrap.appendChild(bubble);
      timer = setTimeout(function () { bubble.remove(); }, 2200);
    });
    // 지도 왼쪽 위 버튼: 누르면 내 위치로 이동
    var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'xbtn mebtn'; btn.textContent = '내 위치';
    btn.addEventListener('click', function () {
      if (here) map.panTo(here);
      else if (window.Core) Core.toast('아직 위치를 찾는 중입니다');
    });
    body.appendChild(btn);
    if (!navigator.geolocation) { if (window.Core) Core.toast('이 기기에서는 위치를 알 수 없습니다'); return; }
    var first = true, warned = false;
    navigator.geolocation.watchPosition(function (p) {
      here = new kakao.maps.LatLng(p.coords.latitude, p.coords.longitude);
      over.setPosition(here);
      if (first) { first = false; over.setMap(map); }
    }, function (err) {
      if (!window.Core || warned) return;
      warned = true;   // 안내는 한 번만
      Core.toast(err.code === 1 ? '위치 권한이 꺼져 있습니다 (브라우저 설정에서 켜 주십시오)' : '현재 위치를 찾지 못했습니다');
    }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
  }

  function buildReceipt(entry) {
    var body = entry.body;

      if (entry.qrSpot) panel.appendChild(spotQR(entry));   // 지도의 '매장 별 리뷰'로 열었을 때
      var st = window.Core ? Core.state : {};
      if (!window.Core || !Core.ready) { panel.appendChild(el('p', 'empty', '서버 설정 전이라 쓸 수 없습니다.')); return; }
      if (!st.user) {
        panel.appendChild(el('p', 'empty', '카카오로 로그인하면 쓸 수 있습니다.'));
        panel.appendChild(button('카카오로 로그인', function () { Core.login(); }));
        return;
      }
      var g = group('영수증 인증');
      g.appendChild(el('p', 'note', '결제 후 ' + Receipt.MINS + '분 안에 영수증을 밝은 곳에서 평평하게 펴고 화면에 꽉 차게 찍어 주십시오. ' +
        '같은 영수증을 함께 온 사람도 찍으면 동행으로 인증됩니다. 글자는 이 기기 안에서 읽고, 사진은 서버에 올리지 않습니다.'));
      var row = el('div', 'prow');
      var shot = button(now && !now.busy ? '다시 찍기' : '영수증 찍기', function () { pick.value = ''; pick.click(); });
      shot.disabled = !!(now && now.busy);
      row.appendChild(shot); g.appendChild(row);
      if (now) g.appendChild(result());
      panel.appendChild(g);
      var h = group('내 인증 기록'); panel.appendChild(h); drawMine(h);
    }

    // 읽는 중이면 진행 막대, 다 읽었으면 네 가지 확인 결과와 인증 단추
    function result() {
      var out = el('div', 'rout');
      if (now.busy) {
        var bar = el('div', 'xprog'), fill = el('i'), txt = el('p', 'note', '준비하는 중…');
        bar.appendChild(fill); out.appendChild(bar); out.appendChild(txt);
        prog = { fill: fill, txt: txt };
        return out;
      }
      if (now.err) { out.appendChild(el('p', 'empty', now.err)); return out; }
      var kv = el('dl', 'kv');
      now.v.checks.forEach(function (c) {
        kv.appendChild(el('dt', '', NAMES[c.key]));
        var dd = el('dd'); dd.appendChild(el('span', 'chk ' + (c.ok ? 'ok' : 'no'), (c.ok ? '✔ ' : '✖ ') + c.text)); kv.appendChild(dd);
      });
      out.appendChild(kv);
      if (now.saved) out.appendChild(el('p', 'rdone', now.saved.lead ? '인증되었습니다.' : '동행으로 인증되었습니다.' + partyText(now.saved)));
      else if (now.v.ok) {
        var r = el('div', 'prow'), go = button('인증하기', function () {
          go.disabled = true;
          Receipt.submit(now.info).then(function (res) {
            if (res.error) { go.disabled = false; Core.toast(errText(res.error)); return; }
            now.saved = res.data || { lead: true };
            Core.log('receipt_ok', { spot: now.info.spot ? now.info.spot.id : now.info.shop, with: !now.saved.lead });
            draw();
          });
        });
        r.appendChild(go); out.appendChild(r);
      } else out.appendChild(el('p', 'note', '✖ 칸이 있으면 흔들리지 않게, 글자가 잘 보이도록 다시 찍어 주십시오.'));
      // 무엇을 읽었는지 직접 볼 수 있게
      var det = el('details', 'rtext'); det.appendChild(el('summary', '', '읽은 글 보기')); det.appendChild(el('pre', '', now.text || '(읽은 글 없음)'));
      out.appendChild(det);
      return out;
    }

    pick.addEventListener('change', function () {
      var f = pick.files && pick.files[0];
      if (!f) return;
      now = { busy: true }; draw();
      Receipt.read(f, function (p, msg) {
        if (!prog) return;
        prog.fill.style.width = Math.round(p * 100) + '%'; prog.txt.textContent = msg;
      }).then(function (r) {
        now = { text: r.text, info: r.info, v: Receipt.judge(r.info, Core.can('tester')) }; draw();
      }, function () {
        now = { err: '영수증을 읽지 못했습니다. 인터넷 연결을 확인하고 다시 해 주십시오.' }; draw();
      });
    });

    // 같은 영수증으로 인증한 사람 수 (혼자면 빈칸)
    function partyText(p) { return p.party > 1 ? ' (일행 ' + p.party + '명)' : ''; }

    // 내 인증 기록: 최근 20개
    function drawMine(g) {
      var wait = el('p', 'empty', '불러오는 중…'); g.appendChild(wait);
      Receipt.mine().then(function (r) {
        wait.remove();
        if (r.error) { g.appendChild(el('p', 'empty', errText(r.error))); return; }
        if (!r.data.length) { g.appendChild(el('p', 'empty', '아직 인증한 영수증이 없습니다.')); return; }
        r.data.forEach(function (it) {
          var sp = (window.SPOTS || []).filter(function (o) { return o.id === it.spot; })[0];
          var line = el('div', 'role'), t = el('span', 'rtxt');
          t.appendChild(el('b', '', sp ? sp.name : it.shop || '이름 없는 가게'));
          var fmt = { timeZone: 'Asia/Seoul', dateStyle: 'medium' }; if (it.timed) fmt.timeStyle = 'short';
          t.appendChild(el('span', '', new Date(it.paid_at).toLocaleString('ko-KR', fmt)));
          if (it.amount) t.appendChild(el('span', '', it.amount.toLocaleString('ko-KR') + '원'));
          if (!it.lead) t.appendChild(el('span', 'badge', '동행'));
          if (it.party > 1) t.appendChild(el('span', '', partyText(it).trim()));
          line.appendChild(t); g.appendChild(line);
        });
      });
    }

    if (window.Core) Core.onChange(function () { if (isOpen(entry) && !(now && now.busy)) draw(); });
    entry.redraw = function () { if (!(now && now.busy)) draw(); };
    draw();
  }

  // 카카오 칸: 아이디, 로그아웃, 계정 변경, 맨 아래 계정 삭제
  function drawKakao(panel, st) {
    var g = group('카카오 계정');
    if (!st.user) {
      g.appendChild(el('p', 'empty', '로그인하지 않았습니다.'));
      var r0 = el('div', 'prow'); r0.appendChild(button('카카오로 로그인', function () { Core.login(); })); g.appendChild(r0);
      panel.appendChild(g); return;
    }
    var p = st.profile || {}, me = kakaoInfo(st);
    var top = el('div', 'kakao-who');
    var pic = el('img', 'kpic'); pic.alt = ''; pic.src = p.photo || p.avatar_url || 'assets/space/xp/icon-account.png';
    var kv = el('dl', 'kv');
    function line(k, v) { kv.appendChild(el('dt', '', k)); var d = el('dd', '', v); kv.appendChild(d); return d; }
    line('닉네임', p.nickname || '카카오 사용자');
    line('카카오 이메일', me.email);   // 이메일 제공에 동의한 사람만, 아니면 빈칸
    // 고유 번호: 카카오가 정한 숫자, 눌러서 복사
    var idd = line('고유 번호', me.id || '-');
    if (me.id) {
      var cp = el('button', 'xbtn mini', '복사'); cp.type = 'button';
      cp.addEventListener('click', function () { copyText(me.id).then(function (ok) { Core.toast(ok ? '고유 번호를 복사했습니다.' : '복사하지 못했습니다.'); }); });
      idd.appendChild(cp);
    }
    line('가입한 날', p.created_at ? new Date(p.created_at).toLocaleDateString('ko-KR') : '-');
    top.appendChild(pic); top.appendChild(kv); g.appendChild(top);
    var row = el('div', 'prow');
    row.appendChild(button('로그아웃', function () { Core.logout(); }));
    row.appendChild(button('계정 변경', function () { Core.login(true); }));   // 카카오 로그인 화면을 다시 띄움
    g.appendChild(row);
    panel.appendChild(g);

    // 프로필 사진: 물고기 아바타와 따로, 친구 목록에 보임 (없으면 카카오 사진)
    var ph = group('프로필 사진'), prow = el('div', 'phrow'), ppic = el('img', 'phpic'), pside = el('div');
    ppic.alt = ''; ppic.src = p.photo || p.avatar_url || 'assets/space/xp/icon-account.png';
    prow.appendChild(ppic); prow.appendChild(pside); ph.appendChild(prow);
    pside.appendChild(el('p', 'note', '친구에게 보이는 사진입니다. 고르지 않으면 카카오 프로필 사진이 보입니다.'));
    var pf = el('input'); pf.type = 'file'; pf.accept = 'image/*'; pf.hidden = true; ph.appendChild(pf);
    var pr = el('div', 'prow');
    pr.appendChild(button('사진 고르기', function () { pf.value = ''; pf.click(); }));
    var pclr = button('카카오 사진으로', function () { savePhoto(null); });
    pclr.disabled = !p.photo; pr.appendChild(pclr);
    pside.appendChild(pr);
    pf.addEventListener('change', function () {
      var file = pf.files && pf.files[0]; if (!file) return;
      squarePhoto(file, 128).then(savePhoto, function () { Core.toast('사진을 읽지 못했습니다.'); });
    });
    function savePhoto(v) {
      Core.sb.from('profiles').update({ photo: v }).eq('id', st.user.id).then(function (r) {
        if (r.error) { Core.toast(errText(r.error)); return; }
        Core.toast(v ? '프로필 사진을 바꿨습니다.' : '카카오 사진으로 바꿨습니다.'); Core.reload();
      });
    }
    panel.appendChild(ph);

    // 관리자 문의: 카카오톡 채널 추가 · 1:1 채팅 (머리말을 복사해 두고 채팅으로 이동)
    var q = group('관리자 문의');
    q.appendChild(el('p', 'note', '카카오톡 채널로 관리자에게 물어볼 수 있습니다. ‘1:1 문의하기’를 누르면 내 고유 번호가 담긴 머리말이 복사됩니다. 채팅창에 붙여 넣고 내용을 써 주십시오.'));
    var qr = el('div', 'prow');
    qr.appendChild(button('채널 추가', function () { window.open(CHANNEL + '/friend', '_blank', 'noopener'); }));
    qr.appendChild(button('1:1 문의하기', function () { askAdmin(st); }));
    q.appendChild(qr);
    panel.appendChild(q);

    var d = group('계정 삭제'); d.classList.add('danger');
    d.appendChild(el('p', 'note', '계정과 활동 기록, 아바타, 소속이 모두 지워지고 되돌릴 수 없습니다.'));
    var armed = false, t = null;
    var del = button('계정 삭제…', function () {
      if (!armed) { armed = true; del.textContent = '정말 삭제하시겠습니까? 한 번 더 누르기'; t = setTimeout(function () { armed = false; del.textContent = '계정 삭제…'; }, 4000); return; }
      clearTimeout(t); del.disabled = true;
      Core.sb.rpc('delete_my_account').then(function (r) {
        if (r.error) { del.disabled = false; armed = false; del.textContent = '계정 삭제…'; Core.toast(errText(r.error)); return; }
        Core.sb.auth.signOut(); Core.toast('계정을 삭제했습니다.');
      });
    });
    var r2 = el('div', 'prow'); r2.appendChild(del); d.appendChild(r2);
    panel.appendChild(d);
  }

  // 사진을 가운데 정사각형으로 잘라 작게 줄임 (서버에 글자로 저장)
  function squarePhoto(file, size) {
    return new Promise(function (ok, no) {
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function () {
        var s = Math.min(im.naturalWidth, im.naturalHeight), cv = document.createElement('canvas');
        cv.width = cv.height = size;
        var c = cv.getContext('2d'); c.imageSmoothingQuality = 'high';
        c.drawImage(im, (im.naturalWidth - s) / 2, (im.naturalHeight - s) / 2, s, s, 0, 0, size, size);
        URL.revokeObjectURL(url); ok(cv.toDataURL('image/jpeg', 0.85));
      };
      im.onerror = function () { URL.revokeObjectURL(url); no(); };
      im.src = url;
    });
  }

  // 카카오 정보: 고유 번호(숫자)와, 동의한 경우의 이메일
  function kakaoInfo(st) {
    var u = st.user || {}, md = u.user_metadata || {}, p = st.profile || {};
    return { id: String(p.provider_id || md.provider_id || md.sub || ''), email: u.email || md.email || '' };
  }
  // 글을 클립보드에 복사 (안 되는 브라우저는 예전 방식으로)
  function copyText(t) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t).then(function () { return true; }, fallback);
    return Promise.resolve(fallback());
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove(); return ok;
    }
  }
  // 관리자 문의 머리말: 고유 번호 + (있으면) 권한, 신분, 활동
  var CHANNEL = 'https://pf.kakao.com/_RaxcaX';
  function askHeader(st) {
    var me = kakaoInfo(st), roles = (st.profile && st.profile.roles) || [], out = ['[관리자 문의]', '고유 번호: ' + (me.id || '-')];
    var perms = [];
    if (Core.isAdmin()) perms.push('관리자');
    roles.forEach(function (r) { if (r.kind === 'owner' || r.kind === 'tester') perms.push(r.label); });
    if (perms.length) out.push('권한: ' + perms.join(', '));
    var id = roles.filter(function (r) { return KIND[r.kind]; })[0];
    if (id) out.push('신분: ' + KIND[id.kind] + ' · ' + id.label + (id.dept ? ' ' + id.dept : ''));
    var acts = roles.filter(function (r) { return r.kind === 'activity'; }).map(function (r) { return r.label; });
    if (acts.length) out.push('활동: ' + acts.join(', '));
    out.push('──────────', '문의 내용: ');
    return out.join('\n');
  }
  function askAdmin(st) {
    var text = askHeader(st);
    copyText(text).then(function (ok) {
      var box = msgBox('관리자 문의', 'icon-info.png');
      box.say((ok ? '아래 머리말을 복사했습니다. 카카오톡 채팅창에 붙여 넣고 문의 내용을 써 주십시오.'
                  : '복사하지 못했습니다. 아래 내용을 길게 눌러 복사한 뒤 채팅창에 붙여 넣어 주십시오.') + '\n\n' + text,
        [['카카오톡으로 이동', function () { window.open(CHANNEL + '/chat', '_blank', 'noopener'); box.el.remove(); }],
         ['닫기', function () { box.el.remove(); }]]);
    });
  }

  // 아바타 칸: 왼쪽에 물고기 그림, 오른쪽에 닉네임 · 어종 · 이펙트 · 아이템
  function drawAvatar(panel, st) {
    panel.appendChild(el('p', 'empty', '물고기를 불러오는 중…'));
    ensureKit().then(function (k) {
      if (!panel.isConnected) return;
      panel.innerHTML = '';
      var kit = k.kit, data = k.data, p = st.profile || {};
      // 고를 수 있는 물고기: 이름 붙은 색 변형은 따로 (기본은 주황 금붕어)
      var opts = [];
      data.species.forEach(function (m) {
        var named = (m.variants || []).filter(function (v) { return v && v.name; });
        if (named.length > 1) named.forEach(function (v) { opts.push({ m: m, vi: m.variants.indexOf(v), name: m.name + ' · ' + v.name }); });
        else opts.push({ m: m, vi: 0, name: m.name });
      });
      if (!opts.length) { panel.appendChild(el('p', 'empty', '아바타로 고를 물고기가 아직 없습니다.')); return; }   // 도트 물고기가 없을 때
      var gold = opts.filter(function (o) { return o.m.id === 'goldfish' && /주황/.test(o.name); })[0] || opts[0];
      var av = Object.assign({ species: gold.m.id, variant: gold.vi, effect: '', items: [] }, p.avatar || {});
      function pick() { return opts.filter(function (o) { return o.m.id === av.species && o.vi === av.variant; })[0] || gold; }
      // 색 변형은 자기 색표를 덮어써서 그림
      function sprite(o, px) {
        var v = o.m.variants && o.m.variants[o.vi], m = o.m;
        if (v && v.palette) m = Object.assign({}, m, { palette: Object.assign({}, m.palette, v.palette) });
        return kit.thumb(m, px, v);
      }

      var box = el('div', 'avbox');
      var prev = el('div', 'avprev'), cap = el('div', 'avcap');
      var right = el('div', 'avform');
      box.appendChild(el('div', 'avleft')); box.firstChild.appendChild(prev); box.firstChild.appendChild(cap);
      box.appendChild(right);
      // 어종 목록용: 모든 물고기를 같은 크기 칸(28×14)에 꽉 차게 키워 그림 (도트는 그대로)
      function fitSprite(src) {
        var cv = el('canvas', 'spr'); cv.width = 56; cv.height = 28;
        var c = cv.getContext('2d'), k = Math.min(56 / src.width, 28 / src.height);
        var w = src.width * k, h = src.height * k;
        c.imageSmoothingEnabled = false;
        c.drawImage(src, (56 - w) / 2, (28 - h) / 2, w, h);
        return cv;
      }
      // 미리보기: 작은 3D 화면에서 제자리를 돌며 헤엄침 (이펙트 · 아이템도 같이 보임)
      var view = makePreview(prev, kit, data);
      function drawPrev() { var o = pick(); view.show(o, av); cap.textContent = o.name; }

      // 닉네임
      var nick = el('label', 'flab', '닉네임'); right.appendChild(nick);
      var nrow = el('div', 'nrow');
      var nin = el('input', 'gin'); nin.type = 'text'; nin.maxLength = 20; nin.value = p.nickname || '';
      nrow.appendChild(nin);
      nrow.appendChild(button('변경', function () {
        var v = nin.value.trim(); if (!v) return;
        Core.sb.from('profiles').update({ nickname: v }).eq('id', st.user.id).then(function (r) {
          if (r.error) { Core.toast(errText(r.error)); return; }
          Core.toast('닉네임을 바꿨습니다.'); Core.reload();
        });
      }));
      right.appendChild(nrow);

      // 어종: 작은 도트 그림 + 이름 목록
      right.appendChild(el('label', 'flab', '어종'));
      var list = el('div', 'xlist'); list.setAttribute('role', 'listbox');
      opts.forEach(function (o) {
        var row = el('div', 'opt'); row.setAttribute('role', 'option');
        row.appendChild(fitSprite(sprite(o, 1)));
        row.appendChild(el('span', '', o.name));
        row.addEventListener('click', function () {
          av.species = o.m.id; av.variant = o.vi;
          list.querySelectorAll('.opt').forEach(function (r) { r.classList.toggle('on', r === row); });
          drawPrev(); save();
        });
        if (o === pick()) row.classList.add('on');
        list.appendChild(row);
      });
      right.appendChild(list);

      // 이펙트
      right.appendChild(el('label', 'flab', '이펙트'));
      var sel = el('select', 'xsel');
      [{ id: '', name: '없음' }].concat(data.effects || []).forEach(function (e) {
        var o = el('option', '', e.name || e.id); o.value = e.id; if (e.id === av.effect) o.selected = true; sel.appendChild(o);
      });
      sel.addEventListener('change', function () { av.effect = sel.value; drawPrev(); save(); });
      right.appendChild(sel);

      // 아이템 (이펙트처럼 하나 고르기)
      right.appendChild(el('label', 'flab', '아이템'));
      var isel = el('select', 'xsel');
      [{ id: '', label: '없음', sub: '' }].concat(window.ReefItems ? ReefItems.list() : []).forEach(function (it) {
        var o = el('option', '', it.label + (it.sub ? ' · ' + it.sub : '')); o.value = it.id;
        if (it.id && av.items.indexOf(it.id) >= 0) o.selected = true;
        isel.appendChild(o);
      });
      isel.addEventListener('change', function () { av.items = isel.value ? [isel.value] : []; drawPrev(); save(); });
      right.appendChild(isel);
      var stat = el('p', 'note avstat', ''); right.appendChild(stat);

      // 바꾸면 잠시 뒤 서버에 저장
      var timer = null;
      function save() {
        clearTimeout(timer); stat.textContent = '저장 중…';
        timer = setTimeout(function () {
          Core.sb.from('profiles').update({ avatar: av }).eq('id', st.user.id).then(function (r) {
            stat.textContent = r.error ? errText(r.error) : '저장되었습니다.';
            if (!r.error && st.profile) st.profile.avatar = JSON.parse(JSON.stringify(av));
          });

  function makePreview(box, kit, data) {
    var W = 110, H = 108;
    var r = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); r.outputEncoding = THREE.sRGBEncoding;
    r.setSize(W, H, false); r.domElement.className = 'av3d'; box.appendChild(r.domElement);
    var scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(35, W / H, 0.1, 400);
    kit.lights(scene);
    var fish = null, lane = null, ctx = { scene: scene, data: data, srgb: true }, t0 = performance.now(), alive = true;
    function show(o, av) {
      if (fish) { if (window.ReefItems) ReefItems.clear(); scene.remove(fish); kit.dispose(fish); }
      var v = o.m.variants && o.m.variants[o.vi];
      var fx = (av.effect ? [av.effect] : []).concat(o.m.effects || [])
        .map(function (id) { return kit.effect(data, id); }).filter(Boolean);
      fish = kit.build(o.m, { variant: v, effects: fx, phase: 0, scale: 1 });
      scene.add(fish);
      // 물고기 크기에 맞춰 작은 고리를 돌게 하고, 옆에서 보이게 카메라를 놓음
      var sz = new THREE.Box3().setFromObject(fish).getSize(new THREE.Vector3()), L = Math.max(sz.x, sz.y, sz.z, 0.5);
      lane = { path: 'loop', cx: 0, cy: 0, cz: 0, rx: L * 0.3, ry: L * 0.06, rz: L * 0.2, sp: 0.6, ph: 0 };
      fish.userData.lane = lane;
      cam.position.set(0, L * 0.3, L * 2.3); cam.lookAt(0, 0, 0);
      (av.items || []).forEach(function (id) { if (window.ReefItems) ReefItems.apply(fish, id, ctx); });
    }
    function frame() {
      if (!alive) return;
      if (!box.isConnected) { alive = false; if (window.ReefItems) ReefItems.clear(); r.dispose(); return; }
      requestAnimationFrame(frame);
      var t = (performance.now() - t0) / 1000;
      if (fish) { kit.tick(t, {}); kit.steer(fish, lane, t); kit.animate(fish, t, {}); }
      if (window.ReefItems) ReefItems.tick(t);

    return { show: show };

  /* ── XP 스크롤 막대: 목록 옆에 붙어서 위 · 아래 단추, 끌 수 있는 손잡이, 빈 곳 누르면 한 쪽씩 이동 ── */
  function xpScroll(view, bar) {
    var track = bar.querySelector('.xs-track'), thumb = bar.querySelector('.xs-thumb');
    function sync() {
      var h = view.clientHeight, all = view.scrollHeight, th = track.clientHeight;
      bar.classList.toggle('off', all <= h + 1);
      var size = Math.max(12, th * h / Math.max(all, 1));
      thumb.style.height = size + 'px';
      thumb.style.top = ((th - size) * view.scrollTop / Math.max(1, all - h)) + 'px';
    }
    function step(d) { view.scrollTop += d; }
    function hold(el, d) {
      var t = null;
      el.addEventListener('pointerdown', function (e) {
        e.preventDefault(); step(d);
        t = setInterval(function () { step(d); }, 80);
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (n) { el.addEventListener(n, function () { clearInterval(t); }); });
    }
    hold(bar.querySelector('.xs-up'), -18);
    hold(bar.querySelector('.xs-dn'), 18);
    track.addEventListener('pointerdown', function (e) {
      if (e.target !== track) return;
      step((e.offsetY < thumb.offsetTop ? -1 : 1) * view.clientHeight * 0.9);
    });
    var drag = null;
    thumb.addEventListener('pointerdown', function (e) {
      e.preventDefault(); drag = { y: e.clientY, top: view.scrollTop };
      try { thumb.setPointerCapture(e.pointerId); } catch (er) {}
    });
    thumb.addEventListener('pointermove', function (e) {
      if (!drag) return;

      view.scrollTop = drag.top + (e.clientY - drag.y) * (view.scrollHeight - view.clientHeight) / Math.max(1, room);
    });
    ['pointerup', 'pointercancel'].forEach(function (n) { thumb.addEventListener(n, function () { drag = null; }); });
    view.addEventListener('scroll', sync);
    if (window.ResizeObserver) new ResizeObserver(sync).observe(view);
    return { sync: sync };
  }

  function checkSpot(spot) {

    function run() {

        var far = Math.round(spotDistance(spot, lat, lng));
        var note = acc > 30 ? '\n(지금 위치 오차가 ±' + acc + 'm라 정확하지 않을 수 있습니다. 창가나 밖에서 다시 해 보십시오)' : '';
        box.say('아직 ' + spot.name + '에 도착하지 않았습니다. 약 ' + far + 'm 떨어져 있습니다.' + note, [['다시 확인', run], ['닫기', close]]);
        if (window.Core) Core.log('spot_far', { spot: spot.id, far: far, acc: acc });
      }, function (err) {
        box.say(err.code === 1 ? '위치 권한이 꺼져 있습니다. 브라우저 설정에서 위치를 허용한 뒤 다시 해 주십시오.' : '위치를 찾지 못했습니다.',
          [['다시 확인', run], ['닫기', close]]);
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
    }
    run();
  }
})();

</script>
