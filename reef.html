<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>월계 아쿠아</title>
<link rel="stylesheet" href="assets/fonts/dossaemmul.css">
<link rel="stylesheet" href="css/wall.css">
</head>
<body>
<div id="app">
  <div class="win">
    <!-- 제목줄: 비스타 유리 창 -->
    <div class="cap">
      <img class="ico" src="assets/space/aero/icon-fish.png" alt="">
      <span class="attl">월계 아쿠아</span>
      <span class="cbtns" aria-hidden="true"><i class="cmin"></i><i class="cmax"></i><i class="cx"></i></span>
    </div>
    <!-- 주소 줄과 작은 단추들 -->
    <div class="cmd">
      <span class="crumb">« 어항</span>
      <nav class="links">
        <button id="bAdmin" class="vbtn hidden" type="button">관리자 모드</button>
        <button id="bLogin" class="vbtn" type="button">카카오 로그인</button>
        <a class="vbtn" href="index.html">처음 화면</a>
        <a class="vbtn" href="xp_web.html">월계 공간</a>
      </nav>
    </div>

    <div class="client">
      <!-- 어항: 리뷰마다 물고기 한 마리 (2분 안에 같이 남기면 한 무리), 낚시 · 비마관은 그 장소 물고기 -->
      <main id="tank">
        <img class="bgfx" src="assets/reef/water-tank.webp" alt="">
        <video id="cam" playsinline muted autoplay></video>
        <canvas id="gl"></canvas>
        <!-- AR 단추: 장소 안(또는 관리자 모드)에서만 보임 -->
        <div class="arbar"><button id="bARc" class="vbtn hidden" type="button">가운데로</button><button id="bAR" class="vbtn hidden" type="button">AR 켜기</button></div>
        <p id="empty" class="hidden">아직 물고기가 없어요. 첫 리뷰를 남겨 보세요!</p>
      </main>

      <!-- 아래쪽: 남기기 / 보기 -->
      <section id="sheet">
        <div class="tabs">
          <button id="tWrite" class="on" type="button">남기기</button>
          <button id="tList" type="button">리뷰 보기 <b id="cnt"></b></button>
        </div>
        <div class="pane">
          <div id="pWrite">
            <div id="gstat"></div>
            <!-- 낚시 · 비마관 안내판 -->
            <div id="panel"></div>
            <div id="form" class="hidden">
              <p class="mi">물고기를 고르고 한 줄 평을 남겨 주세요</p>
              <fieldset class="grp"><legend>물고기</legend><div id="picks" class="lv"></div></fieldset>
              <fieldset class="grp"><legend>아이템 (선택)</legend><div id="items" class="radios"></div></fieldset>
              <div class="frow"><label for="nick">닉네임 (선택):</label><input id="nick" class="tb" type="text" maxlength="12" autocomplete="off" placeholder="비워도 돼요"></div>
              <div class="frow"><label for="body">한 줄 평:</label><input id="body" class="tb" type="text" maxlength="60" autocomplete="off" placeholder="단어나 이모지도 좋아요 😊"></div>
              <div class="foot"><button id="send" class="vbtn def" type="button">물고기 풀어주기</button></div>
            </div>
          </div>
          <div id="pList" class="hidden"><div id="list"></div></div>
        </div>
      </section>
    </div>
  </div>
</div>
<input id="rcpt" type="file" accept="image/*" hidden>
<div id="toast"></div>
<!-- 비스타 대화 상자 (로그인 안내 등) -->
<div id="dlg" class="vdlg hidden" role="dialog" aria-modal="true">
  <div class="dwin"><div class="dcap"><span class="dttl"></span></div><div class="dbody"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/spots.js"></script>
<script src="js/receipt.js"></script>
<script src="reef-kit.js"></script>
<script src="reef-model.js"></script>
<script src="js/wall.js"></script>
</body>
</html>
