<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reef Marker Test</title>
<style>
  :root{ color-scheme:dark; --ink:#F2EEF9; --dim:#B3A9CC; --accent:#7FC4FF; --bad:#FF8FA3; --good:#7FE8B0; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#0B0916;color:var(--ink);
    font-family:ui-rounded,"Quicksand","Segoe UI",system-ui,sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0;overflow:hidden;background:#0B0916}
  #cam,#simView{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  /* 나의 공간 창 안(#preview-space): 하늘색 배경 + 물속 움짤 */
  #stage.space{background:#1EB6F0}
  .bgfx{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5;pointer-events:none}
  #gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  #hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;
    display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;z-index:5}
  .chip{font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.05em;
    background:rgba(16,12,30,.55);border:1px solid rgba(220,212,255,.18);border-radius:8px;
    padding:6px 9px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--dim)}
  .chip.on{border-color:rgba(127,232,176,.6);color:#CFFFE3}
  .chip.off{border-color:rgba(255,143,163,.5);color:#FFD9DF}
  #bottom{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));
    display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:0 12px;pointer-events:none;z-index:5}
  #bottom button{pointer-events:auto;appearance:none;border:1px solid rgba(220,212,255,.24);
    background:rgba(16,12,30,.55);color:var(--dim);border-radius:999px;padding:8px 13px;
    font:inherit;font-size:11.5px;letter-spacing:.04em;backdrop-filter:blur(8px);cursor:pointer}
  #bottom button.on{border-color:rgba(127,232,176,.6);color:#CFFFE3}
  #gate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:16px;padding:28px;text-align:center;z-index:8;
    background:radial-gradient(120% 90% at 50% 20%,#241C40 0%,#0B0916 70%)}
  #gate h1{margin:0;font-size:22px;font-weight:700}
  #gate p{margin:0;max-width:34ch;color:var(--dim);font-size:13.5px;line-height:1.55}
  #go{appearance:none;border:0;border-radius:999px;padding:15px 30px;font:inherit;font-weight:700;
    font-size:16px;background:var(--accent);color:#0C1622;cursor:pointer;box-shadow:0 10px 30px -12px rgba(127,196,255,.7)}
  #go:focus-visible,#bottom button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .fine{font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.04em;color:#6F6690}
  .hidden{display:none!important}
</style>
<link rel="stylesheet" href="css/xp-font.css">
</head>
<body data-reef="marker">
<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="gl"></canvas>
  <div id="hud" class="hidden">
    <div class="chip" id="cCube">CUBE 찾는 중</div>
    <div class="chip" id="cDist">— cm</div>
    <div class="chip" id="cAngle">좌우 — · 상하 —</div>
    <div class="chip" id="cFit">FIT —</div>
    <div class="chip hidden" id="cSim">SIM</div>
  </div>
  <div id="bottom" class="hidden">
    <button id="reset" type="button">다시 찾기</button>
    <button id="ghost" type="button" class="on">큐브 보기</button>
    <button id="cal" type="button">지금 1m로 맞추기</button>
    <button id="calClear" type="button">보정 지우기</button>
  </div>
  <div id="gate">
    <h1>Reef · Marker Test</h1>
    <p id="gatemsg">벽에 붙인 4cm 형광 큐브를 찾아서, 폰이 큐브를 얼마나 떨어져서 어느 각도로 보는지 계산하고 그 앞에 물고기 떼를 띄워요. 자이로 없이 카메라 화면만 써요.</p>
    <button id="go" type="button">카메라 시작</button>
    <p class="fine" id="gatefine">카메라 권한이 필요해요 · 물고기를 누르면 말해요 · 주소 끝 #sim = 가짜 카메라 시험</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="reef-kit.js"></script>
<script>
/* ══ 큐브 마커 찾기 ══
   벽에 붙인 4cm 큐브를 카메라 화면에서 찾아서, 폰이 큐브를 얼마나 떨어져서 어느 각도로 보는지 계산함.
   - 큐브: 앞=주황 삼각형, 왼쪽=분홍 삼각형, 오른쪽=파랑 삼각형, 나머지는 초록, 뒤는 벽
   - 방법: 코드 안에 큐브를 직접 그려보고, 카메라 화면이랑 제일 똑같이 겹치는 위치·각도를 찾음
   - 색 구분은 Liu 외(2013) 논문의 L1L2L3 + rgb 두 가지 방식을 같이 씀 (밝기가 바뀌어도 색이 잘 안 바뀌고, 반대색끼리도 헷갈리지 않게)
   큐브 기준 좌표: 큐브 가운데가 0, x=오른쪽, y=위, z=벽에서 방 쪽 (단위 cm) */
function CubeTracker(opt) {
  "use strict";
  opt = opt || {};
  var A = opt.cubeCm || 4, H = A / 2;
  var GRID = 48, GRID_S = 20;           // 맞춰볼 때 쓰는 칸 수 (정밀 / 대충)
  var COARSE_LONG = 640;                // 화면 전체를 훑을 때 긴 쪽 크기
  var W = [0, 1.0, 1.6, 2.2, 2.2];      // 색마다 중요도: 작은 삼각형일수록 크게
  var MIX_GAP = 0.4;                    // 두 색이 만나는 선은 카메라에서 섞여서 어느 색도 아니게 보임: 양쪽으로 이만큼(픽셀) 비워서 그림

  /* ── 큐브 모양 ── 면마다 네 꼭짓점, 붙은 삼각형, 삼각형 색 (1초록 2주황 3분홍 4파랑) */
  var FACES = [
    { n: [0, 0, 1], q: [[-H, -H, H], [H, -H, H], [H, H, H], [-H, H, H]], tri: [[H, H, H], [H, -H, H], [0, 0, H]], tc: 2 },
    { n: [1, 0, 0], q: [[H, -H, H], [H, -H, -H], [H, H, -H], [H, H, H]], tri: [[H, 0, H], [H, -H, H], [H, -H, 0]], tc: 4 },
    { n: [-1, 0, 0], q: [[-H, -H, -H], [-H, -H, H], [-H, H, H], [-H, H, -H]], tri: [[-H, H, 0], [-H, H, H], [-H, 0, H]], tc: 3 },
    { n: [0, -1, 0], q: [[-H, -H, -H], [H, -H, -H], [H, -H, H], [-H, -H, H]], tri: null, tc: 0 },
    { n: [0, 1, 0], q: [[-H, H, -H], [-H, H, H], [H, H, H], [H, H, -H]], tri: null, tc: 0 }
  ];
  FACES.forEach(function (F) {
    F.c = [0, 0, 0];
    F.q.forEach(function (p) { F.c[0] += p[0] / 4; F.c[1] += p[1] / 4; F.c[2] += p[2] / 4; });
  });
  var CORNERS = [];
  for (var i = 0; i < 8; i++) CORNERS.push([(i & 1) ? H : -H, (i & 2) ? H : -H, (i & 4) ? H : -H]);

  /* ── 색 판별 ── */
  // 기준색: 전개도 색 + 실제 형광 물감에 가까운 색 (실물이 생기면 화면에서 스스로 배움)
  var BASE = {
    1: [[48, 255, 85], [150, 255, 70]],
    2: [[255, 155, 100], [255, 110, 40]],
    3: [[255, 105, 155], [255, 60, 165]],
    4: [[0, 100, 255], [40, 90, 210]]
  };
  var learned = { 1: null, 2: null, 3: null, 4: null }, learnedSat = { 1: 0, 2: 0, 3: 0, 4: 0 };
  var CUT = 0.62;                       // 이보다 멀면 아무 색도 아님
  // 흰빛(세 색 중 제일 작은 값)을 빼고 나서 rgb 비율을 봄: 흰 벽이랑 섞인 가장자리 칸도 같은 색으로 보이게
  function feat(r, g, b) {
    var a = r - g, c = r - b, e = g - b, S = a * a + c * c + e * e || 1;
    var mn = Math.min(r, g, b), R = r - mn, G = g - mn, B = b - mn, T = R + G + B || 1;
    return [a * a / S, c * c / S, e * e / S, R / T, G / T, B / T];
  }
  function satOf(r, g, b) { var mx = Math.max(r, g, b); return mx ? (mx - Math.min(r, g, b)) / mx : 0; }
  function fdist(f, q) {
    return Math.abs(f[0] - q[0]) + Math.abs(f[1] - q[1]) + Math.abs(f[2] - q[2]) +
      1.5 * (Math.abs(f[3] - q[3]) + Math.abs(f[4] - q[4]) + Math.abs(f[5] - q[5]));
  }
  // 색 표: 모든 색 조합마다 (어느 색인지, 그 색이 얼마나 진하게 차 있는지 0~255)를 미리 계산해 둠
  var LUT = new Uint8Array(32768), LUTA = new Uint8Array(32768), lutDirty = true;
  var S_LOW = 0.12, S_BASE = 0.07;      // S_LOW보다 흐리면 배경, S_BASE = 벽 같은 배경의 보통 흐림 정도
  function buildLUT() {
    var protos = [], sref = [0, 0, 0, 0, 0];
    for (var k = 1; k <= 4; k++) {
      var sum = 0, n = 0;
      BASE[k].forEach(function (c) { protos.push([k, feat(c[0], c[1], c[2])]); sum += satOf(c[0], c[1], c[2]); n++; });
      if (learned[k]) { protos.push([k, learned[k]]); if (learnedSat[k]) { sum += learnedSat[k] * 2; n += 2; } }
      sref[k] = 0.9 * sum / n;
    }
    for (var r = 0; r < 32; r++) for (var g = 0; g < 32; g++) for (var b = 0; b < 32; b++) {
      var R = r * 8 + 4, G = g * 8 + 4, B = b * 8 + 4, i = (r << 10) | (g << 5) | b;
      var mx = Math.max(R, G, B), sat = satOf(R, G, B), cls = 0;
      LUT[i] = 0; LUTA[i] = 0;
      if (mx < 40 || mx - Math.min(R, G, B) < 16 || sat < S_LOW) continue;
      var f = feat(R, G, B), best = 1e9;
      for (var j = 0; j < protos.length; j++) {
        var dd = fdist(f, protos[j][1]);
        if (dd < best) { best = dd; cls = protos[j][0]; }
      }
      if (best > CUT) continue;
      // 가장자리 칸은 배경이랑 섞여서 흐려짐: 흐린 만큼만 그 색으로 침
      var a = (sat - S_BASE) / Math.max(0.1, sref[cls] - S_BASE);
      LUT[i] = cls; LUTA[i] = Math.round(255 * Math.max(0, Math.min(1, a)));
    }
    lutDirty = false;
  }
  function lutIdx(d, o) { return ((d[o] >> 3) << 10) | ((d[o + 1] >> 3) << 5) | (d[o + 2] >> 3); }

  /* ── 카메라 ── */
  var src = null, vw = 0, vh = 0, f = 1000, cx = 0, cy = 0;
  var fovDeg = opt.fovDeg || 65, fScale = 1;
  function setSource(el, w, h) {
    src = el; vw = w; vh = h;
    cx = vw / 2; cy = vh / 2;
    f = (Math.max(vw, vh) / 2) / Math.tan(fovDeg * Math.PI / 360) * fScale;
  }

  /* ── 위치·각도 → 카메라 방향 ──
     p = [u, v, d, az, el, roll]
     u,v: 화면에서 큐브 가운데 위치(픽셀), d: 큐브 가운데까지 거리(cm)
     az: 좌우 각도(+면 큐브 오른쪽에서 봄), el: 위아래 각도(-면 아래에서 올려다봄), roll: 화면 돌아간 정도 */
  function poseMat(p) {
    var az = p[3], el = p[4], rl = p[5];
    var wx = Math.cos(el) * Math.sin(az), wy = Math.sin(el), wz = Math.cos(el) * Math.cos(az);
    var C = [p[2] * wx, p[2] * wy, p[2] * wz];
    var Fw = [-wx, -wy, -wz];
    var rx = -Fw[2], rz = Fw[0], rn = Math.hypot(rx, rz) || 1e-9;
    var R = [rx / rn, 0, rz / rn];
    var D = [Fw[1] * R[2] - Fw[2] * R[1], Fw[2] * R[0] - Fw[0] * R[2], Fw[0] * R[1] - Fw[1] * R[0]];
    var c = Math.cos(rl), s = Math.sin(rl);
    var R2 = [c * R[0] + s * D[0], c * R[1] + s * D[1], c * R[2] + s * D[2]];
    var D2 = [-s * R[0] + c * D[0], -s * R[1] + c * D[1], -s * R[2] + c * D[2]];
    // 큐브가 화면 가운데가 아니라 (u,v)에 보이도록 살짝 더 돌림
    var qx = (p[0] - cx) / f, qy = (p[1] - cy) / f, qn = Math.sqrt(qx * qx + qy * qy + 1);
    qx /= qn; qy /= qn; var qz = 1 / qn;
    var vx = -qy, vy = qx, k = 1 / (1 + qz);
    var O = [1 - vy * vy * k, vx * vy * k, vy,
             vx * vy * k, 1 - vx * vx * k, -vx,
             -vy, vx, 1 - (vx * vx + vy * vy) * k];
    var L = [R2[0], R2[1], R2[2], D2[0], D2[1], D2[2], Fw[0], Fw[1], Fw[2]];
    var M = new Array(9);
    for (var r = 0; r < 3; r++) for (var q = 0; q < 3; q++)
      M[r * 3 + q] = O[r * 3] * L[q] + O[r * 3 + 1] * L[3 + q] + O[r * 3 + 2] * L[6 + q];
    return { M: M, C: C };
  }
  function project(pm, X, out) {
    var M = pm.M, a = X[0] - pm.C[0], b = X[1] - pm.C[1], e = X[2] - pm.C[2];
    var z = M[6] * a + M[7] * b + M[8] * e;
    if (z < 0.5) return false;
    out[0] = f * (M[0] * a + M[1] * b + M[2] * e) / z + cx;
    out[1] = f * (M[3] * a + M[4] * b + M[5] * e) / z + cy;
    return true;
  }

  /* ── 코드 안에서 큐브 그려보기 ──
     칸마다 "이 칸이 초록/주황/분홍/파랑으로 얼마나 덮이는지"를 0~1로 계산.
     모서리는 칸 하나 폭만큼 부드럽게 해서, 조금씩 움직여 볼 때 점수가 매끄럽게 바뀌게 함 */
  var tmp2 = [0, 0];
  function edgesOf(pts) {
    var n = pts.length, area = 0, e = [];
    for (var i = 0; i < n; i++) { var a = pts[i], b = pts[(i + 1) % n]; area += a[0] * b[1] - b[0] * a[1]; }
    var sgn = area > 0 ? 1 : -1;
    if (Math.abs(area) < 1e-6) return null;
    for (i = 0; i < n; i++) {
      var p = pts[i], q = pts[(i + 1) % n], dx = q[0] - p[0], dy = q[1] - p[1], len = Math.hypot(dx, dy) || 1e-9;
      var nx = -dy * sgn / len, ny = dx * sgn / len;
      e.push(nx, ny, -(nx * p[0] + ny * p[1]));
    }
    return e;
  }
  function sdist(e, x, y) {
    var m = 1e9;
    for (var i = 0; i < e.length; i += 3) { var v = e[i] * x + e[i + 1] * y + e[i + 2]; if (v < m) m = v; }
    return m;
  }
  function toGrid(roi, P) { return [(P[0] - roi.x) / roi.cs - 0.5, (P[1] - roi.y) / roi.cs - 0.5]; }

  // 결과를 pred에 채움. 큐브가 카메라 뒤로 넘어가면 false
  function ramp(sd, soft) { var v = 0.5 + sd / soft; return v <= 0 ? 0 : (v >= 1 ? 1 : v); }
  function render(p, roi, pred) {
    var G = roi.G, GG = G * G, pm = poseMat(p), soft = roi.soft, half = soft / 2, gap = roi.gap || 0;
    pred.fill(0);
    for (var fi = 0; fi < FACES.length; fi++) {
      var F = FACES[fi];
      var vx = pm.C[0] - F.c[0], vy = pm.C[1] - F.c[1], vz = pm.C[2] - F.c[2];
      if (F.n[0] * vx + F.n[1] * vy + F.n[2] * vz <= 0) continue;   // 안 보이는 면
      var Q = [];
      for (var k = 0; k < 4; k++) { if (!project(pm, F.q[k], tmp2)) return false; Q.push(toGrid(roi, tmp2)); }
      var eq = edgesOf(Q); if (!eq) continue;
      var et = null;
      if (F.tri) {
        var T = [];
        for (k = 0; k < 3; k++) { if (!project(pm, F.tri[k], tmp2)) return false; T.push(toGrid(roi, tmp2)); }
        et = edgesOf(T);
      }
      var x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
      for (k = 0; k < 4; k++) { x0 = Math.min(x0, Q[k][0]); x1 = Math.max(x1, Q[k][0]); y0 = Math.min(y0, Q[k][1]); y1 = Math.max(y1, Q[k][1]); }
      x0 = Math.max(0, Math.floor(x0 - soft)); y0 = Math.max(0, Math.floor(y0 - soft));
      x1 = Math.min(G - 1, Math.ceil(x1 + soft)); y1 = Math.min(G - 1, Math.ceil(y1 + soft));
      var tOff = F.tc ? (F.tc - 1) * GG : 0;
      for (var y = y0; y <= y1; y++) for (var x = x0; x <= x1; x++) {
        var sq = sdist(eq, x, y);
        if (sq <= -half) continue;
        var mq = sq >= half ? 1 : 0.5 + sq / soft, idx = y * G + x;
        if (et) {
          // 삼각형은 경계에서 gap만큼 안쪽까지, 초록은 gap만큼 바깥까지만 (사이는 비어 보임)
          var st = sdist(et, x, y), mt = ramp(st - gap, soft), mg = 1 - ramp(st + gap, soft);
          if (mt > mq) mt = mq;
          pred[idx] += mq * mg;
          pred[tOff + idx] += mt;
        } else pred[idx] += mq;
      }
    }
    return true;
  }

  /* ── 카메라 화면 보기 ── 큐브 근처만 네모로 잘라서 칸으로 나누고, 칸마다 색 비율을 셈 */
  var fcv = document.createElement('canvas'), fctx = fcv.getContext('2d', { willReadFrequently: true });
  var lastPix = null;
  function makeRoi(ux, uy, size) {
    // 픽셀 경계에 딱 맞춰 잘라야 그림을 옮길 때 흐려지지 않음
    size = Math.round(Math.max(16, Math.min(size, Math.min(vw, vh))));
    var x = Math.round(Math.max(0, Math.min(vw - size, ux - size / 2))), y = Math.round(Math.max(0, Math.min(vh - size, uy - size / 2)));
    var G = Math.max(12, Math.min(GRID, Math.round(size)));
    var cs = size / G;
    return { x: x, y: y, s: size, G: G, cs: cs, soft: Math.sqrt(1 + (1.0 / cs) * (1.0 / cs)), gap: MIX_GAP / cs };
  }
  function observe(roi, grids) {
    if (lutDirty) buildLUT();
    var D = Math.min(Math.ceil(roi.s), 200);
    fcv.width = D; fcv.height = D;
    fctx.imageSmoothingEnabled = true;
    fctx.drawImage(src, roi.x, roi.y, roi.s, roi.s, 0, 0, D, D);

    // 시험용: 한 장면을 처음부터 찾기
    acquireOnce: function () { state.p = null; state.lost = 99; return step(); },
    _internal: { roiFor: roiFor, residual: residual, agreement: agreement, render: render, makeRoi: makeRoi, observe: observe, coarse: coarse, acquire: acquire, refine: refine, LUT: function () { if (lutDirty) buildLUT(); return LUT; }, LUTA: function () { return LUTA; } }
  };
}
</script>
<script>
(function(){

/* 마커 테스트 (큐브 한 개 버전)

   - 큐브 가운데를 기준점(0,0,0)으로 두고 벽은 큐브 뒤쪽, 물고기는 벽 앞쪽에서만 헤엄침
   - 주소 끝에 #preview = 카메라 없이 돌려보기, #sim = 큐브를 실제처럼 그린 가짜 카메라로 인식 시험 */

var kit = ReefKit(THREE);
var REEF_ID = document.body.getAttribute('data-reef') || 'marker';
var PREVIEW = /preview/.test(location.hash);
var SIM = /sim/.test(location.hash);
var SPACE = /space/.test(location.hash);

/* ── 설정 (reef-data.json의 marker 설정에서 덮어씀) ── */
var C = {
  fishTotal:18, mix:['clownfish','blue-tang'], shells:[22,36,52,72], chargeEvery:6, chargeEffect:'',
  cubeCm:4, fovDeg:65, drop:14, wallGap:8
};
var DET_MS = 70;          // 몇 ms마다 큐브를 찾을지
var LOST_HIDE_MS = 700;   // 큐브를 놓친 뒤 이만큼 지나면 물고기 숨김

/* ── 화면 ── */
var video = document.getElementById('cam'), glc = document.getElementById('gl');
var gate = document.getElementById('gate'), hud = document.getElementById('hud'), bottomBar = document.getElementById('bottom');
var cCube = document.getElementById('cCube'), cDist = document.getElementById('cDist'), cAngle = document.getElementById('cAngle');
var cFit = document.getElementById('cFit'), cSim = document.getElementById('cSim');

var renderer = new THREE.WebGLRenderer({canvas:glc, alpha:true, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(60, 1, 1, 4000);
kit.lights(scene);
var fishGroup = new THREE.Group();
scene.add(fishGroup);
var fishes = [], talk = null, data = null;

/* ── 큐브 모형 만들기 ──
   look='real': 실제처럼 색칠한 큐브 (미리보기, 가짜 카메라용)
   look='ghost': 인식된 자리에 겹쳐 보이는 선 모양 */
var CUBE_COL = {1:'#30FF55', 2:'#FF9B64', 3:'#FF6999', 4:'#0064FF'};
function lin(hex){ return new THREE.Color(hex).convertSRGBToLinear(); }
function glow(hex, k){ return lin(hex).multiplyScalar(k); }
function makeCube(A, look){
  var H = A/2, g = new THREE.Group(), faces = cubeFaces(H);
  if (look === 'real'){
    g.add(new THREE.Mesh(new THREE.BoxBufferGeometry(A, A, A),
      new THREE.MeshLambertMaterial({color:lin(CUBE_COL[1]), emissive:glow(CUBE_COL[1], 0.18)})));
  } else {
    g.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxBufferGeometry(A, A, A)),
      new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:0.9, depthTest:false})));
  }
  faces.forEach(function(F){
    if (!F.tri) return;
    var pts = F.tri.map(function(p){ return new THREE.Vector3(p[0]+F.n[0]*0.02, p[1]+F.n[1]*0.02, p[2]+F.n[2]*0.02); });
    var geo = new THREE.BufferGeometry().setFromPoints(pts);

      g.add(new THREE.Mesh(geo, new THREE.MeshLambertMaterial({color:lin(CUBE_COL[F.tc]), emissive:glow(CUBE_COL[F.tc], 0.18)})));

      g.add(new THREE.LineLoop(geo, new THREE.LineBasicMaterial({color:CUBE_COL[F.tc], depthTest:false})));
    }

}
// 삼각형 앞면이 면 바깥쪽을 보게 순서 맞추기
function sameWay(p, n){
  var a = p[1].clone().sub(p[0]), b = p[2].clone().sub(p[0]), c = a.cross(b);
  return c.x*n[0] + c.y*n[1] + c.z*n[2] > 0;
}
function cubeFaces(H){ return CubeTracker({cubeCm:H*2}).faces; }

/* ── 물고기 떼: 큐브 아래, 벽 앞쪽에서 여러 거리의 궤도를 돎 ── */
function hash3(a,b,c){ var n = Math.sin(a*127.1 + b*311.7 + c*74.7) * 43758.5453; return n - Math.floor(n); }
function build(d){
  data = d;
  var r = kit.reef(d, REEF_ID);
  if (r) Object.keys(r.config).forEach(function(k){ C[k] = r.config[k]; });
  kit.applyStyle(d.style);
  fishes.forEach(kit.dispose); fishes = [];
  var mix = (C.mix || []).map(function(id){ return kit.find(d, id); }).filter(Boolean);
  if (!mix.length) mix = d.species.filter(function(m){ return m.motion === 'fish'; }).slice(0, 2);
  var charge = kit.effect(d, C.chargeEffect);
  var gap = (+C.wallGap || 8);
  for (var fi = 0; fi < (+C.fishTotal || 0) && mix.length; fi++){
    var m = mix[fi % mix.length];
    var typeIdx = Math.floor(fi / mix.length);
    var variant = m.variants.length ? m.variants[typeIdx % m.variants.length] : null;
    var shell = C.shells[fi % C.shells.length] || 30;
    var j1 = hash3(fi,1,7), j2 = hash3(fi,2,3), j3 = hash3(fi,3,9);
    var rz = shell*(0.5+j3*0.3);
    var lane = {
      cx:(j1-0.5)*16, rx:shell*(0.82+j2*0.34), ry:3+j1*3,
      // 벽 뒤로 안 들어가게: 궤도 가운데를 반지름만큼 앞으로 뺌
      cz:rz + gap + j2*6, rz:rz,
      sp:0.07*(0.75+j3*0.5), ph:(fi/C.fishTotal)*Math.PI*2 + j1*1.6,
      cy:-(+C.drop || 14) - shell*0.34 - j2*9

    var fx = (C.chargeEvery > 0 && fi % C.chargeEvery === 0 && charge) ? [charge] : [];
    var f = kit.build(m, {variant:variant, effects:fx, phase:lane.ph, scale:0.82 + j1*0.32});
    f.userData.lane = lane;
    fishGroup.add(f); fishes.push(f);
  }
  if (!talk) talk = kit.Talk(document.getElementById('stage'), camera, d.style); else { talk.setStyle(d.style); talk.clear(); }
  fishes.forEach(function(f){ kit.steer(f, f.userData.lane, 0); });
  setupCube();
}

/* ── 큐브 찾기 엔진 ── */
var tracker = null, trackerCm = 0;
var CAL_KEY = 'reefCubeFScale';
function loadCal(){ if (SIM) return 1; try { return +localStorage.getItem(CAL_KEY) || 1; } catch(e){ return 1; } }
function saveCal(v){ try { if (v === 1) localStorage.removeItem(CAL_KEY); else localStorage.setItem(CAL_KEY, String(v)); } catch(e){} }
var ghost = null, occluder = null, previewCube = null;
function setupCube(){
  var A = +C.cubeCm || 4;
  if (!tracker || trackerCm !== A){
    tracker = CubeTracker({cubeCm:A, fovDeg:+C.fovDeg || 65});
    tracker.setFov(+C.fovDeg || 65, loadCal());
    trackerCm = A;
    [ghost, occluder, previewCube].forEach(function(o){ if (o) scene.remove(o); });
    ghost = makeCube(A, 'ghost'); ghost.visible = false; scene.add(ghost);
    // 물고기가 큐브 뒤로 지나가면 가려지게 (색은 안 칠하고 깊이만)
    occluder = new THREE.Mesh(new THREE.BoxBufferGeometry(A, A, A), new THREE.MeshBasicMaterial({colorWrite:false}));
    occluder.renderOrder = -1; scene.add(occluder);
    if (PREVIEW){ previewCube = makeCube(A, 'real'); scene.add(previewCube); }
    if (SIM) sim.rebuild(A);
    fitCamera();
  } else tracker.setFov(+C.fovDeg || 65, loadCal());
}

/* ── 가짜 카메라 (#sim) ──
   벽, 형광 큐브, 헷갈리게 하는 비슷한 색 물건들을 조명 아래 실제처럼 그리고,
   살짝 흐림 + 노이즈를 넣어서 진짜 폰 카메라 화면처럼 만든 뒤 인식기에 넣음 */
var sim = (function(){
  var W = 1080, H = 1920;
  var view = null, glR = null, sc = null, cam = null, cube = null, noise = null, out = null, octx = null;
  var truth = [W/2, H/2, 150, 0.3, -0.5, 0], auto = true, exposure = 1;
  function tex(w, h, fill){ var c = document.createElement('canvas'); c.width = w; c.height = h; fill(c.getContext('2d'), w, h); return c; }
  function init(){
    out = document.createElement('canvas'); out.width = W; out.height = H; out.id = 'simView';
    octx = out.getContext('2d', {willReadFrequently:true});
    document.getElementById('stage').insertBefore(out, glc);
    video.classList.add('hidden');
    var gc = document.createElement('canvas'); gc.width = W; gc.height = H;
    glR = new THREE.WebGLRenderer({canvas:gc, antialias:true, preserveDrawingBuffer:true});
    glR.outputEncoding = THREE.sRGBEncoding;
    glR.toneMapping = THREE.LinearToneMapping;
    sc = new THREE.Scene(); sc.background = new THREE.Color('#8a8680');
    cam = new THREE.PerspectiveCamera(50, W/H, 1, 5000);
    // 벽: 살짝 얼룩진 흰 벽
    var wallTex = new THREE.CanvasTexture(tex(256, 256, function(g, w, h){
      g.fillStyle = '#E9E5DC'; g.fillRect(0, 0, w, h);
      for (var i = 0; i < 3000; i++){ var v = 205 + Math.random()*40 | 0; g.fillStyle = 'rgba('+v+','+(v-4)+','+(v-12)+',0.35)'; g.fillRect(Math.random()*w, Math.random()*h, 2, 2); }
    }));
    wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping; wallTex.repeat.set(12, 12);
    wallTex.encoding = THREE.sRGBEncoding;
    var wall = new THREE.Mesh(new THREE.PlaneBufferGeometry(1200, 800), new THREE.MeshLambertMaterial({map:wallTex}));
    wall.position.set(0, -150, -2.01); sc.add(wall);
    var floor = new THREE.Mesh(new THREE.PlaneBufferGeometry(1200, 1200), new THREE.MeshLambertMaterial({color:lin('#6b5a4a')}));
    floor.rotation.x = -Math.PI/2; floor.position.set(0, -260, 500); sc.add(floor);
    // 헷갈리게 하는 물건: 살구색 포스터, 초록 화분, 흐린 분홍 스티커, 주황 책 등
    [[-70,-55,34,46,'#C98A60'],[85,-95,40,60,'#3E8A45'],[45,30,10,10,'#D98FAE'],[-40,-140,26,18,'#E0782E'],[120,10,20,28,'#4a70c8']].forEach(function(s){
      var m = new THREE.Mesh(new THREE.PlaneBufferGeometry(s[2], s[3]), new THREE.MeshLambertMaterial({color:lin(s[4])}));
      m.position.set(s[0], s[1], -1.9); sc.add(m);
    });
    sc.add(new THREE.HemisphereLight(0xffffff, 0x5a5048, 0.45));
    var lamp = new THREE.PointLight(0xfff4e6, 0.6, 0, 1); lamp.position.set(40, 160, 180); sc.add(lamp);
    var sun = new THREE.DirectionalLight(0xffffff, 0.25); sun.position.set(-0.4, 1, 0.7); sc.add(sun);
    noise = tex(256, 256, function(g, w, h){
      var im = g.createImageData(w, h);
      for (var i = 0; i < w*h*4; i += 4){ var v = 128 + (Math.random()-0.5)*110; im.data[i] = im.data[i+1] = im.data[i+2] = v; im.data[i+3] = 255; }
      g.putImageData(im, 0, 0);
    });
    cSim.classList.remove('hidden');
  }
  function rebuild(A){
    if (!sc) init();
    if (cube) sc.remove(cube);
    cube = makeCube(A, 'real'); sc.add(cube);
  }
  // 정답 위치로 가짜 카메라 옮기고 한 장 찍기
  function shoot(){
    tracker.setSource(out, W, H);
    var f = tracker.focal() / tracker.fScale();
    cam.fov = 2*Math.atan((H/2)/f)*180/Math.PI; cam.aspect = W/H; cam.updateProjectionMatrix();
    placeCam(cam, tracker.poseMat(truth));
    glR.toneMappingExposure = exposure;
    glR.render(sc, cam);
    octx.filter = 'blur(0.6px)';
    octx.drawImage(glR.domElement, 0, 0);
    octx.filter = 'none';
    octx.globalCompositeOperation = 'overlay'; octx.globalAlpha = 0.18;
    var pat = octx.createPattern(noise, 'repeat');
    octx.save(); octx.translate(Math.random()*256, Math.random()*256); octx.fillStyle = pat; octx.fillRect(-256, -256, W+512, H+512); octx.restore();
    octx.globalCompositeOperation = 'source-over'; octx.globalAlpha = 1;
  }
  var dMid = 160, dAmp = 120;
  function path(t){
    var d = dMid + dAmp*Math.sin(t*0.11);
    return [W/2 + 220*Math.sin(t*0.37), H/2 + 380*Math.sin(t*0.23+1), d,
            0.75*Math.sin(t*0.19), -0.55 + 0.4*Math.sin(t*0.13+2), 0.3*Math.sin(t*0.29)];
  }

    rebuild: rebuild, shoot: shoot, size: function(){ return [W, H]; }, el: function(){ return out; },
    tick: function(t){ if (auto) truth = path(t); },
    truth: function(){ return truth.slice(); },
    set: function(p){ truth = p.slice(); auto = false; },
    exposure: function(v){ exposure = v; },
    range: function(a, b){ dMid = (a+b)/2; dAmp = (b-a)/2; },
    auto: function(on){ auto = !!on; }
  };
})();

/* ── 인식된 위치로 카메라 놓기 ──
   엔진 계산은 (오른쪽, 아래, 앞) 방향 기준이고 three.js는 (오른쪽, 위, 뒤) 기준이라 축 두 개를 뒤집음 */
var _m4 = new THREE.Matrix4(), _ax = new THREE.Vector3(), _ay = new THREE.Vector3(), _az = new THREE.Vector3();
function placeCam(cam, pm){
  var M = pm.M;
  _ax.set(M[0], M[1], M[2]); _ay.set(-M[3], -M[4], -M[5]); _az.set(-M[6], -M[7], -M[8]);
  _m4.makeBasis(_ax, _ay, _az);
  cam.quaternion.setFromRotationMatrix(_m4);
  cam.position.set(pm.C[0], pm.C[1], pm.C[2]);
  cam.updateMatrixWorld(true);
}

function srcSize(){
  if (SIM) return sim.size();
  return [video.videoWidth || 1280, video.videoHeight || 720];
}
function fitCamera(){
  var sw = window.innerWidth, sh = window.innerHeight;
  renderer.setSize(sw, sh, false);
  if (PREVIEW){ camera.clearViewOffset(); camera.fov = 50; camera.aspect = sw / Math.max(1, sh); camera.updateProjectionMatrix(); return; }
  var s = srcSize(), vw = s[0], vh = s[1];
  if (tracker) tracker.setSource(SIM ? sim.el() : video, vw, vh);
  var f = tracker ? tracker.focal() : (Math.max(vw, vh)/2) / Math.tan(C.fovDeg*Math.PI/360);
  camera.fov = 2*Math.atan(vh/(2*f)) * 180/Math.PI;
  camera.aspect = vw/vh;
  var scale = Math.max(sw/vw, sh/vh), cw = sw/scale, ch = sh/scale;
  camera.setViewOffset(vw, vh, (vw-cw)/2, (vh-ch)/2, cw, ch);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', fitCamera);
video.addEventListener('loadedmetadata', fitCamera);

/* ── 찾은 결과를 부드럽게 ── 손떨림에 화면이 덜덜 떨리지 않게 조금씩 따라감 */
var smooth = null, lastSeen = 0, shown = {d:0, az:0, el:0};
function angDiff(a, b){ return Math.atan2(Math.sin(a-b), Math.cos(a-b)); }
function follow(p){
  if (!smooth){ smooth = p.slice(); shown = {d:p[2], az:p[3], el:p[4]}; return; }
  var k = [0.6, 0.6, 0.45, 0.45, 0.45, 0.55];
  for (var i = 0; i < 6; i++) smooth[i] += (i === 5 ? angDiff(p[i], smooth[i]) : p[i] - smooth[i]) * k[i];
  shown.d += (p[2]-shown.d)*0.25; shown.az += (p[3]-shown.az)*0.25; shown.el += (p[4]-shown.el)*0.25;
}
function deg(r){ return Math.round(r*180/Math.PI); }
function sideText(a, pos, neg){ var v = deg(a); return v === 0 ? '0°' : (v > 0 ? pos + ' ' + v : neg + ' ' + (-v)) + '°'; }

function detectOnce(){
  var st = tracker.step();
  if (st.found){ lastSeen = performance.now(); follow(st.p); }
  var seen = performance.now() - lastSeen < LOST_HIDE_MS && smooth;
  cCube.textContent = st.found ? (st.mode === 'track' ? 'CUBE 따라가는 중' : 'CUBE 찾음') : 'CUBE 찾는 중';
  cCube.className = 'chip' + (st.found ? ' on' : ' off');
  cFit.textContent = 'FIT ' + (st.found ? Math.round(st.score*100) + '%' : '—');
  if (seen){
    cDist.textContent = Math.round(shown.d) + ' cm';
    cAngle.textContent = '좌우 ' + sideText(shown.az, '오른쪽', '왼쪽') + ' · 상하 ' + sideText(shown.el, '위', '아래');
  }
  if (SIM){
    var tr = sim.truth();
    cSim.textContent = 'SIM 정답 ' + Math.round(tr[2]) + 'cm ' + deg(tr[3]) + '° ' + deg(tr[4]) + '°' +
      (st.found ? ' · 오차 ' + Math.round(st.p[2]-tr[2]) + 'cm ' + deg(st.p[3]-tr[3]) + '° ' + deg(st.p[4]-tr[4]) + '°' : '');
  }
  return st;
}

/* ── 미리보기 모드: 카메라 없이 돌려보기 ── */
var orbit = {theta:0.5, phi:1.5, radius:170, target:new THREE.Vector3(0,-30,25)};
function applyOrbit(){
  orbit.phi = Math.max(0.1, Math.min(Math.PI-0.1, orbit.phi));
  orbit.radius = Math.max(30, Math.min(600, orbit.radius));
  var sp = Math.sin(orbit.phi);
  camera.position.set(orbit.target.x + orbit.radius*sp*Math.sin(orbit.theta),
                      orbit.target.y + orbit.radius*Math.cos(orbit.phi),
                      orbit.target.z + orbit.radius*sp*Math.cos(orbit.theta));
  camera.lookAt(orbit.target);
}
function addWall(){
  // 큐브 뒤 벽 (반투명)
  var wall = new THREE.Mesh(new THREE.PlaneBufferGeometry(260, 200), new THREE.MeshBasicMaterial({color:0x2A2346, side:THREE.DoubleSide, transparent:true, opacity:0.55}));
  wall.position.set(0, -60, -(+C.cubeCm || 4)/2 - 0.05); scene.add(wall);
}

/* ── 버튼 ── */
document.getElementById('reset').addEventListener('click', function(){ tracker.reset(); smooth = null; lastSeen = 0; });
var ghostBtn = document.getElementById('ghost'), ghostOn = true;
ghostBtn.addEventListener('click', function(){ ghostOn = !ghostOn; ghostBtn.classList.toggle('on', ghostOn); });
// 폰을 큐브에서 딱 1m 떨어뜨리고 누르면, 지금 보이는 거리가 100cm가 되도록 화각을 보정함
document.getElementById('cal').addEventListener('click', function(){
  if (!tracker.state.found || !smooth) return;
  var v = tracker.fScale() * 100 / shown.d;
  tracker.setFov(+C.fovDeg || 65, v); saveCal(v); fitCamera(); tracker.reset(); smooth = null;
});
document.getElementById('calClear').addEventListener('click', function(){
  tracker.setFov(+C.fovDeg || 65, 1); saveCal(1); fitCamera(); tracker.reset(); smooth = null;
});

/* ── 손가락 ── */
var downAt = null, lastP = null;
glc.addEventListener('pointerdown', function(e){ downAt = {x:e.clientX, y:e.clientY, t:performance.now()}; lastP = {x:e.clientX, y:e.clientY}; try{ glc.setPointerCapture(e.pointerId); }catch(er){} });
glc.addEventListener('pointermove', function(e){
  if (!PREVIEW || !lastP) return;
  orbit.theta -= (e.clientX-lastP.x)*0.006; orbit.phi -= (e.clientY-lastP.y)*0.006;
  lastP = {x:e.clientX, y:e.clientY}; applyOrbit();
});
glc.addEventListener('pointerup', function(e){
  if (downAt && Math.hypot(e.clientX-downAt.x, e.clientY-downAt.y) < 8 && performance.now()-downAt.t < 450){
    var f = kit.pick(camera, e.clientX/window.innerWidth*2-1, -(e.clientY/window.innerHeight)*2+1, fishes);
    if (f && talk) talk.say(f, kit.nextLine(f));
  }
  downAt = null; lastP = null;
});
glc.addEventListener('wheel', function(e){ if (!PREVIEW) return; e.preventDefault(); orbit.radius *= Math.exp(e.deltaY*0.0013); applyOrbit(); }, {passive:false});

/* ── 움직이기 ── */
var clock = new THREE.Clock(), t = 0, lastDetect = 0, running = PREVIEW, simPaused = false;
function frame(){
  requestAnimationFrame(frame);
  var dt = Math.min(clock.getDelta(), 0.05);
  t += dt;
  if (!PREVIEW && running && tracker){
    var now = performance.now();
    if (now - lastDetect > DET_MS){
      lastDetect = now;
      if (SIM && !simPaused){ sim.tick(t); sim.shoot(); }
      detectOnce();
    }
    var seen = smooth && now - lastSeen < LOST_HIDE_MS;
    fishGroup.visible = !!seen;
    ghost.visible = !!seen && ghostOn;
    if (smooth) placeCam(camera, tracker.poseMat(smooth));
  }
  kit.tick(t);
  for (var i=0; i<fishes.length; i++){
    kit.steer(fishes[i], fishes[i].userData.lane, t);
    kit.animate(fishes[i], t);
  }
  if (talk) talk.update();
  renderer.render(scene, camera);
}

/* ── 시작 ── */
function fail(msg){ gate.classList.remove('hidden'); document.getElementById('gatemsg').textContent = msg; }
function started(){ gate.classList.add('hidden'); hud.classList.remove('hidden'); bottomBar.classList.remove('hidden'); running = true; fitCamera(); }
document.getElementById('go').addEventListener('click', function(){
  if (SIM){ started(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    fail('이 브라우저에서는 카메라를 쓸 수 없어요. Safari나 Chrome에서 열어주세요.'); return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080}}, audio:false})
    .then(function(stream){ video.srcObject = stream; return video.play(); })
    .then(started)
    .catch(function(err){ fail('카메라 권한이 거부됐어요 (' + (err && err.name ? err.name : 'error') + '). https 주소인지, 권한 설정을 확인해주세요.'); });
});

// 시험용 손잡이 (#sim에서 자동 시험할 때 씀)
window.reefMarker = {
  sim: sim, tracker: function(){ return tracker; }, detect: detectOnce,
  pause: function(on){ simPaused = !!on; }, start: started
};

var gotLive = false;
kit.loadData().then(function(d){
  if (!gotLive) build(d);
  kit.watchData(d.updated, build);
}).catch(function(e){ fail('reef-data.json을 읽지 못했어요: ' + (e && e.message || e)); });
kit.onLiveData(function(d, m){ gotLive = true; if (m && m.reef) REEF_ID = m.reef; build(d); });

if (PREVIEW){
  gate.classList.add('hidden');
  if (SPACE){
    var st = document.getElementById('stage'), fx = document.createElement('img');
    fx.className = 'bgfx'; fx.src = 'assets/reef/water-tank.webp'; fx.alt = '';
    st.classList.add('space'); st.insertBefore(fx, st.firstChild);
  }
  addWall();
  applyOrbit();
}
fitCamera();
frame();
})();
</script>
